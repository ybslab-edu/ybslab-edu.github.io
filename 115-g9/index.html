<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九年級資訊科技｜YBS Lab</title>
<meta name="description" content="九年級資訊科技每週課堂活動">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 單欄週次清單，最新一週在最上面且最醒目；顏色沿用活動頁 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#211B17; --muted:#5D6670; --line:#D3D9E0;
  --accent:#BD6216; --accent-soft:#FBEAD9; --night:#17151F; --night-ink:#F3EDE4; --night-muted:#B9B2C7;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171B; --surface:#1D2127; --ink:#ECEFF2; --muted:#9AA3AD; --line:#323942;
  --accent:#F0A45E; --accent-soft:#3A2A1B; --night:#0E0D14; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);margin:0;line-height:1.15;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.weeks{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.wk .no{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:14px;grid-row:span 2;align-self:start;padding-top:4px}
.wk h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.25}
.wk .topic{margin:0;color:var(--muted);font-size:14.5px;grid-column:2}
.wk .blurb{margin:0;grid-column:2}
.wk .go{grid-column:3;grid-row:1 / span 3;font-weight:700;text-decoration:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;white-space:nowrap}
.wk.latest{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.wk.latest .no,.wk.latest .topic{color:var(--night-muted)}
.wk.latest .go{background:var(--accent);color:var(--night)}
.badge{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.05em;background:var(--accent);color:var(--night);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
@media (max-width:560px){.wk{grid-template-columns:minmax(0,1fr)}.wk .no{grid-row:auto}.wk .topic,.wk .blurb,.wk .go{grid-column:1;grid-row:auto}.wk .go{justify-self:start;margin-top:6px}}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--muted)}
.brand{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="../">YBS Lab</a>
    <h1>九年級資訊科技</h1>
    <p>115 學年｜每週一個任務。點進去，先填班級座號再開始。</p>
  </header>
  <ol class="weeks" id="weeks" reversed></ol>
  <noscript><p>請開啟瀏覽器的 JavaScript 才能使用。</p></noscript>
  <footer><span>課堂活動與成績碼只存在你自己的電腦上，不會上傳個人資料。</span><span><a href="../">YBS Lab 首頁</a>　<a href="teacher/">教師專區</a></span></footer>
</div>
<script src="weeks.js"></script>
<script>
const list=[...WEEKS].sort((a,b)=>b.week-a.week);
document.getElementById('weeks').innerHTML=list.map((w,i)=>
  '<li class="wk'+(i===0?' latest':'')+'">'+
  '<span class="no">W'+String(w.week).padStart(2,'0')+'</span>'+
  '<h2>'+w.title+(i===0?'<span class="badge">本週</span>':'')+'</h2>'+
  '<a class="go" href="'+w.path+'">開始</a>'+
  '<p class="topic">'+w.topic+'</p>'+
  '<p class="blurb">'+w.blurb+'</p></li>').join('');
</script>
</body>
</html>
