<h1>課綱達成報告</h1>
<p>九年級課程 · 115-g9。列出國中課綱項目與對應活動；現有代碼屬於「學習內容」，作為課綱達成的教學紀錄參考。</p>

<section aria-label="課綱報告">
<p>分母為名冊內的有效班座人數（含尚未過關者），只採計登入帳號過關紀錄。學生完成一個項目所有已開放活動的全部關卡才算達成；未開放活動不納入項目達成率。無已開放活動或無名冊時顯示「—」。通行碼解鎖不代表雲端讀取權限。</p>
