<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":30,"course":"115-g9","unit":0,"title":"登入，出發","rounds":[{"name":"登入因材網","now":"每一堂課的前 12 分鐘，都要先在因材網看影片、做練習題。今天先確認每個人都登入得進去。","goal":"把登入因材網的步驟，照順序排好。","learn":"因材網用的是新竹縣的教育雲端帳號（縣市帳號）。登不進去時，先看是不是選錯縣市或身分、密碼的英文大小寫打錯，再舉手問老師。"},{"name":"電腦教室規則","now":"電腦教室有五條規則。下面這些狀況，各違反了哪一條？","goal":"把每一個狀況，放到它違反的那一條規則。","learn":"五條規則：依照號碼入座、不飲食、認真上課學習、尊重同學、離開前登出帳號、關機、把鍵盤靠緊螢幕腳架並把滑鼠放在腳架上。愛護設備，大家共同維護。"},{"name":"成績怎麼算","now":"這一科的學期成績分成三部分：認知 30%、情意 30%、技能 40%。","goal":"把每一件事，放到它算在哪一部分。","learn":"認知 30%：期末紙筆測驗（題庫 50 題，抽 25 題）。情意 30%：學習態度、學習互助。技能 40%：YBS Lab 的實作過關紀錄（學校帳號登入，每過一關自動記錄；登入不了時改填班級座號，自動上傳未驗證紀錄）。技能占最多，所以每一堂的實作都很重要。"},{"name":"這學期的故事","now":"這學期每一週，都會跟著小安和偶像團體「六連星」的後援會走一段故事。","goal":"照故事發生的先後，把這些事排好。","learn":"上學期三個單元串成一條故事：系統平台（搶票、換手機、直播）→ 數位化與資料處理（演唱會、問卷、跨年影片）→ 網路技術與服務（後援會擴大、海纜斷線、問 AI）。每一週的故事，都藏著當週要學的科技。"}]});</script></body></html>
