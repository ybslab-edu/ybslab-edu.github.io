<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":26,"course":"115-g9","unit":1,"title":"開賣倒數十秒","rounds":[{"name":"這是哪一種電腦","now":"六連星第一場演唱會今晚 8 點開賣。小安從起床到搶票，碰到好多台「電腦」，它們長得一點都不像。","goal":"把每一台電腦分到它的平台類別。","learn":"系統平台可以分成個人電腦、行動裝置、伺服器（雲端）和嵌入式系統。嵌入式系統藏在電器和機器裡，只做一件事，數量其實是最多的。"},{"name":"拆成三層","goal":"把每一張卡片放進它屬於的那一層。","learn":"每一台電腦都分三層：最下面是硬體，中間是作業系統，最上面是應用程式。應用程式不直接碰硬體，要透過作業系統幫忙。"},{"name":"新的電腦平台","now":"這幾年出現了很多新的電腦平台，它們不像電腦，裡面卻都有處理器和軟體。","goal":"把每一個新裝置分到它屬於的新興平台。","learn":"穿戴裝置、智慧家庭、無人載具、虛擬實境都是新興系統平台。它們多半很小、隨時連網，而且一直在蒐集你的資料。"},{"name":"哪一層出問題","now":"搶票前一晚，班上同學的手機一個比一個怪。小安想幫大家找出是哪一層出了問題。","goal":"判斷每一個狀況，是硬體、作業系統，還是應用程式出了問題。","learn":"分層的好處：哪一層壞了就修哪一層。零件壞了送修，系統壞了重灌或更新系統，只有一個 App 壞了就更新或重裝那個 App。"}]});</script></body></html>
