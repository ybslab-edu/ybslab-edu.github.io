<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":27,"course":"115-g9","unit":1,"title":"加場搶票被踢出來","rounds":[{"name":"輪流用 CPU","now":"加場開賣前，小安手機裡有幾個 App 同時要用 CPU。手機裡有一個看不見的「管家」，負責決定這一格時間給誰。","goal":"把每一格時間排給一個 App，讓每個 App 都在時限內做完。","learn":"作業系統把 CPU 的時間切成很短的一格一格，輪流分給每個程式，切換快到你以為它們同時在跑。排得不好，就會有程式卡住、來不及做完。"},{"name":"看懂工作管理員","now":"手機開始發燙、變卡。小安打開「工作管理員」，看每個 App 正在用多少 CPU 和記憶體。","learn":"工作管理員是作業系統給你看的「管家帳本」：每個程式用了多少 CPU、多少記憶體。電腦卡住時，先看這裡找兇手。手機在設定的「電池」或「記憶體」裡也看得到類似的資料。"},{"name":"有人插隊","now":"開賣倒數中，有一個 App 晚一點才有工作要做（例如 LINE 第幾格才跳出新訊息）。管家要邊做邊調整。","goal":"把每一格時間排給一個 App：還沒出現的工作不能先做，每個 App 都要在時限內做完。","learn":"作業系統隨時都在重新排隊：新工作插進來，就重新比較誰最急。手機切換 App、通知跳出來的瞬間，管家已經重排好幾次了。"},{"name":"記憶體不夠了","goal":"像管家一樣，決定要關掉哪些背景 App，空出夠用的記憶體。","learn":"記憶體不夠時，作業系統會先關掉最久沒用的背景 App。所以切回很久沒用的 App，常常要重新載入；手機的 RAM 越大，能留在背景的 App 越多。"}]});</script></body></html>
