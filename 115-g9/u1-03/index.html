<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":28,"course":"115-g9","unit":1,"title":"為了演唱會換手機","rounds":[{"name":"倒帶時間軸","now":"新手機發表會上，主持人說：「這支手機比 1946 年那台占滿整個房間的電腦還強幾百萬倍。」小安想知道中間發生了什麼事。","goal":"把這些事件由早到晚排好。","learn":"電腦硬體一路從真空管、電晶體、積體電路走到超大型積體電路。零件越小，電腦就越小、越快、越便宜，最後整台電腦放進口袋。"},{"name":"它是哪一代","now":"小安在科技館看到一面「電腦的四個世代」展示牆，說明牌被風吹亂了。","goal":"把每一張說明牌放回它屬於的世代。","learn":"每一代都是同一件事：把開關做得更小、放得更多。今天手機晶片裡的電晶體，小到要用奈米來量。"},{"name":"晶片環遊世界","now":"小安的新手機裡那顆晶片，在送到他手上之前，已經繞了大半個地球。","goal":"照晶片真正經過的順序，排出它的旅程。","learn":"一顆晶片要經過設計、晶圓製造、封裝測試、組裝，才到你手上，每一站常在不同國家。台灣在晶圓製造和封裝測試都是全世界最重要的地方之一，所以全世界的手機、電腦和 AI 伺服器都需要台灣的晶片。"},{"name":"每兩年翻一倍","learn":"「每兩年翻一倍」叫作摩爾定律。翻倍看起來不多，連續翻幾十年就是幾百萬倍，這就是手機一年比一年強的原因。現在電晶體已經小到接近原子的大小，翻倍越來越難，所以工程師改用把晶片疊起來、包在一起的先進封裝繼續變強。"}]});</script></body></html>
