<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":29,"course":"115-g9","unit":1,"title":"演唱會倒數直播","rounds":[{"name":"收進來還是送出去","now":"演唱會倒數三週，小安想開直播陪後援會的朋友一起倒數。他把要用的設備全部擺上桌。","goal":"判斷每一個設備，是把東西收進電腦（輸入）、從電腦送出來（輸出），還是兩件事都做。","learn":"把資料收進電腦的是輸入單元，把結果送出來給人看、聽、感覺的是輸出單元。觸控螢幕一邊顯示、一邊感應手指，兩件事都做。"},{"name":"輸入、處理、輸出","now":"直播開始了，聊天室一直刷，斗內音效也響了。每一個瞬間，電腦都在做三種事的其中一種。","goal":"把每一件事分成輸入、處理或輸出。","learn":"所有電腦做的事，都是「輸入 → 處理 → 輸出」。中間的處理，靠的是 CPU 和記憶體；下一站「深夜手搖店」要把它們拆開來看。"},{"name":"幫小裝置挑零件","now":"後援會想做幾個小裝置帶去演唱會和教室用。每個小裝置都是一台小電腦：要一個輸入零件感測外面，一個輸出零件做出反應。","goal":"幫每一個小裝置，各挑一個輸入零件和一個輸出零件。","learn":"智慧手環、夜燈、溫度計，都是「感測器輸入 → 晶片處理 → 輸出反應」的小電腦。換掉輸入或輸出零件，同一顆晶片就能做出完全不同的東西。"},{"name":"直播的一秒鐘","goal":"把這一秒鐘裡發生的事，照順序排好。","learn":"一秒鐘裡，輸入單元收資料、記憶單元先放好、算術邏輯單元算和比、控制單元決定下一步、輸出單元送出結果。五大單元每秒要這樣跑好幾十億次。"}]});</script></body></html>
