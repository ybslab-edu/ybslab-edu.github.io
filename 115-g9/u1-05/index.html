<style>
/* Layout: 上方客人點單 → 中間「單子盒」點卡片放進「順序格」 → 下方店長／搖飲師／出餐口即時演出；單元顏色與簡報一致 */
:root{--mem:var(--a);--mem-soft:var(--a-soft);--alu:var(--b);--alu-soft:var(--b-soft)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.ptitle h2{margin:0;font-family:var(--f-display);font-size:19px}
.t-mem{color:var(--mem);background:var(--mem-soft)} .t-cu{color:var(--cu);background:var(--cu-soft)}
.t-alu{color:var(--alu);background:var(--alu-soft)} .t-out{color:var(--out);background:var(--out-soft)}

.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;transition:border-color .2s,background .2s}
.cell .addr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell .lab{font-size:14px;color:var(--muted)}
.cell .val{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--mem);min-height:1.3em}
.cell.hit{border-color:var(--mem);background:var(--mem-soft)}
.power{display:flex;gap:8px;flex-wrap:wrap}

.pool,.slots{display:flex;flex-direction:column;gap:8px}
.pool{flex-direction:row;flex-wrap:wrap}
.card{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.35}
.card:hover{border-color:var(--ink)}
.card.used{visibility:hidden}
.slot{display:flex;align-items:center;gap:10px;min-height:48px}
.slot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.slot .card{flex:1}
.slot .empty{flex:1;border:2px dashed var(--line);border-radius:10px;min-height:44px;display:flex;align-items:center;padding-inline:12px;color:var(--muted);font-size:14px}
.slot.now .card{border-color:var(--cu);background:var(--cu-soft)}
.slot.bad .card{border-color:var(--warn)}


.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stage{grid-template-columns:minmax(0,1fr)}}
.cpu-unit{border-left:6px solid var(--line);min-height:120px}
.cpu-unit.cu{border-left-color:var(--cu)} .cpu-unit.alu{border-left-color:var(--alu)} .cpu-unit.outp{border-left-color:var(--out)}
.cpu-unit.on.cu{background:var(--cu-soft)} .cpu-unit.on.alu{background:var(--alu-soft)} .cpu-unit.on.outp{background:var(--out-soft)}
.cpu-unit .say{font-size:16px;min-height:3em}
.hand{font-family:var(--f-mono);font-size:30px;font-weight:700;color:var(--alu);line-height:1}
.outv{font-size:24px;font-weight:700;color:var(--out)}
.outv.no{color:var(--warn)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const WEEK=1;
const TERM_WEEK=7, TITLE='深夜手搖店 CPU', COURSE='115-g9';

const ROUNDS=[
 {lv:1,name:'第 1 單',says:'我要 1 杯紅茶（25 元），加珍珠（10 元）。',
  wall:{11:'單價',12:'加料'},tests:[{11:25,12:10},{11:40,12:15}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'加上「加料」',op:'add',c:12},{t:'送到出餐口',op:'out'}],sol:[0,1,2]},
 {lv:1,name:'第 2 單',says:'2 杯珍奶（每杯 60 元），再加一份布丁（10 元）。',tip:'先乘還是先加，算出來一樣嗎？',
  wall:{11:'單價',12:'杯數',13:'加料'},tests:[{11:60,12:2,13:10},{11:50,12:3,13:5}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'乘上「杯數」',op:'mul',c:12},{t:'加上「加料」',op:'add',c:13},{t:'送到出餐口',op:'out'}],sol:[0,1,2,3]},
 {lv:2,name:'錢夠不夠？',says:'3 杯珍奶（每杯 60 元）加布丁（10 元）。我只有 150 元，夠嗎？',tip:'盒子裡有一張用不到的卡。',
  wall:{11:'單價',12:'杯數',13:'加料',14:'預算'},tests:[{11:60,12:3,13:10,14:150},{11:60,12:2,13:10,14:150}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'乘上「杯數」',op:'mul',c:12},{t:'加上「加料」',op:'add',c:13},{t:'和「預算」比大小',op:'cmp',c:14},{t:'店長決定：比預算大就說「錢不夠」，不然就出餐',op:'judge'},{t:'減掉「預算」',op:'sub',c:14}],sol:[0,1,2,3,4]},
 {lv:2,name:'班級團購',says:'全班要紅茶 3 杯（每杯 25 元）和綠茶 2 杯（每杯 30 元），一共多少？',tip:'搖飲師手上只拿得動一個數字，算好的先寫回牆上的空格。',
  wall:{10:'暫存（空格）',11:'紅茶單價',12:'紅茶杯數',13:'綠茶單價',14:'綠茶杯數'},tests:[{10:null,11:25,12:3,13:30,14:2},{10:null,11:20,12:4,13:35,14:1}],
  cards:[{t:'拿「紅茶單價」',op:'load',c:11},{t:'乘上「紅茶杯數」',op:'mul',c:12},{t:'寫回牆上「暫存」格',op:'store',c:10},{t:'拿「綠茶單價」',op:'load',c:13},{t:'乘上「綠茶杯數」',op:'mul',c:14},{t:'加上「暫存」',op:'add',c:10},{t:'送到出餐口',op:'out'}],sol:[0,1,2,3,4,5,6]}
];

let ri=0, slots=[], order=[], wall={}, powerOff=false, running=false;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

function shuffle(n){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  // 常數亂數也必定終止，並維持「不以原順序出題」。
  if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());
  return a;
}

// 執行一串卡片：回傳每一步的說明和出餐結果
function run(seq,data,R=ROUNDS[ri]){
  const mem={...data}; let acc=null, flag=null; const steps=[], outs=[];
  const name=c=>R.wall[c].replace(/（.*）/,'');
  for(const k of seq){
    const cd=R.cards[k]; const s={k,cell:cd.c??null};
    const v=cd.c!=null?mem[cd.c]:null;
    s.cu='看懂這張：「'+cd.t+'」';
    if(['load','add','mul','sub','cmp'].includes(cd.op)&&(v==null)){
      s.alu='第 '+pad(cd.c)+' 號格是空的，拿不到數字！';s.bad=true;steps.push(s);break;
    }
    if(['add','mul','sub','cmp','store'].includes(cd.op)&&acc==null){
      s.alu='手上還沒有數字，沒辦法做這件事！';s.bad=true;steps.push(s);break;
    }
    switch(cd.op){
      case 'load':acc=v;s.cu+='，叫搖飲師去拿 '+pad(cd.c)+' 號格。';s.alu='拿到 '+v;s.who='alu';break;
      case 'add':s.alu=acc+' + '+v+' = '+(acc+v);acc+=v;s.cu+='，叫搖飲師加。';s.who='alu';break;
      case 'mul':s.alu=acc+' × '+v+' = '+(acc*v);acc*=v;s.cu+='，叫搖飲師乘。';s.who='alu';break;
      case 'sub':s.alu=acc+' − '+v+' = '+(acc-v);acc-=v;s.cu+='，叫搖飲師減。';s.who='alu';break;
      case 'cmp':flag=acc>v?'比較大':acc===v?'一樣':'比較小';s.alu=acc+' 和 '+v+' 比：'+flag;s.cu+='，叫搖飲師比大小。';s.who='alu';break;
      case 'store':mem[cd.c]=acc;s.cu+='，把 '+acc+' 寫到 '+pad(cd.c)+' 號格。';s.alu='放下 '+acc+'，手空了';s.write=acc;s.who='cu';acc=null;break;
      case 'judge':
        if(flag==null){s.cu='想決定，但還沒比過大小，不知道怎麼辦！';s.bad=true;steps.push(s);return {steps,outs,mem};}
        if(flag==='比較大'){s.cu='剛剛比的結果是「比較大」，決定說：錢不夠！';outs.push('錢不夠');s.out='錢不夠！'}
        else{s.cu='剛剛比的結果是「'+flag+'」，決定出餐。';outs.push(acc);s.out=acc+' 元'}
        s.who='cu';break;
      case 'out':
        if(acc==null){s.cu+='，可是搖飲師手上沒東西。';s.bad=true;steps.push(s);return {steps,outs,mem}}
        s.cu+='，送去出餐口。';outs.push(acc);s.out=acc+' 元';s.who='out';break;
    }
    s.hand=acc;steps.push(s);
  }
  return {steps,outs,mem};
}

function renderWall(hit){
  const R=ROUNDS[ri];
  $('wall').innerHTML=Object.keys(R.wall).map(c=>{
    const v=powerOff?null:wall[c];
    return '<div class="cell'+(+c===hit?' hit':'')+'"><span class="addr">#'+pad(c)+'</span><span class="lab">'+R.wall[c]+'</span><span class="val">'+(v==null?'':v)+'</span></div>';
  }).join('');
}

function renderCards(now,bad){
  const R=ROUNDS[ri];
  $('pool').innerHTML=order.map(k=>'<button type="button" class="card'+(slots.includes(k)?' used':'')+'" data-k="'+k+'"'+(slots.includes(k)?' tabindex="-1" aria-hidden="true"':'')+'>'+R.cards[k].t+'</button>').join('');
  const n=R.sol.length;
  // 順序格滿了就不能再放：先拿回一張才能換（避免卡片跑進看不見的第 n+1 格）
  $('pool').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(running)return;const k=+b.dataset.k;if(slots.includes(k))return;if(slots.length>=n){$('full-msg').hidden=false;return}slots.push(k);resetStage();renderCards()});
  let h='';
  for(let i=0;i<n;i++){
    const k=slots[i];
    h+='<div class="slot'+(i===now?(bad?' now bad':' now'):'')+'"><span class="n">'+(i+1)+'</span>'+(k==null?'<span class="empty">放第 '+(i+1)+' 張</span>':'<button type="button" class="card" data-s="'+i+'">'+R.cards[k].t+'</button>')+'</div>';
  }
  $('slots').innerHTML=h+'<p class="small" id="full-msg" role="status" hidden style="color:var(--warn);font-size:15px">順序格已經滿了。想換卡片，先點格子裡的卡片拿回去。</p>';
  $('slots').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(running)return;slots.splice(+b.dataset.s,1);resetStage();renderCards()});
  if(slots.length>n)slots.length=n;
  $('b-run').disabled=running||slots.length!==n;
  $('b-clear').disabled=running||!slots.length;
}

function resetStage(){
  ['u-cu','u-alu','u-out'].forEach(id=>$(id).classList.remove('on'));
  $('cu-say').textContent='等你排好單子。';$('alu-say').textContent='';$('hand').textContent='空手';
  $('outv').textContent='—';$('outv').classList.remove('no');$('verdict').hidden=true;
}

function loadRound(i){
  ri=i;const R=ROUNDS[i];
  wall={...R.tests[0]};powerOff=false;$('b-on').hidden=true;$('b-off').hidden=false;
  $('powernote').textContent='每一格都有號碼（位址），店長靠號碼找資料。';
  slots=[];order=shuffle(R.cards.length);
  renderWall();resetStage();renderCards();
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){
  if(running)return; running=true; resetStage(); renderCards();
  const R=ROUNDS[ri];
  if(!powerOff)activityApi.attempt();
  const data=powerOff?Object.fromEntries(Object.keys(R.wall).map(c=>[c,null])):R.tests[0];
  const res=run(slots,data);
  const T=matchMedia('(prefers-reduced-motion: reduce)').matches?450:1100;
  let shown={...data};
  for(let i=0;i<res.steps.length;i++){
    const s=res.steps[i];
    renderCards(i,s.bad);
    ['u-cu','u-alu','u-out'].forEach(id=>$(id).classList.remove('on'));
    $('u-cu').classList.add('on'); $('cu-say').textContent=s.cu; $('alu-say').textContent='';
    if(s.cell!=null) {wall=shown;renderWall(s.cell)}
    await wait(T*0.55);
    if(s.alu){$('u-alu').classList.add('on');$('alu-say').textContent=s.alu}
    if(s.write!=null){shown={...shown,[s.cell]:s.write};wall=shown;renderWall(s.cell)}
    $('hand').textContent=s.hand==null?'空手':s.hand;
    if(s.out){$('u-out').classList.add('on');$('outv').textContent=s.out;$('outv').classList.toggle('no',s.out==='錢不夠！')}
    await wait(T);
  }
  renderWall();
  verdict(res);
  running=false; renderCards();
}

function verdict(res){
  const R=ROUNDS[ri], v=$('verdict');
  $('b-send').onclick();
  const expect=t=>run(R.sol,t).outs;
  const fmt=o=>o.length?o.map(x=>x==='錢不夠'?'錢不夠！':x+' 元').join('、'):'沒有出餐';
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  let ok, h='';
  if(powerOff){
    ok=false;
    h='<h3>店裡停電了</h3><p>點單牆斷電後全部清空，店長和搖飲師什麼都拿不到。這就是主記憶體（RAM）的特性：沒電就忘光。按「開店」把招牌上的內容掛回去再試一次。</p>';
  } else {
    const e1=expect(R.tests[0]), ok1=same(res.outs,e1);
    const t2=R.tests[1], e2=expect(t2), ok2=same(run(slots,t2).outs,e2);
    ok=ok1&&ok2;
    if(ok){

      const cu=res.steps.length, alu=res.steps.filter(s=>s.alu&&!s.bad&&R.cards[s.k].op!=='store').length;
      h='<h3>過關！</h3><p>出餐：'+fmt(res.outs)+'。換另一位客人（'+Object.entries(t2).filter(([c])=>c!=='10').map(([c,x])=>R.wall[c]+' '+x).join('、')+'）也對：'+fmt(e2)+'。</p>'+
        '<p>店長看了 '+cu+' 張單、搖飲師動手 '+alu+' 次。真的手機處理器不用一單一單慢慢來：它的時脈一秒有幾十億次（這是粗略的比喻，不是每秒剛好做幾次這種事）。</p>';
      const controls=v.querySelector('.btns');
      v.innerHTML=h+(controls?controls.outerHTML:'');v.hidden=false;
      if($('b-next'))$('b-next').onclick=()=>APP.load(ri+1);
      if($('b-lv2'))$('b-lv2').onclick=()=>APP.setLevel(2);
      return;
    }
    if(!ok1) h='<h3>客人說：「不對吧？」</h3><p>應該出餐 '+fmt(e1)+'，你的順序做出來是 '+fmt(res.outs)+'。看看是哪一步開始不對，調整順序再試一次。</p>';
    else h='<h3>差一點！</h3><p>這位客人剛好對了，但換一位客人就錯：應該 '+fmt(e2)+'，你的順序做出 '+fmt(run(slots,t2).outs)+'。想想順序或是哪張卡不該用。</p>';
  }
  v.className='verdict no';v.innerHTML=h;v.hidden=false;
}

function bindControls(){
$('b-run').onclick=play;
$('b-clear').onclick=()=>{slots=[];resetStage();renderCards()};
$('b-off').onclick=()=>{if(running)return;powerOff=true;$('b-off').hidden=true;$('b-on').hidden=false;$('powernote').textContent='停電了！牆上的東西全都不見。';resetStage();renderWall()};
$('b-on').onclick=()=>{if(running)return;powerOff=false;wall={...ROUNDS[ri].tests[0]};$('b-on').hidden=true;$('b-off').hidden=false;$('powernote').textContent='開店：照門口招牌（ROM）把內容掛回牆上。招牌斷電也不會消失。';resetStage();renderWall()};

}
let activityApi;
const STAGE_HTML=`  <div class="grid">
    <section class="panel">
      <div class="ptitle"><h2>點單牆</h2><span class="tag t-mem">主記憶體</span></div>
      <div class="wall" id="wall"></div>
      <div class="power">
        <button class="btn" id="b-off">拉電閘（斷電）</button>
        <button class="btn" id="b-on" hidden>開店（照招牌掛回去）</button>
      </div>
      <p class="small" id="powernote">每一格都有號碼（位址），店長靠號碼找資料。</p>
    </section>

    <section class="panel">
      <div class="ptitle"><h2>單子盒</h2><span class="small">點一張放進下面</span></div>
      <div class="pool" id="pool"></div>
      <div class="ptitle"><h2>店長的順序</h2></div>
      <div class="slots" id="slots"></div>
      <div class="btns">
        <button class="btn primary" id="b-run">開始做</button>
        <button class="btn" id="b-clear">全部拿回來</button>
      </div>
    </section>
  </div>

  <div class="stage">
    <section class="panel cpu-unit cu" id="u-cu">
      <div class="ptitle"><h2>店長</h2><span class="tag t-cu">控制單元</span></div>
      <div class="say" id="cu-say">等你排好單子。</div>
    </section>
    <section class="panel cpu-unit alu" id="u-alu">
      <div class="ptitle"><h2>搖飲師</h2><span class="tag t-alu">算術邏輯單元</span></div>
      <div class="hand" id="hand">空手</div>
      <div class="say" id="alu-say"></div>
    </section>
    <section class="panel cpu-unit outp" id="u-out">
      <div class="ptitle"><h2>出餐口</h2><span class="tag t-out">輸出</span></div>
      <div class="outv" id="outv">—</div>
    </section>
  </div>

`;
// 原活動一次演出即檢查兩組固定資料，不能改成兩次排卡。
const APP=SHELL({week:WEEK,termWeek:TERM_WEEK,title:TITLE,course:COURSE,
  progressLength:4,rememberIdentity:true,finale:'全部完成，你已經是合格的店長了。',
  rounds:ROUNDS.map((r,i)=>({...r,
    confirmations:1,manualAttempt:true,
    now:r.says,goal:'點卡片放進「店長的順序」，排好按「開始做」。點順序格裡的卡片可以拿回來。',
    gen:()=>({round:i}),
    view(inst,el,api){
      activityApi=api;el.innerHTML=STAGE_HTML;loadRound(i);bindControls();
      return {get:()=>({seq:[...slots],powerOff}),fill:()=>{slots=[...r.sol];resetStage();renderCards()},ready:()=>!running&&slots.length===r.sol.length};
    },
    check(inst,ans){
      if(ans.powerOff)return '店裡停電了，請先開店。';
      return r.tests.every(t=>JSON.stringify(run(ans.seq,t,r).outs)===JSON.stringify(run(r.sol,t,r).outs))||'出餐結果不對，調整順序再試一次。';
    }
  }))});
// 按鈕仍由活動演出驅動；shell 的送出只在演出結束後由 verdict 呼叫。
$('b-send').hidden=true;$('streak').hidden=true;$('send-hint').hidden=true;
