<style>
/* 本頁的體驗與繪圖皆為本機運算，不發聲。 */
.lab-canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}

<script src="../../assets/teacher.js?v=20261031e"></script>
<script src="../../assets/lock.js?v=20261105m"></script>

<script>
// 示範資料量均省略檔頭；影像與聲音使用未壓縮模型，影片依題目的估計速率。
const SR=[8,16,32,64], QL=[4,8,16,32], RES=[16,32,64,128], COLORS=[4,16,64], FPS=[4,8,12,24,30];
const QUALITY=[{name:'基本',rate:100},{name:'清晰',rate:250},{name:'精細',rate:400}];
const bytesText=b=>b>=1000?(b/1000).toLocaleString('en-US',{maximumFractionDigits:2})+' KB':b+' 位元組';
const integer=s=>{const t=String(s).trim().replace(/[,，]/g,'');return /^\d+$/.test(t)&&Number.isSafeInteger(Number(t))?Number(t):null};
function selectControl(el,id,label,values,format=x=>x){
  el.insertAdjacentHTML('beforeend','<label class="lab-control" for="'+id+'">'+label+'<select id="'+id+'"><option value="">請選擇</option>'+values.map(v=>'<option value="'+v+'">'+format(v)+'</option>').join('')+'</select></label>');
  return el.querySelector('#'+id);
}
function numberControl(el,id,label){
  el.insertAdjacentHTML('beforeend','<label class="lab-answer" for="'+id+'">'+label+'<input class="num-in" id="'+id+'" inputmode="numeric" autocomplete="off"></label>');
  return el.querySelector('#'+id);
}
function canvas(el,label,w=640,h=220){el.insertAdjacentHTML('beforeend','<canvas class="lab-canvas" width="'+w+'" height="'+h+'" role="img" aria-label="'+label+'">'+label+'</canvas>');return el.lastElementChild}
const wave=(i,t)=>.60*Math.sin(2*Math.PI*i.cycles*t)+.22*Math.sin(2*Math.PI*(i.cycles+2)*t+i.phase);
const quant=(v,q)=>Math.round((v+1)/2*(q-1))/(q-1)*2-1;
function soundMetrics(i,rate,levels){
  let error=0;for(let k=0;k<512;k++){const t=k/512;error+=Math.abs(wave(i,t)-quant(wave(i,Math.floor(t*rate)/rate),levels))}
  return {score:Math.round(1000*(1-error/512/2))/10,bytes:Math.ceil(rate*Math.log2(levels)/8)};
}
const soundSolutions=new Map();
function soundBest(i){
  const key=[i.cycles,i.phase,i.target].join(':');
  if(!soundSolutions.has(key))soundSolutions.set(key,SR.flatMap(rate=>QL.map(levels=>({rate,levels,...soundMetrics(i,rate,levels)}))).filter(x=>x.score>=i.target).sort((a,b)=>a.bytes-b.bytes)[0]);
  return soundSolutions.get(key);
}
function drawWave(c,i,rate,levels){
  const x=c.getContext('2d'),y=v=>110-v*90;x.clearRect(0,0,640,220);
  x.strokeStyle='#ccc';x.beginPath();x.moveTo(0,110);x.lineTo(640,110);x.stroke();
  x.strokeStyle='#596c80';x.lineWidth=2;x.beginPath();for(let k=0;k<=640;k++){const v=y(wave(i,k/640));k?x.lineTo(k,v):x.moveTo(k,v)}x.stroke();
  if(!rate||!levels)return;
  x.strokeStyle='#c34618';x.lineWidth=2;x.beginPath();
  for(let k=0;k<rate;k++){const v=y(quant(wave(i,k/rate),levels));if(!k)x.moveTo(0,v);else x.lineTo(k/rate*640,v);x.lineTo((k+1)/rate*640,v)}x.stroke();
  x.fillStyle='#c34618';for(let k=0;k<rate;k++){x.beginPath();x.arc(k/rate*640,y(quant(wave(i,k/rate),levels)),3,0,Math.PI*2);x.fill()}
}
function drawScene(c,n=128,colors=64){
  // 直接計算每格的顏色：舞台、聚光燈、表演者與應援色，無外部圖片。
  const x=c.getContext('2d'),steps=colors===4?[2,2,1]:colors===16?[4,2,2]:[4,4,4];x.clearRect(0,0,c.width,c.height);
  for(let row=0;row<n;row++)for(let col=0;col<n;col++){
    const u=(col+.5)/n,v=(row+.5)/n;
    let rgb=[30+u*90,35+v*90,110+u*100];
    if(Math.abs(u-.5)<v*.3)rgb=[230,190-v*90,90];
    if((u-.5)**2+(v-.37)**2<.006||Math.abs(u-.5)<.055&&v>.43&&v<.77)rgb=[65,40,100];
    if(v>.82)rgb=[60,180+60*Math.sin(u*45),160];
    x.fillStyle='rgb('+rgb.map((z,k)=>steps[k]===1?0:Math.round(z/255*(steps[k]-1))/(steps[k]-1)*255).join(',')+')';
    x.fillRect(col*c.width/n,row*c.height/n,Math.ceil(c.width/n),Math.ceil(c.height/n));
  }
}
const imageBytes=(n,c)=>Math.ceil(n*n*Math.log2(c)/8);
function movieFrame(c,t){const x=c.getContext('2d');x.fillStyle='#18253b';x.fillRect(0,0,c.width,c.height);x.fillStyle='#f6b746';x.beginPath();x.arc(25+(c.width-50)*(t%1),c.height/2,16,0,Math.PI*2);x.fill()}
function recording(i,q){const rate=QUALITY[q].rate;return {max:Math.floor(i.cap*1000/rate),need:i.minutes*rate/1000}}
function bestQuality(i){return QUALITY.reduce((best,q,k)=>q.rate*i.minutes<=i.cap*1000?k:best,-1)}
const ROUNDS=[
 {lv:1,name:'聲音取樣',
  now:'演出前先試錄：這裡只看波形，全程不發聲。灰線是連續的聲音；橘點與階梯是儲存後的還原。',
  goal:i=>'比較至少兩種設定，讓接近度達 '+i.target+'%，並找到資料量最小的設定。',
  tip:'取樣頻率＝每秒量幾次；量化＝把高低分成幾階。先提高到夠接近，再試著減少資料。',
  steps:i=>'這次的目標是相似度至少 '+i.target+'%。第一步：先把取樣頻率和量化階數都調高，確認波形能接近原音、達到 '+i.target+'%。第二步：再一次只調低一個，看相似度有沒有掉到 '+i.target+'% 以下。第三步：在還能達標的設定裡，選資料量最小的那一組；至少比較兩種設定再送出。',
  learn:'量得越密、分階越細，通常越接近原波形，資料量也增加。這是取樣與量化。',
  gen(rnd){return {cycles:PICK(rnd,[2,3,4]),phase:PICK(rnd,[0,.7,1.4]),target:PICK(rnd,[91,93,95])}},
  view(i,el,api){
    const c=canvas(el,'灰色原始連續波形與橘色取樣點、階梯還原波形');
    const r=selectControl(el,'sample-rate','取樣頻率',SR,v=>'每秒 '+v+' 次'),q=selectControl(el,'sample-level','量化階數',QL,v=>'分成 '+v+' 階');
    el.insertAdjacentHTML('beforeend','<p class="lab-stat" aria-live="polite" id="sample-stat">先選兩個設定。</p><p class="small">示範 1 秒、單聲道，接近度依波形誤差估算；不是實際音質評分。</p>');
    const seen=new Set();const update=()=>{drawWave(c,i,+r.value,+q.value);if(r.value&&q.value){seen.add(r.value+':'+q.value);const m=soundMetrics(i,+r.value,+q.value);el.querySelector('#sample-stat').textContent='接近度 '+m.score.toFixed(1)+'%｜資料量 '+bytesText(m.bytes)+'｜已比較 '+seen.size+' 種'} };update();
    r.onchange=q.onchange=()=>{update();api.changed()};
    return {get:()=>({rate:+r.value,levels:+q.value,compared:seen.size}),ready:()=>!!r.value&&!!q.value&&seen.size>=2,fill:()=>{const b=soundBest(i);r.value=b.rate;q.value=b.levels;seen.add('demo');update()}};
  },
  check(i,a){if(!SR.includes(a.rate)||!QL.includes(a.levels)||a.compared<2)return '先比較至少兩種完整設定。';const m=soundMetrics(i,a.rate,a.levels);if(m.score<i.target)return '還原還不夠接近，試著量密一點或分更多階。';return m.bytes===soundBest(i).bytes?true:'已經夠接近！試著降低設定，還能減少資料量。'}},
 {lv:1,name:'影像像素',
  now:'要把演出舞台圖放進宣傳品。左邊是原圖，右邊是取樣與減色後的圖。',
  goal:i=>'用途：'+i.use+'。至少 '+i.minRes+' × '+i.minRes+' 像素、'+i.minColors+' 色；比較兩種設定，選資料量最小且夠用的組合。',
  tip:'解析度決定格子多密；顏色數決定每格能選幾種顏色。這是縮小的示意圖，實際海報需要更多像素。',
  steps:i=>'這次要做「'+i.use+'」，畫面要求至少 '+i.minRes+' 格寬、'+i.minColors+' 種顏色。第一步：自己選一組設定，逐項和用途要求比較，記下哪些符合、哪些不足。第二步：一次只改解析度或顏色數，觀察細節、色彩和資料量的差別；至少試兩種完整設定。第三步：比較符合要求的組合，想想還能不能減少資料量，再決定送出哪一組。',
  learn:'影像由像素組成。像素越多、可用顏色越多，細節越豐富，資料量通常也越大。',
  gen(rnd){return PICK(rnd,[{use:'手機縮圖',minRes:32,minColors:16},{use:'海報示意',minRes:128,minColors:64},{use:'節目單小圖',minRes:64,minColors:16}])},
  view(i,el,api){
    el.innerHTML='<div class="lab-grid"><div id="image-original">原圖</div><div id="image-preview">數位化後</div></div>';
    drawScene(canvas(el.querySelector('#image-original'),'原始舞台圖',320,320));const c=canvas(el.querySelector('#image-preview'),'調整解析度與顏色數後的舞台圖',320,320);
    const r=selectControl(el,'image-res','解析度',RES,v=>v+' × '+v+' 像素'),q=selectControl(el,'image-colors','顏色數',COLORS,v=>v+' 色');
    el.insertAdjacentHTML('beforeend','<p class="lab-stat" id="image-stat" aria-live="polite">先選兩個設定。</p><p class="small">未壓縮，不計色盤與檔頭。顏色數為這張圖可用的色盤上限。</p>');
    const seen=new Set();const update=()=>{if(!r.value||!q.value)return;seen.add(r.value+':'+q.value);drawScene(c,+r.value,+q.value);el.querySelector('#image-stat').textContent='資料量 '+bytesText(imageBytes(+r.value,+q.value))+'｜已比較 '+seen.size+' 種'};
    r.onchange=q.onchange=()=>{update();api.changed()};return {get:()=>({res:+r.value,colors:+q.value,compared:seen.size}),ready:()=>!!r.value&&!!q.value&&seen.size>=2,fill:()=>{r.value=i.minRes;q.value=i.minColors;seen.add('demo');update()}};
  },
  check(i,a){if(!RES.includes(a.res)||!COLORS.includes(a.colors)||a.compared<2)return '先比較至少兩種完整設定。';if(a.res<i.minRes||a.colors<i.minColors)return '這個用途需要更多像素或顏色，請看指定條件。';return a.res===i.minRes&&a.colors===i.minColors?true:'已經夠用，但還有資料量更小的設定。'}},
 {lv:2,name:'影片組成',
  now:'錄影是把一張張畫面接起來，再配上聲音。看小球移動，比較每秒張數對順暢度的影響。這裡不播放聲音。',
  goal:i=>'比較至少兩種速度，選至少 '+i.target+' fps 且張數最少的設定，再回答問題。',
  tip:'fps 是「每秒幾張」。相同時間內，張數越多，移動通常越順暢；資料量也增加。',
  steps:i=>'畫面要求每秒至少 '+i.target+' 張，影片長 '+i.seconds+' 秒。第一步：自己選兩種 fps 試看，分別比較動作順暢度和是否達到要求。第二步：在達標設定中比較張數，選定後用「目前每秒張數 × '+i.seconds+' 秒」計算總張數。第三步：再想一想一部影片除了一張張畫面，還有哪個部分要一起存。',
  learn:'影片是一連串畫面加上聲音。24 fps 表示每秒 24 張，畫面、聲音與時間都會影響影片大小。',
  gen(rnd){return {target:PICK(rnd,[12,24,30]),seconds:PICK(rnd,[2,3,5])}},
  view(i,el,api){
    const c=canvas(el,'依每秒張數更新的小球動畫',640,160);const f=selectControl(el,'movie-fps','每秒張數',FPS,v=>v+' fps');
    el.insertAdjacentHTML('beforeend','<p class="lab-stat" id="movie-stat" aria-live="polite">選擇 fps 開始看。</p>');
    const one=numberControl(el,'movie-one','目前設定，1 秒要存幾張？'),total=numberControl(el,'movie-total',i.seconds+' 秒要存幾張？');
    const comp=selectControl(el,'movie-parts','有聲影片由什麼組成？',[0,1,2],v=>['一張照片加聲音','一連串畫面加聲音','只有一連串畫面'][v]);
    const seen=new Set();let start=null,last=-1;movieFrame(c,0);
    // 換題後畫布移出 DOM，下一幀即停止；不累積動畫或計時器。
    function tick(t){if(!c.isConnected)return;if(start===null)start=t;const fps=+f.value,frame=Math.floor((t-start)/1000*fps);if(fps&&frame!==last){last=frame;movieFrame(c,frame/fps/2)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
    f.onchange=()=>{if(f.value){seen.add(f.value);el.querySelector('#movie-stat').textContent=f.value+' fps：每秒 '+f.value+' 張｜已比較 '+seen.size+' 種'}last=-1;api.changed()};
    one.oninput=total.oninput=comp.onchange=()=>api.changed();
    return {get:()=>({fps:+f.value,one:integer(one.value),total:integer(total.value),parts:comp.value,compared:seen.size}),ready:()=>!!f.value&&seen.size>=2&&one.value!==''&&total.value!==''&&comp.value!=='',fill:()=>{f.value=i.target;seen.add('demo');f.onchange();one.value=i.target;total.value=i.target*i.seconds;comp.value='1'}};
  },
  check(i,a){if(!FPS.includes(a.fps)||a.compared<2)return '先比較兩種速度。';if(a.fps!==i.target)return '選達到目標、每秒張數最少的設定。';if(a.one!==a.fps||a.total!==a.fps*i.seconds)return '每秒張數 × 秒數＝總張數，請填完整整數。';return a.parts==='1'?true:'有聲影片需要一連串畫面，再配上聲音。'}},
 {lv:2,name:'錄滿一整場',
  now:i=>'演出長 '+i.minutes+' 分鐘，空白記憶卡有 '+i.cap+' GB 可用。表中的大小已包含聲音。',
  goal:'選能錄完整場的最高畫質，把錄影時間設成演出長度，並算出所需空間與最多可錄分鐘。',
  tip:'1 位元組＝8 位元；1 KB＝1000 位元組；1 MB＝1000 KB；1 GB＝1000 MB；1 TB＝1000 GB。所需 MB＝分鐘 × 每分鐘 MB；最多分鐘＝可用 MB ÷ 每分鐘 MB，無條件捨去。',
  steps:i=>'記憶卡有 '+i.cap+' GB，演唱會要錄 '+i.minutes+' 分鐘。第一步：GB 先乘 1000 換成 MB，得到可用的 MB。第二步：選一種畫質，所需 MB＝'+i.minutes+' × 每分鐘 MB。第三步：最多分鐘＝可用 MB ÷ 每分鐘 MB，無條件捨去；最多分鐘要不少於 '+i.minutes+'，才錄得完整場。',
  learn:'先算整場需要的空間，再挑裝得下的最高畫質。影片大小也受壓縮方式影響，實際錄影前還要留餘裕。',
  gen(rnd){return {cap:PICK(rnd,[16,32,64]),minutes:PICK(rnd,[60,90,120,150])}},
  view(i,el,api){
    el.innerHTML='<table class="lab-table"><caption>本題估計的錄影大小（包含聲音）</caption><thead><tr><th>畫質</th><th>每分鐘</th></tr></thead><tbody>'+QUALITY.map(q=>'<tr><td>'+q.name+'</td><td>'+q.rate+' MB</td></tr>').join('')+'</tbody></table>';
    const q=selectControl(el,'record-quality','畫質',[0,1,2],v=>QUALITY[v].name),duration=selectControl(el,'record-duration','預計錄影時間',[i.minutes-15,i.minutes,i.minutes+15],v=>v+' 分鐘');
    const need=numberControl(el,'record-need','整場需要幾 MB？'),max=numberControl(el,'record-max','此畫質最多可錄幾分鐘？');
    q.onchange=duration.onchange=need.oninput=max.oninput=()=>api.changed();
    return {get:()=>({q:q.value===''?null:+q.value,duration:+duration.value,need:integer(need.value),max:integer(max.value)}),ready:()=>q.value!==''&&duration.value!==''&&need.value!==''&&max.value!=='',fill:()=>{const k=bestQuality(i);q.value=k;duration.value=i.minutes;need.value=i.minutes*QUALITY[k].rate;max.value=recording(i,k).max}};
  },
  check(i,a){if(!Number.isInteger(a.q)||!QUALITY[a.q])return '先選畫質。';if(a.duration!==i.minutes)return '要從開場錄到結束，錄影時間請設成演出長度。';const r=recording(i,a.q);if(a.need!==i.minutes*QUALITY[a.q].rate||a.max!==r.max)return '再算一次：GB 先乘 1000 變 MB；最多分鐘要無條件捨去。';if(a.max<i.minutes)return '此畫質錄不完整場，降低畫質試試。';return a.q===bestQuality(i)?true:'空間夠用，還能選更高的畫質。'}}
];
const APP=SHELL({week:4,termWeek:10,title:'錄滿一整場',course:'115-g9',unit:2,rounds:ROUNDS,finale:'全部完成！下一站：燈牌只有亮和暗，數字到底怎麼存？'});
</script>
