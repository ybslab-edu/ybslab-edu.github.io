<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":4,"course":"115-g9","unit":2,"title":"錄滿一整場","rounds":[{"name":"聲音取樣","now":"演出前先試錄：這裡只看波形，全程不發聲。灰線是連續的聲音；橘點與階梯是儲存後的還原。","learn":"量得越密、分階越細，通常越接近原波形，資料量也增加。這是取樣與量化。"},{"name":"影像像素","now":"要把演出舞台圖放進宣傳品。左邊是原圖，右邊是取樣與減色後的圖。","learn":"影像由像素組成。像素越多、可用顏色越多，細節越豐富，資料量通常也越大。"},{"name":"影片組成","now":"錄影是把一張張畫面接起來，再配上聲音。看小球移動，比較每秒張數對順暢度的影響。這裡不播放聲音。","learn":"影片是一連串畫面加上聲音。24 fps 表示每秒 24 張，畫面、聲音與時間都會影響影片大小。"},{"name":"錄滿一整場","goal":"選能錄完整場的最高畫質，把錄影時間設成演出長度，並算出所需空間與最多可錄分鐘。","learn":"先算整場需要的空間，再挑裝得下的最高畫質。影片大小也受壓縮方式影響，實際錄影前還要留餘裕。"}]});</script></body></html>
