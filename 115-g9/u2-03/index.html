<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":5,"course":"115-g9","unit":2,"title":"燈牌只有亮和暗","rounds":[{"name":"點亮生日","learn":"燈牌只有亮和暗，也能表示 0～31：每顆燈代表 16、8、4、2、1，亮的加起來就是答案。只用 0 和 1 表示數字，叫做二進位。"},{"name":"看燈猜數字","now":"對面看台的粉絲也舉了一塊燈牌，6 顆燈，下面有寫數字。","goal":"看亮著的燈，算出燈牌上是幾。","learn":"把亮的燈代表的數字加起來，就能把二進位換成平常用的十進位。例如 101010 ＝ 32 + 8 + 2 ＝ 42。"},{"name":"沒有標數字的燈牌","now":"跨年夜的大燈牌有 8 顆燈，這次燈下面沒有寫數字。","learn":"十進位換二進位：從最大的位值開始，放得下就是 1、扣掉；放不下就是 0。8 顆燈（8 位元）最多能表示 0～255，這就是 1 個位元組。"},{"name":"要幾顆燈才夠","goal":"最少要幾顆燈才夠？用這麼多顆燈，最大能顯示到多少？","learn":"n 顆燈（n 個位元）能表示 2ⁿ 種狀態，最大是 2ⁿ − 1。燈太少放不下，太多又浪費：資料要用幾個位元，就是這樣算出來的。"},{"name":"燈牌要幾個位元組","now":"演唱會要把燈牌的亮暗和動畫存進記憶卡。8 顆燈各存 1 位元，合起來是 1 位元組。","learn":"燈牌只有亮暗，每顆用 1 位元；每 8 位元組成 1 位元組。KiB 用 1024；KB、MB、GB 標示每級用 1000，換算前要先看清楚單位。"}]});</script></body></html>
