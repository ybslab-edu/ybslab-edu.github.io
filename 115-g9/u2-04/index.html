<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":6,"course":"115-g9","unit":2,"title":"傳給阿嬤的方塊","rounds":[{"name":"用編碼表解密","now":"後援會的老前輩用數字傳暗號給小安，附上一張編碼表。","goal":"用編碼表把數字換回英文字母，打出這句暗號。","learn":"電腦裡的每個字都有一個編號。英文字母、數字、空格這套編號叫 ASCII，一個字只要 1 個位元組（8 個 0 和 1）。"},{"name":"換成編碼","now":"小安要回暗號給前輩。","learn":"把字換成編號叫「編碼」，把編號換回字叫「解碼」。傳訊息、存檔，其實都是在存這些編號。"},{"name":"亂碼是怎麼來的","now":"後援會幹部把跨年公告存成檔案傳到群組，小安打開卻是一堆亂碼。","goal":"對照「亂碼圖鑑」，判斷這份公告是怎麼變成亂碼的。","learn":"同一串位元，用不同的編碼表去解，就會變成完全不同的字。亂碼不是檔案壞掉，是「存的編碼」和「讀的編碼」不一樣；改用正確的編碼打開就好了。"},{"name":"方塊還是亂碼","now":"群組裡大家回報各種「字壞掉」的情況。","goal":"判斷每一種情況，是字型裡沒有這個字（顯示方塊），還是編碼不同（變成亂碼）。","learn":"方塊 □：電腦知道是哪個字，但字型裡沒有畫這個字（新 emoji、罕見字）。亂碼：電腦用錯了編碼表，整段都解成別的字。Unicode 每年會新增 emoji，舊手機的字型沒有，就只能顯示方塊。"}]});</script></body></html>
