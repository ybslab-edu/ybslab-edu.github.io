<script>
const qEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qTable=(caption,heads,rows)=>'<table class="quest-table"><caption>'+qEsc(caption)+'</caption><thead><tr>'+heads.map(h=>'<th scope="col">'+qEsc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+qEsc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const qVersion=rnd=>Math.floor(rnd()*8);
const qCommon='<div class="quest-note"><p>星港策展團隊委託你設計「次元交會動漫／遊戲展」志工報名表。你要讀懂招募需求，修好蒐集內容、表單結構與發布設定；展開「備用素材」即可查看本組委託附件。</p><p>每關答對兩組不同資料才完成；答錯可修正，不扣分。答對後按「下一組」繼續。</p></div>';
// 僅記本機使用備用素材的版本與時間；不加入既有成績／雲端格式，不含學生身分。
const qFallbackKey='ybs:u2-05:fallback:v1';
function qReadLog(){try{const a=JSON.parse(localStorage.getItem(qFallbackKey)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string').slice(-64):[]}catch{return []}}
function qView(inst,el,api,content,questions,expected,fallback){
  el.innerHTML=qCommon+'<div class="panel"><h3>委託任務 '+qEsc(inst.t)+'</h3>'+content+
    (fallback?'<details class="quest-fallback"><summary>備用素材：本組委託附件</summary><p>你可以直接讀取附件作答，無須另外建立表單。開啟素材只記錄使用狀況，仍須回答下方問題。</p><button class="btn" type="button" data-fallback="use">開啟本組素材</button><div data-fallback="material" hidden>'+fallback+'</div><p class="small quest-log" data-fallback="log" role="status"></p></details>':'')+
    '<div class="quest-answers">'+questions.map((q,k)=>'<label>'+qEsc(q.label)+(q.options?'<select data-answer="'+k+'" aria-label="'+qEsc(q.label)+'"><option value="">請選擇</option>'+q.options.map(x=>'<option value="'+qEsc(x)+'">'+qEsc(x)+'</option>').join('')+'</select>':'<input data-answer="'+k+'" type="number" min="0" step="1" inputmode="numeric" aria-label="'+qEsc(q.label)+'">')+'</label>').join('')+'</div></div>';
  const fields=questions.map((_,k)=>el.querySelector('[data-answer="'+k+'"]'));
  fields.forEach(f=>{f.oninput=()=>api.changed();f.onchange=()=>api.changed()});
  if(fallback){
    const log=el.querySelector('[data-fallback="log"]');
    log.textContent='本機備用紀錄（此瀏覽器，非個人成績）：\n'+(qReadLog().join('\n')||'尚未使用');
    el.querySelector('[data-fallback="use"]').onclick=()=>{
      el.querySelector('[data-fallback="material"]').hidden=false;
      const entry=inst.t+'：未實際操作';let records=qReadLog();
      if(!records.some(x=>x.startsWith(entry)))records.push(entry+'（'+new Date().toLocaleString('zh-TW')+'）');
      try{localStorage.setItem(qFallbackKey,JSON.stringify(records.slice(-64)));log.textContent='本機備用紀錄：\n'+records.slice(-64).join('\n')}catch{log.textContent=entry+'；瀏覽器無法保存，本次仍可繼續作答。'}
    };
  }
  return {get:()=>fields.map(f=>f.value),ready:()=>fields.every(f=>f.value!==''),fill:()=>{expected.forEach((x,k)=>fields[k].value=String(x))}};
}
function qCheck(answer,expected,hints){
  if(!Array.isArray(answer))return '請先填入成果答案，再送出。';
  const wrong=expected.findIndex((x,k)=>answer[k]==null||String(answer[k]).trim()===''||(typeof x==='number'?(!/^\d+$/.test(String(answer[k]))||Number(answer[k])!==x):answer[k]!==x));
  return wrong<0?true:hints[wrong];
}
const qJobs=['入口引導','遊戲體驗','舞台支援'];
const qGroups=['國中組','高中組'];
const qTypes=['簡答','選擇題','核取方塊','線性刻度','單選方格'];
const qCounts=(i,g)=>qJobs.map(job=>i.rows.filter(r=>r[0]===qGroups[g]&&r[1]===job).length);
const qWinner=c=>qJobs[c.indexOf(Math.max(...c))];
function qOneExpected(i){const c=qCounts(i,i.group);return [qWinner(qCounts(i,0)),qWinner(qCounts(i,1)),c[i.query],Math.abs(qCounts(i,0)[i.query]-qCounts(i,1)[i.query]),'資料','資訊','資訊']}
function qTwoExpected(i){return [i.audience,i.dataType,i.fields.filter(f=>f.keep).length,...i.fields.map(f=>f.keep?'該收':'不該收'),...i.cases.map(c=>c.rule)]}

function qFourExpected(i){return [...i.changes.map(c=>c.ok?'可用主題設定完成':'需改用其他方式'),'作答者連結','連結至試算表',i.rows.filter(r=>r[1]===i.job&&r[2]===i.slot).length,'不會']}
const ROUNDS=[

 tip:'先辨認組別，再比較同組長條；原始紀錄與計算、分析後的內容不同。',
 steps:i=>'<p>任務 '+i.t+'：將 '+i.rows.length+' 筆回覆按組別與職務分開計數，再比較長條；不能用其中一組代表另一組。</p>',learn:'你能把原始回覆整理成資訊，並保留組別差異。',
 gen(rnd){const n=qVersion(rnd),a=n%3,b=(a+1)%3;const rows=[];for(let g=0;g<2;g++)for(let j=0;j<3;j++){const count=j===(g?b:a)?4+Math.floor(n/3):1+((n+g+j)%2);for(let k=0;k<count;k++)rows.push([qGroups[g],qJobs[j]])}return {t:'1-'+(n+1),rows,query:n%3,group:n%2}},
 view(i,el,api){return qView(i,el,api,qTable('報名原始回覆',['編號','組別','第一志願'],i.rows.map((r,k)=>[k+1,...r]))+'<p>職務第一志願比較（人）；實心為國中組，斜線為高中組。各長條共用 0～6 人刻度。</p><ul class="quest-chart">'+qJobs.map((job,k)=>qGroups.map((g,j)=>{const count=qCounts(i,j)[k];return '<li><span>'+job+'<br>'+g+'</span><span class="track"><span class="bar '+(j?'bar-high':'')+'" style="width:'+count/6*100+'%"></span></span><span>'+count+' 人</span></li>'}).join('')).join('')+'</ul>',[
 {label:'國中組最多人選哪個職務？',options:qJobs},{label:'高中組最多人選哪個職務？',options:qJobs},{label:qGroups[i.group]+'選「'+qJobs[i.query]+'」的有幾人？'},{label:'兩組選「'+qJobs[i.query]+'」的人數相差幾人？'},
 {label:'「第 1 筆原始回答：'+i.rows[0].join('、')+'」屬於？',options:['資料','資訊']},{label:'「計算後，'+qGroups[i.group]+'有 '+qCounts(i,i.group)[i.query]+' 人選'+qJobs[i.query]+'」屬於？',options:['資料','資訊']},{label:'「比較後，兩組最熱門職務不同」屬於？',options:['資料','資訊']}],qOneExpected(i))},
 check:(i,a)=>qCheck(a,qOneExpected(i),['請只比較國中組的三條長條。','請只比較高中組的三條長條。','請先核對組別和職務，再逐列計數。','請比較同一職務的兩個組別人數。',...Array(3).fill('請判斷這句是否保留原始回答，或已經計算、比較。')])},
 {lv:1,name:'只問這次需要知道的事',now:'你要依委託目的，審查報名對象、欄位與蒐集方式。',goal:'選對對象和數據類型，逐欄判斷是否該收，再找出違反的原則。',
 tip:'必要性由用途決定；緊急聯絡有安全用途，但不能因此多收無關資料。',steps:i=>'<p>任務 '+i.t+'：逐項對照「'+i.audience+'」的需求，審查 '+i.fields.length+' 個問題，再區分三種蒐集原則。</p>',learn:'你能把蒐集範圍限於目的，並檢查告知與同意。',
 gen(rnd){const n=qVersion(rnd),slot=n%2?'下午場 13:00–17:00':'上午場 09:00–12:00',audience=n&2?'兩個時段皆能到場的志工申請者':slot+'能到場的志工申請者',dataType=n&4?'職務操作熟悉度（1～5 分）':'可到場時段（類別）';return {t:'2-'+(n+1),slot,audience,dataType,fields:[{name:'可到場時段',keep:true},{name:'職務意願',keep:true},{name:'緊急聯絡人及聯絡方式',keep:true},{name:n%2?'社群帳號密碼':'家庭每月收入',keep:false},{name:'職務操作熟悉度',keep:!!(n&4)},{name:'最喜歡的角色生日',keep:false}],cases:[{text:'用途欄只寫「填完有好禮」，沒有說明資料如何使用。',rule:'告知'},{text:'窗口說：「都是社團朋友，直接用舊通訊錄替大家報名，不用取得同意。」',rule:'同意'},{text:'除了排班和緊急聯繫，還要求提供家中財務狀況。',rule:'限制蒐集'}]}},
 view(i,el,api){return qView(i,el,api,'<p>委託：招募'+i.audience+'，依職務意願與時段排班，並在活動突發狀況時緊急聯繫。'+(i.dataType.startsWith('職務')?'本組另需依操作熟悉度安排培訓。':'本組不依熟悉度安排培訓；先掌握可到場時段。')+'資料只供招募窗口排班、必要培訓與緊急聯繫，活動結束 30 天後刪除。</p>'+qTable('待審查的問題',['編號','問題欄位'],i.fields.map((f,k)=>[k+1,f.name])),[
 {label:'這次應向誰蒐集？',options:[i.audience,'所有展覽觀眾','所有攤商負責人']},{label:'依本組額外需求／優先目標，應取得哪種數據？',options:[i.dataType,i.dataType.startsWith('職務')?'最愛作品（文字）':'觀看動畫時間（分鐘）','家庭財務狀況（金額）']},{label:'總共該保留幾個欄位？'},...i.fields.map(f=>({label:'「'+f.name+'」該收嗎？',options:['該收','不該收']})),...i.cases.map(c=>({label:c.text+' 主要違反哪個原則？',options:['告知','同意','限制蒐集']}))],qTwoExpected(i),'<p>招募窗口阿岑的需求單：確認到場能力、職務分配與必要培訓；緊急聯絡人只供當天突發狀況使用，不作行銷。請審查問題欄位，不必填入任何聯絡內容。</p>')},
 check:(i,a)=>qCheck(a,qTwoExpected(i),['請確認委託需要誰的到場與職務資料。','請看本組要安排培訓，還是先掌握時段。','請逐項對照目的，再計算保留欄位。',...i.fields.map(()=> '請對照排班、培訓或緊急聯繫用途；與人有關不代表一定不能收。'),...i.cases.map(()=> '請區分用途未說明、未取得允許及超出目的三種問題。')])},
 {lv:2,name:'讓不同回答走到對的地方',now:'你接手的表單把同意書放錯位置，分流與題型也有錯。',goal:'修正第一區段、兩條分流、五種題型，並計算志工安排的必填題數。',
 tip:'先決定誰能看到報名題；題型取決於能選幾個、是否短文字或逐列評分。',steps:i=>'<p>任務 '+i.t+'：先追蹤年齡分流到「'+i.parent+'」的路徑，再檢查 '+i.questions.length+' 題的回答要求與必填標記。</p>',learn:'你能用區段控制路徑，用題型與必填確保回覆符合需求。',
 gen(rnd){const n=qVersion(rnd);return {t:'3-'+(n+1),parent:'家長同意確認'+(n%2?' A':' B'),questions:[{name:'報名代號',need:'輸入一小段文字',type:'簡答',required:true},{name:'第一志願職務',need:'只能選一項',type:'選擇題',required:true},{name:'可到場時段',need:'可以同時勾選上午與下午',type:'核取方塊',required:true},{name:'服務期待程度',need:'在 1～'+(5+n%3)+' 分選一個分數，兩端標示低與高',type:'線性刻度',required:!!(n&2)},{name:'各職務操作熟悉度',need:'每列一個職務，每列只選一個熟悉程度',type:'單選方格',required:!!(n&4)}]}},

 {label:'第一區段應放什麼？',options:['志工安排','告知與同意','年齡分流']},{label:'不同意應前往哪裡？',options:['提交表單','志工安排',i.parent]},{label:'同意但未滿 18 歲應先前往哪裡？',options:['志工安排',i.parent,'提交表單']},{label:'已取得家長同意，下一區段是？',options:['志工安排','告知與同意','提交表單']},...i.questions.map(q=>({label:'「'+q.name+'」應改成哪種題型？',options:qTypes})),{label:'「志工安排」區段應有幾題必填（不含其他區段）？'}],qThreeExpected(i),'<p>表單區段清單：志工安排／年齡分流／'+i.parent+'／告知與同意。請依修復規格重新安排；分流用選擇題「根據答案前往相關區段」，不可用核取方塊代替。</p>')},

 gen(rnd){const n=qVersion(rnd),job=qJobs[n%3],slot=n&1?'下午場':'上午場';return {t:'4-'+(n+1),job,slot,changes:[{text:n&2?'換成展覽首頁圖片':'設定表單背景顏色',ok:true},{text:n&4?'調整標題的文字樣式':'調整表單主題顏色',ok:true},{text:'只把題目文字改成指定紅色，保留原主題與背景',ok:false}],rows:Array.from({length:8},(_,k)=>['V'+(k+1),k<2+n%3?job:qJobs[(n+1)%3],k%3===0?slot:(slot==='上午場'?'下午場':'上午場')])}},
 view(i,el,api){return qView(i,el,api,'<p>你已收到三項外觀需求。請判斷能否由 Google 表單「自訂主題」完成，再確認招募分享與排班回覆。</p>'+qTable('回覆連結至試算表後的節錄',['報名代號','第一志願職務','可到場時段'],i.rows),[
 ...i.changes.map(c=>({label:'「'+c.text+'」如何處理？',options:['可用主題設定完成','需改用其他方式']})),{label:'你要在招募公告分享哪個連結？',options:['作答者連結','編輯者連結']},{label:'要讓新回覆自動進入表格，應在「回覆」做什麼？',options:['連結至試算表','只更換主題','複製編輯者連結']},{label:'第一志願是「'+i.job+'」且時段是「'+i.slot+'」的共有幾人？'},{label:'只更換主題，會自動改變回覆中的職務與時段嗎？',options:['會','不會']}],qFourExpected(i),'<p>交付檢查單：使用「發布」後的「複製作答者連結」讓志工填答；編輯者連結交給協作者修改表單。回覆分頁可連結試算表，新回覆會持續加入。主題可設定文字樣式、主題／背景顏色及首頁圖片，不能獨立指定題目文字顏色。</p>')},
 check:(i,a)=>qCheck(a,qFourExpected(i),[...i.changes.map(()=> '請分辨整體主題、文字樣式與單獨指定文字顏色。'),'請想招募對象需要填答還是修改題目。','請找能讓新回覆持續進入表格的功能。','請逐列同時核對職務與時段，只有兩者皆符合才計入。','請分辨外觀設定與回覆內容。'])}
];
const APP=SHELL({week:7,termWeek:13,title:'動漫／遊戲展志工招募',course:'115-g9',unit:2,rounds:ROUNDS,finale:'你已完成志工報名表設計審查。下一站，你會整理回覆，協助主辦方安排人力。'});
