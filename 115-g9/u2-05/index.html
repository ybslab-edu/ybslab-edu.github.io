<script>
const qEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qTable=(caption,heads,rows)=>'<table class="quest-table"><caption>'+qEsc(caption)+'</caption><thead><tr>'+heads.map(h=>'<th scope="col">'+qEsc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+qEsc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const qVersion=rnd=>Math.floor(rnd()*8);
const qCommon='<div class="quest-note"><p>你要替虛構音樂活動團隊做一份可以填寫的問卷。這裡全部是示意資料；不要填入你或別人的真實個資。</p><p>先完成前測，再於課外看 2-13／2-14；課內依老師安排看 2-15。前測完成前，請先停在這裡。</p><p>你只需複製老師提供的半成品表單一次。把兩組成果分別保留並標上任務版本，不必重新建檔。每關答對兩組不同資料才完成；答錯可以修正，不扣分。</p><p>成果答案符合任務，仍需由老師巡堂抽看表單、預覽與試算表。設備或 Google 權限受阻時，展開下方「備用素材」，告訴老師你未實際操作。</p><details><summary>查看既有紀錄與待確認項目</summary><p>你原有的過關紀錄會保留：原第 1～4 關依序對應現在第 1～4 關，表示舊版完成紀錄，不代表做過這次 Google 實作。</p><p>前測第 2 題完整題意待老師核對；第 6 題主題設定題面待確認，本頁先讓你觀察，不預設該題答案。</p></details></div>';
// 僅記本機使用備用素材的版本與時間；不加入既有成績／雲端格式，不含學生身分。
const qFallbackKey='ybs:u2-05:fallback:v1';
function qReadLog(){try{const a=JSON.parse(localStorage.getItem(qFallbackKey)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string').slice(-64):[]}catch{return []}}
function qView(inst,el,api,content,questions,expected,fallback){
  el.innerHTML=qCommon+'<div class="panel"><h3>示意任務 '+qEsc(inst.t)+'</h3>'+content+
    (fallback?'<details class="quest-fallback"><summary>備用素材：設備或 Google 權限受阻時使用</summary><p>你可以讀模擬成果當場作答。按下按鈕會在此瀏覽器記錄「未實際操作」，不會因此完成關卡；請讓老師另行記錄操作狀況。</p><button class="btn" type="button" data-fallback="use">使用備用素材並記錄</button><div data-fallback="material" hidden>'+fallback+'</div><p class="small quest-log" data-fallback="log" role="status"></p></details>':'')+
    '<div class="quest-answers">'+questions.map((q,k)=>'<label>'+qEsc(q.label)+(q.options?'<select data-answer="'+k+'" aria-label="'+qEsc(q.label)+'"><option value="">請選擇</option>'+q.options.map(x=>'<option value="'+qEsc(x)+'">'+qEsc(x)+'</option>').join('')+'</select>':'<input data-answer="'+k+'" type="number" min="0" step="1" inputmode="numeric" aria-label="'+qEsc(q.label)+'">')+'</label>').join('')+'</div></div>';
  const fields=questions.map((_,k)=>el.querySelector('[data-answer="'+k+'"]'));
  fields.forEach(f=>{f.oninput=()=>api.changed();f.onchange=()=>api.changed()});
  if(fallback){
    const log=el.querySelector('[data-fallback="log"]');
    log.textContent='本機備用紀錄（此瀏覽器，非個人成績）：\n'+(qReadLog().join('\n')||'尚未使用');
    el.querySelector('[data-fallback="use"]').onclick=()=>{
      el.querySelector('[data-fallback="material"]').hidden=false;
      const entry=inst.t+'：未實際操作';let records=qReadLog();
      if(!records.some(x=>x.startsWith(entry)))records.push(entry+'（'+new Date().toLocaleString('zh-TW')+'）');
      try{localStorage.setItem(qFallbackKey,JSON.stringify(records.slice(-64)));log.textContent='本機備用紀錄：\n'+records.slice(-64).join('\n')}catch{log.textContent=entry+'；瀏覽器無法保存，請讓老師記錄。'}
    };
  }
  return {get:()=>fields.map(f=>f.value),ready:()=>fields.every(f=>f.value!==''),fill:()=>{expected.forEach((x,k)=>fields[k].value=String(x))}};
}
function qCheck(answer,expected,hints){
  if(!Array.isArray(answer))return '請先填入成果答案，再送出。';
  const wrong=expected.findIndex((x,k)=>answer[k]==null||String(answer[k]).trim()===''||(typeof x==='number'?(!/^\d+$/.test(String(answer[k]))||Number(answer[k])!==x):answer[k]!==x));
  return wrong<0?true:hints[wrong];
}
const qActivities=['安可曲','燈牌展示','周邊攤位'];
function qCounts(i){return qActivities.map(x=>i.rows.filter(r=>r===x).length)}
function qOneExpected(i){const c=qCounts(i);return [c[i.query],Math.max(...c)-Math.min(...c),qActivities[c.indexOf(Math.max(...c))],'資料','資訊']}
function qTwoExpected(i){return [i.fields.filter(f=>f.preference).length,'告知與同意',i.fields[i.query].keep?'保留':'移除']}
function qThreeExpected(i){return [i.sections.length,i.options.length,'不會','單選題','核取方塊','簡答題','線性刻度']}
function qFourExpected(i){return [i.heads[i.column],i.rows.filter(r=>r[i.column]===i.target).length,'沒有改變']}
const ROUNDS=[
 {lv:1,name:'這份回覆能告訴你什麼',now:'你收到一份觀眾回覆，要替音樂活動團隊讀出重點。',goal:'讀表與統計圖，填入數量、比較結果及資料／資訊分類。',
  tip:'用原始列逐筆計數，再對照圖；比較最高與最低的長條。分類時看是否經過彙整。',
  steps:i=>'<ol><li>任務 '+i.t+'：先把 '+i.rows.length+' 筆示意回覆按活動分組。</li><li>查「'+qActivities[i.query]+'」的長條，再比較最多與最少。</li><li>分別檢查單筆回覆與統計比較句是否經過彙整。</li></ol>',
  learn:'你可以從原始回覆整理出統計資訊，再用資訊判斷活動需求。',
  gen(rnd){const n=qVersion(rnd),counts=[4+n%2,2+Math.floor(n/2)%2,1+Math.floor(n/4)];return {t:'1-'+(n+1),query:n%3,rows:counts.flatMap((c,k)=>Array(c).fill(qActivities[k]))}},
  view(i,el,api){const c=qCounts(i);return qView(i,el,api,qTable('原始回覆（示意）',['回覆編號','你想參加的活動'],i.rows.map((r,k)=>[k+1,r]))+'<p>統計圖（由同一份回覆計算；單位：人）</p><ul class="quest-chart">'+qActivities.map((x,k)=>'<li><span>'+x+'</span><span class="track"><span class="bar" style="width:'+c[k]/i.rows.length*100+'%"></span></span><span>'+c[k]+' 人</span></li>').join('')+'</ul>',[
   {label:'選「'+qActivities[i.query]+'」的有幾人？'},{label:'最多與最少相差幾人？'},{label:'最多人選哪項活動？',options:qActivities},
   {label:'「第 1 筆回覆：'+i.rows[0]+'」屬於什麼？',options:['資料','資訊']},{label:'「統計比較後，安可曲人數最多」屬於什麼？',options:['資料','資訊']}],qOneExpected(i))},
  check:(i,a)=>qCheck(a,qOneExpected(i),['請查原始回覆中指定活動的筆數，再對照同名長條。','請查圖上最高與最低的人數，再計算差距。','請比較圖中各長條的人數。','請查看這一句是否只是保留單筆原始回答。','請查看這一句有沒有先做統計或比較。'])},
 {lv:1,name:'只問這次需要知道的事',now:'你要修整老師提供的半成品表單，讓蒐集內容符合用途。',goal:'完成開頭說明與同意區段，移除沒有用途的欄位，再回答成果。',
  tip:'逐欄對照用途，不因欄位與人有關就一律刪除；先讓填答者知道資料怎麼使用。',
  steps:i=>'<ol><li>任務 '+i.t+'：對照「'+i.purpose+'」檢查 '+i.fields.length+' 個欄位。</li><li>將用途、只看彙整結果、活動後刪除回覆寫入說明，再安排告知與同意區段。</li><li>在你的表單保留這組修整成果，數出偏好題，再檢查「'+i.fields[i.query].name+'」。</li></ol>',
  learn:'你收集的每個欄位都要有用途，填答者也需要知道資料會如何使用及選擇是否同意。',
  gen(rnd){const n=qVersion(rnd),preference=[n&4?'演出時段偏好':'安可曲偏好','燈牌色彩',...(n%2?['周邊種類']:[])];return {t:'2-'+(n+1),purpose:'統計'+preference.join('、')+(n&2?'，並依可到場時段安排人力':''),fields:[...preference.map(name=>({name,keep:true,preference:true})),{name:'可到場時段',keep:!!(n&2),preference:false},{name:'真實姓名（僅示意欄位名，勿填）',keep:false,preference:false},{name:'電話（僅示意欄位名，勿填）',keep:false,preference:false}],query:n%2?preference.length:preference.length+1}},
  view(i,el,api){return qView(i,el,api,'<p>你這組的用途：'+i.purpose+'。資料只看彙整結果，活動後刪除回覆；不收聯絡資料。</p>'+qTable('待修整欄位（示意，不填任何個資）',['編號','欄位'],i.fields.map((f,k)=>[k+1,f.name]))+'<ol><li>在半成品的對應組別刪除無用途欄位。</li><li>在第一區段寫用途、使用方式及刪除時間，保留單選「是否同意作答」。</li><li>預覽確認你先看到告知與同意，後面才是活動偏好調查。</li></ol>',[
   {label:'修整後保留幾題活動偏好題？'},{label:'哪個區段先出現？',options:['活動偏好調查','告知與同意']},{label:'「'+i.fields[i.query].name+'」應保留或移除？',options:['保留','移除']}],qTwoExpected(i),qTable('備用：修整後的表單大綱（示意）',['區段','內容'],[['告知與同意','用途、使用方式、活動後刪除回覆；是否同意作答'],['活動偏好調查',i.fields.filter(f=>f.keep).map(f=>f.name).join('、')]]))},
  check:(i,a)=>qCheck(a,qTwoExpected(i),['請逐欄對照用途，只計算保留的活動偏好題。','請回到預覽開頭，檢查填答前需要先知道哪些事。','請查任務用途是否需要這個欄位，不要只看欄位名稱。'])},
 {lv:2,name:'讓不同回答走到對的地方',now:'你要讓同意與不同意的人走不同路徑，並設定調查題型。',goal:'修改半成品的區段、必填與四種題型，用預覽測試兩條路徑後回答。',
  tip:'從同意題逐段追蹤路徑；複選題選項數不包含同意題，也不包含按鈕。',
  steps:i=>'<ol><li>任務 '+i.t+'：依 '+i.sections.length+' 個調查區段安排題目，設定 '+i.options.length+' 個複選選項。</li><li>將不同意設為提交表單；同意才進調查。依用途設定四種題型及必要題。</li><li>用預覽測試兩條路徑，並試著漏答必填題；查看是否被阻擋。</li></ol>',
  learn:'你用題型決定回答方式，用區段分流決定誰會看到哪些題；預覽能發現漏答與路徑問題。',
  gen(rnd){const n=qVersion(rnd);return {t:'3-'+(n+1),sections:n%2?['活動偏好','參與安排']:['活動偏好'],options:['毛巾','手幅','燈牌',...(n&2?['貼紙']:[]),...(n&4?['徽章']:[])]}},
  view(i,el,api){const spec=[['告知與同意','是否同意作答','同意／不同意，必填，只能選一個'],[i.sections[0],'安可曲','選一首，必填'],[i.sections[0],'周邊種類',i.options.join('、')+'；可複選，至少選一項，必填'],[i.sections.at(-1),'口號提案','自由寫一句虛構口號，非必填'],[i.sections.at(-1),'期待程度','1～5 分，必填']];return qView(i,el,api,'<p>你要依序建立：告知與同意 → '+i.sections.join(' → ')+' → 提交。同意才進入全部調查區段；不同意直接提交。</p>'+qTable('你要修改的結構（示意）',['區段','題目','要求'],spec)+'<p>你可以沿用同一份表單兩組成果。調查區段結尾依序前進；不同意應直接提交。用預覽分別測同意、不同意與漏答必填題。</p>',[
   {label:'同意路徑會遇到幾個調查區段（不含同意區段）？'},{label:'周邊複選題共有幾個選項？'},{label:'不同意路徑會出現「周邊種類」嗎？',options:['會','不會']},
   ...['是否同意作答','周邊種類','口號提案','期待程度'].map(name=>({label:'你為「'+name+'」設定的題型是？',options:['簡答題','單選題','線性刻度','核取方塊']}))],qThreeExpected(i),qTable('備用：預覽觀察紀錄（示意）',['操作','觀察'],[['選同意',i.sections.join(' → ')+' → 提交'],['選不同意','提交，未進入調查'],['查看周邊種類',i.options.join('、')+'；每項可分別勾選'],['查看題型','是否同意只能選一個；周邊可選多個；口號填短文字；期待程度選 1～5 分'],['漏填安可曲或期待程度','必填提示阻擋提交']]))},
  check:(i,a)=>qCheck(a,qThreeExpected(i),['請從預覽的同意選項開始，逐段數調查區段，不含開頭。','請查周邊題的選項清單，不要把其他題算進來。','請從不同意的分流設定追蹤到終點。',...Array(4).fill('請查結構表的回答要求，再對照你表單中的題型與預覽。')])},
 {lv:2,name:'外觀改好了，資料有接上嗎',now:'你要檢查外觀、回覆與試算表是否一致，燈牌資料也在這關核對。',goal:'調整一項老師確認可用的外觀設定，送出兩筆示意回覆並連結試算表，核對欄名與內容。',
  tip:'外觀調整前後都預覽一次；回覆資料請到試算表看欄名與逐列內容。',
  steps:i=>'<ol><li>任務 '+i.t+'：調整外觀前記下燈牌題的 '+i.options.length+' 個選項，調整後再查看。</li><li>依清單送出兩筆示意回答，只核對這組資料。</li><li>到回覆區連結試算表，查「'+i.target+'」所在欄名及列數。不要把時間戳記或前組回覆算進來。</li></ol>',
  learn:'你已核對問卷外觀、示意回覆與試算表內容。下一站，你會整理這些回覆。',
  gen(rnd){const n=qVersion(rnd),colors=['霜白','暖橙',...(n&4?['銀灰']:[])],heads=n&2?['周邊種類','燈牌色彩']:['燈牌色彩','周邊種類'],column=n&1?heads.indexOf('周邊種類'):heads.indexOf('燈牌色彩');const rows=[['霜白','毛巾'],[n&4?'霜白':'暖橙',n&1?'毛巾':'手幅']].map(r=>heads[0]==='燈牌色彩'?r:[r[1],r[0]]);return {t:'4-'+(n+1),options:colors,heads,column,rows,target:column===heads.indexOf('燈牌色彩')?'霜白':'毛巾'}},
  view(i,el,api){return qView(i,el,api,'<p>你這組燈牌色彩選項：'+i.options.join('、')+'。將題目依「'+i.heads.join('、')+'」順序排列。</p><ol><li>記下題目與選項，再調整一項老師已確認可用的主題外觀設定，重新預覽比較。前測第 6 題題面待確認，你先觀察主題面板，不預設該題答案。</li><li>依下表發布／預覽並送出兩筆虛構回答。</li><li>在「回覆」連結試算表；可沿用同一檔案，只核對本組兩筆回覆。</li></ol>'+qTable('你要送出的兩筆回答（示意）',i.heads,i.rows),[
   {label:'「'+i.target+'」所在欄名是？',options:i.heads},{label:'本組兩筆回覆中，有幾筆選了「'+i.target+'」？'},{label:'只調整外觀後，燈牌題選項數有改變嗎？',options:['有改變','沒有改變']}],qFourExpected(i),qTable('備用：連結後的試算表節錄（示意）',['時間戳記',...i.heads],i.rows.map((r,k)=>['示意時間 '+(k+1),...r]))+'<p>模擬觀察紀錄：僅更動老師指定的外觀設定；預覽中的題目文字與選項清單和調整前相同。</p>')},
  check:(i,a)=>qCheck(a,qFourExpected(i),['請查看指定值上方的試算表欄名，別用欄位字母代替題目名稱。','請逐列查看本組兩筆示意回覆的指定欄位，不含前組資料。','請對照外觀調整前後的燈牌題選項清單。'])}
];
