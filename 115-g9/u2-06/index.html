<style>
/* 沿用任務日誌的面板、表格與輸入欄；色彩只引用共用變數。 */
.quest-note{border-left:3px solid var(--ember);padding:calc(var(--u)*2);background:var(--panel);margin-bottom:calc(var(--u)*2)}
.quest-note p{margin:var(--u) 0}
.quest-table{width:100%;border-collapse:collapse;table-layout:fixed}
.quest-table th,.quest-table td{padding:var(--u);border:1px solid var(--edge);text-align:left;overflow-wrap:anywhere}
.quest-table caption{text-align:left;font-weight:700;margin-block:var(--u)}
.quest-chart{list-style:none;padding:0;display:grid;gap:var(--u)}
.quest-chart li{display:grid;grid-template-columns:6em minmax(0,1fr) 3em;gap:var(--u);align-items:center}
.quest-chart .track{height:1em;background:var(--panel-hi)}
.quest-chart .bar{display:block;height:100%;background:var(--dim)}
.quest-answers{display:grid;gap:calc(var(--u)*2);margin-top:calc(var(--u)*2)}
.quest-answers label{display:grid;gap:var(--u);min-width:0}
.quest-answers input,.quest-answers select{font:inherit;width:100%;min-width:0;min-height:44px;border:2px solid var(--edge);border-radius:0;background:var(--panel-hi);color:var(--text);padding:var(--u)}
.quest-fallback{border-top:1px solid var(--edge);padding-top:calc(var(--u)*2)}
.quest-fallback summary{cursor:pointer;padding:var(--u);text-decoration:underline}
.quest-log{white-space:pre-line;overflow-wrap:anywhere}
.quest-media{max-width:100%;height:auto;border:1px solid var(--edge)}
.quest-source{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:559px){
.quest-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.quest-table tr{display:block;margin-bottom:var(--u);border:1px solid var(--edge)}
.quest-table td{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--u);border:0;border-bottom:1px solid var(--edge)}
.quest-table td::before{content:attr(data-label);font-weight:700}
}
body :focus-visible{outline:3px solid var(--text);outline-offset:3px}

<body>
<script src="../../assets/teacher.js?v=20261031e"></script>
<script src="../../assets/lock.js?v=20261120b1"></script>

<script src="../../assets/login.js?v=20261121pr8"></script>
<script src="../../assets/curriculum.js?v=20261110a"></script>
<script src="../../assets/activities.js?v=20261105m"></script>
<script src="../../assets/shell.js?v=20261120a"></script>
<script>
const qEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qTable=(caption,heads,rows)=>'<table class="quest-table"><caption>'+qEsc(caption)+'</caption><thead><tr>'+heads.map(h=>'<th scope="col">'+qEsc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map((x,k)=>'<td data-label="'+qEsc(heads[k])+'">'+qEsc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const qVersion=rnd=>Math.floor(rnd()*8);
const qCommon='<div class="quest-note"><p>你協助虛構音樂活動團隊整理素材。全部為示意資料，不填你或別人的真實個資。</p><p>每關答對兩組不同資料才完成；答錯可修正，不扣分。同一份個人檔案分開保留第一組、第二組及任務版本，不必每次重建。</p><p>成果作答無法證明實際操作，請保留檔案讓老師巡堂抽查。設備或權限受阻時，展開「備用素材」當場作答並記錄「未實際操作」。紀錄只存在此瀏覽器，不會上傳，也不會自動完成其他關卡。</p><details><summary>既有紀錄如何對應</summary><p>原第 1～4 關依索引對應目前第 1～4 關；舊紀錄保留，但不代表已完成新版備份、條件式格式、去重與圖表實作。</p></details> <p><strong>你先依老師安排觀看 2-16、2-17、2-18，再完成四關。</strong></p></div>';
// 僅記本機使用備用素材的版本與時間；不加入既有成績／雲端格式，不含學生身分。
const qFallbackKey='ybs:u2-06:fallback:v1';
function qReadLog(){try{const a=JSON.parse(localStorage.getItem(qFallbackKey)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string').slice(-64):[]}catch{return []}}
function qView(inst,el,api,content,questions,expected,fallback){
  el.innerHTML=qCommon+'<div class="panel"><h3>示意任務 '+qEsc(inst.t)+'</h3>'+content+
    (fallback?'<details class="quest-fallback"><summary>備用素材：設備或 Google 權限受阻時使用</summary><p>你可以讀模擬成果當場作答。按下按鈕會在此瀏覽器記錄「未實際操作」，不會因此完成關卡；請讓老師另行記錄操作狀況。</p><button class="btn" type="button" data-fallback="use">使用備用素材並記錄</button><div data-fallback="material" hidden>'+fallback+'</div><p class="small quest-log" data-fallback="log" role="status"></p></details>':'')+
    '<div class="quest-answers">'+questions.map((q,k)=>'<label>'+qEsc(q.label)+(q.options?'<select data-answer="'+k+'" aria-label="'+qEsc(q.label)+'"><option value="">請選擇</option>'+q.options.map(x=>'<option value="'+qEsc(x)+'">'+qEsc(x)+'</option>').join('')+'</select>':'<input data-answer="'+k+'" type="'+(q.text?'text':'number')+'" '+(q.text?'':'min="0" step="1" inputmode="numeric"')+' aria-label="'+qEsc(q.label)+'">')+'</label>').join('')+'</div></div>';
  const fields=questions.map((_,k)=>el.querySelector('[data-answer="'+k+'"]'));
  fields.forEach(f=>{f.oninput=()=>api.changed();f.onchange=()=>api.changed()});
  if(fallback){
    const log=el.querySelector('[data-fallback="log"]');
    log.textContent='本機備用紀錄（此瀏覽器，非個人成績）：\n'+(qReadLog().join('\n')||'尚未使用');
    el.querySelector('[data-fallback="use"]').onclick=()=>{
      el.querySelector('[data-fallback="material"]').hidden=false;
      const entry=inst.t+'：未實際操作';let records=qReadLog();
      if(!records.some(x=>x.startsWith(entry)))records.push(entry+'（'+new Date().toLocaleString('zh-TW')+'）');
      try{localStorage.setItem(qFallbackKey,JSON.stringify(records.slice(-64)));log.textContent='本機備用紀錄：\n'+records.slice(-64).join('\n')}catch{log.textContent=entry+'；瀏覽器無法保存，請讓老師記錄。'}
    };
  }
  return {get:()=>fields.map(f=>f.value),ready:()=>fields.every(f=>f.value!==''),fill:()=>{expected.forEach((x,k)=>fields[k].value=String(x))}};
}
function qCheck(answer,expected,hints){
  if(!Array.isArray(answer))return '請先填入成果答案，再送出。';
  answer=answer.map(x=>typeof x==='string'?x.trim():x);
  const wrong=expected.findIndex((x,k)=>answer[k]==null||String(answer[k]).trim()===''||(typeof x==='number'?(!/^\d+$/.test(String(answer[k]))||Number(answer[k])!==x):answer[k]!==x));
  return wrong<0?true:hints[wrong];
}
const qPrefs=['安可曲','燈牌','周邊'];
const qHeads=['送出時間','回覆代碼','同意狀態','參與方式','偏好項目','每日聆聽分鐘','選填備註'];
function qDataset(n){
 const mode=n%2?'線上':'現場',counts=[4+n%2,2,1],rows=[];
 counts.forEach((c,k)=>{for(let j=0;j<c;j++)rows.push(['示意時間 '+(rows.length+1),'R'+(n+1)+'-'+(rows.length+1),'同意',mode,qPrefs[k],20+n*3+j,''])});
 rows.push(['示意時間 '+(rows.length+1),'R'+(n+1)+'-X','同意',mode==='現場'?'線上':'現場','燈牌',45,'示意備註']);
 const duplicate=[...rows[n%3]];duplicate[0]='示意時間 '+(rows.length+1);rows.push(duplicate);
 const invalid=[['不同意','安可曲',30],['同意','',40],['同意','燈牌',1500+n]];
 invalid.forEach((r,k)=>rows.splice((n+k*3)%(rows.length+1),0,['示意問題時間 '+k,'E'+(n+1)+'-'+(k+1),r[0],mode,r[1],r[2],'']));
 return {rows,mode};
}
const qValid=r=>r[2]==='同意'&&r[4]!==''&&Number.isFinite(r[5])&&r[5]>=0&&r[5]<=1440;
const qClean=rows=>rows.filter(qValid);
const qUnique=rows=>rows.filter((r,k,a)=>a.findIndex(x=>JSON.stringify(x.slice(1))===JSON.stringify(r.slice(1)))===k);
const qRules='<p>你使用已停止收件的靜態示意副本；處理自己的表單時要先停止回應。清理前保留原始資料並複製工作副本。</p><p>規則：僅納入同意回覆；偏好項目必填，空白排除；每日聆聽分鐘須為 0～1440，超界排除；選填備註空白保留。移除重複時比較回覆代碼至選填備註全部業務欄位，排除送出時間，不採保留最新版規則。</p>';
const qRows=(caption,rows)=>qTable(caption,qHeads,rows.map(r=>r.map(x=>x===''?'（空白）':x)));
const qRawTSV=rows=>[qHeads,...rows].map(r=>r.join('\t')).join('\n');
function qSheet(i,rows,caption){return qRules+qRows(caption,rows)+'<details><summary>複製到試算表的素材與操作提示</summary><p>你在同一份個人試算表建立「'+i.t+' 原始資料」「'+i.t+' 工作副本」。複製下方以 Tab 分隔的文字貼到 A1，空白保持原樣。各關提供獨立練習資料，不必等前關完成。</p><pre class="quest-source">'+qEsc(qRawTSV(rows))+'</pre><p>備份：工作表選單複製。條件式格式：選偏好項目欄，格式 → 條件式格式 → 儲存格空白。移除重複：資料 → 資料清理 → 移除重複內容，取消送出時間欄。篩選：資料 → 建立篩選器。清理後另建偏好／人數彙整區，再插入圖表。</p></details>'}
function qExpected(i){
 if(i.round===0)return [i.rows.length,i.rows.filter(r=>!r[4]).length,['缺失','異常','重複','可保留的選填空白'][i.kind]];
 if(i.round===1)return [qClean(i.rows).length,i.rows.filter(r=>!qValid(r)).map(r=>r[1]).sort().join('、')];
 if(i.round===2){const a=qUnique(i.rows);return [i.rows.length-a.length,a.length,a.filter(r=>r[4]===i.target).length]}
 const a=i.rows.filter(r=>r[3]===i.mode),c=qPrefs.map(p=>a.filter(r=>r[4]===p).length);
 return [a.length,c[i.query],Math.max(...c)-Math.min(...c),'由清理後資料製圖','只代表這份同意的有效回覆'];
}
function qMark(i){
 if(i.kind===0)return '代碼 '+i.rows.find(r=>!r[4])[1]+' 的偏好項目';
 if(i.kind===1)return '代碼 '+i.rows.find(r=>r[5]>1440)[1]+' 的每日聆聽分鐘';
 if(i.kind===2)return '代碼 '+i.rows.find((r,k,a)=>a.some((x,j)=>j!==k&&x[1]===r[1]))[1]+' 的兩筆業務內容';
 return '代碼 '+i.rows.find(qValid)[1]+' 的選填備註';
}
const qRoundNames=['先留下原始資料','找出不能直接分析的列','時間不同，內容還是重複','用乾淨資料回答問題'];
const qGoals=['複製備份，再核對原始筆數、必要欄位空白與指定問題類型。','用條件式格式標空白，依規則排除無效列，同時核對筆數與代碼。','排除送出時間比對重複，核對移除、留下及指定偏好筆數。','篩選指定參與方式，填彙整區並製圖，再核對人數與結論。'];
const ROUNDS=qRoundNames.map((name,round)=>({lv:round<2?1:2,name,now:'你要替音樂活動團隊整理可供分析的回覆。',goal:qGoals[round],tip:'先對照規則與欄名，再逐列核對；選填空白與必要空白要分開處理。',
 steps:i=>'<ol><li>使用任務 '+i.t+' 的獨立練習區，保留原始資料與兩組成果。</li><li>'+qGoals[round]+'</li><li>填入成果，答對後按下一組換不同資料。</li></ol>',learn:'你依分析目的清理資料，保留可回復的副本；結論只適用於這份有效回覆。',
 questionKey:i=>({rows:i.rows,kind:i.kind,query:i.query,target:i.target,mode:i.mode}),
 gen(rnd){const n=qVersion(rnd),d=qDataset(n);return {t:(round+1)+'-'+(n+1),round,kind:n%4,query:n%3,target:qPrefs[n%3],mode:d.mode,rows:round===2?qClean(d.rows):round===3?qUnique(qClean(d.rows)):d.rows}},
 view(i,el,api){
 let questions,content=qSheet(i,i.rows,round===3?'獨立乾淨資料（示意）':'獨立練習資料（示意）'),fallback;
 if(round===0){content+='<p>你要辨識：'+qMark(i)+'。</p>';questions=[{label:'原始資料共有幾筆（不含欄名）？'},{label:'必要的偏好項目空白有幾筆？'},{label:'指定位置屬於哪一類？',options:['缺失','異常','重複','可保留的選填空白']}];fallback=qRows('備用：唯讀原始副本（示意）',i.rows)}
 if(round===1){questions=[{label:'排除無效列後剩幾筆（尚未去重）？'},{label:'被排除的代碼有哪些？依字典序以「、」隔開',text:true}];fallback=qRows('備用：按規則處理後副本（示意）',qClean(i.rows))+'<p>你仍要回查原始資料找出排除代碼，不能只核對剩餘筆數。</p>'}
 if(round===2){questions=[{label:'移除幾筆重複？'},{label:'移除後留下幾筆？'},{label:'留下的「'+i.target+'」有幾筆？'}];fallback=qRows('備用：排除時間比對後副本（示意）',qUnique(i.rows))}
 if(round===3){content+='<p>你只篩選「'+i.mode+'」。將安可曲、燈牌、周邊各自計數填入空白彙整區，再用彙整區插入圓餅圖或長條圖，標題寫出篩選條件；不要只依賴圖表忽略隱藏列。</p>'+qTable('你要在試算表填寫的彙整區',['偏好','人數'],qPrefs.map(p=>[p,'待你計數']));questions=[{label:'符合篩選條件共有幾筆？'},{label:'其中「'+qPrefs[i.query]+'」有幾筆？'},{label:'最多與最少偏好相差幾人？'},{label:'試算表刪列後，下一步怎麼查看有效結果？',options:['回原表單摘要抄數字','由清理後資料製圖']},{label:'這份結果能代表誰？',options:['所有音樂活動觀眾','只代表這份同意的有效回覆']}];fallback=qRows('備用：可供篩選、製圖的乾淨副本（示意）',i.rows)+'<p>你使用這份備援不會補過第 2、3 關；仍要自行篩選、計數及回答。</p>'}
 return qView(i,el,api,content,questions,qExpected(i),fallback);
 },
 check(i,a){return qCheck(a,qExpected(i),round===0?['請查原始列數，不含欄名。','請只查看偏好項目空白列。','請對照指定代碼、欄位與資料規則。']:round===1?['請回工作副本逐列核對三條排除規則，暫不去重。','請對照原始副本與保留列，按指定順序列出完整代碼集合。']:round===2?['請查比對欄位是否排除了送出時間。','請用原筆數扣除重複列，勿再刪除選填空白。','請在去重結果中只計指定偏好。']:['請查參與方式篩選條件。','請在篩選後資料核對指定偏好。','請比較篩選後彙整區各偏好人數。','請查表單摘要與試算表是否會互相回寫清理結果。','請查資料來源與同意、有效規則，勿推論未回覆的人。'])}
}));

// 保留活動 ID、四個 round 索引及既有 mask 格式，不將舊紀錄重算為新實作。
const APP=SHELL({week:8,termWeek:14,title:'問卷回來一團亂',course:'115-g9',unit:2,rounds:ROUNDS,finale:'你已完成四關成果確認。請保留兩組檔案讓老師抽查；使用備用素材時，請告知老師未實際操作。'});
</script>
