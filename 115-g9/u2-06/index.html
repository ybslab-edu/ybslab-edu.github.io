<script>
const qEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qTable=(caption,heads,rows)=>'<table class="quest-table"><caption>'+qEsc(caption)+'</caption><thead><tr>'+heads.map(h=>'<th scope="col">'+qEsc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map((x,k)=>'<td data-label="'+qEsc(heads[k])+'">'+qEsc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const qVersion=rnd=>Math.floor(rnd()*8);
const qCommon='<div class="quest-note"><p>小洛委託你整理星港策展團隊「次元交會動漫／遊戲展」的志工回覆，找出可供排班參考的資訊。你在本頁讀取附件並作答。</p><p>每關答對兩組不同資料才完成；答錯可修正，不扣分。答對後按「下一組」繼續。</p></div>';
function qView(inst,el,api,content,questions,expected,attachment){
  el.innerHTML=qCommon+'<div class="panel"><h3>委託任務 '+qEsc(inst.t)+'</h3>'+content+
    (attachment?'<div class="quest-attach"><h4>本組委託附件</h4>'+attachment+'</div>':'')+
    '<div class="quest-answers">'+questions.map((q,k)=>'<label>'+qEsc(q.label)+(q.options?'<select data-answer="'+k+'" aria-label="'+qEsc(q.label)+'"><option value="">請選擇</option>'+q.options.map(x=>'<option value="'+qEsc(x)+'">'+qEsc(x)+'</option>').join('')+'</select>':'<input data-answer="'+k+'" type="number" min="0" step="1" inputmode="numeric" aria-label="'+qEsc(q.label)+'">')+'</label>').join('')+'</div></div>';
  const fields=questions.map((_,k)=>el.querySelector('[data-answer="'+k+'"]'));
  fields.forEach(f=>{f.oninput=()=>api.changed();f.onchange=()=>api.changed()});
  return {get:()=>fields.map(f=>f.value),ready:()=>fields.every(f=>f.value!==''),fill:()=>{expected.forEach((x,k)=>fields[k].value=String(x))}};
}
function qCheck(answer,expected,hints){
  if(!Array.isArray(answer))return '請先填入成果答案，再送出。';
  const wrong=expected.findIndex((x,k)=>answer[k]==null||String(answer[k]).trim()===''||(typeof x==='number'?(!/^\d+$/.test(String(answer[k]))||Number(answer[k])!==x):answer[k]!==x));
  return wrong<0?true:hints[wrong];
}
const qJobs=['入口引導','遊戲體驗','舞台支援'];
const qHeads=['送出時間','報名代號','組別','招募同意','年齡分流','家長同意','第一志願','可到場時段','期待程度','選填熟悉度'];
// 八個有限版本；前兩版對應教師人工驗算 A、B 基準。
function qDataset(n){
 const b=n%2,shift=Math.floor(n/2)%3,group=n<4?'國中組':'高中組',slot=n<4?'上午':'下午',other=slot==='上午'?'下午':'上午',max=[5,7,4,6,3,5,2,4][n];
 const jobs=qJobs.map((_,k)=>qJobs[(k+shift)%3]),rows=[];
 const add=(id,job,slots,g=group,f='初學')=>rows.push(['09:'+String(rows.length+1).padStart(2,'0'),id,g,'同意','已滿18歲','不適用',job,slots,max,f]);
 const counts=b?[1,2,2]:[2,1,1];
 counts.forEach((c,k)=>{for(let j=0;j<c;j++)add('V'+(rows.length+1),jobs[k],rows.length===0?'上午、下午':slot,group,rows.length===0?'':'初學')});
 add('V1',jobs[0],other); // 同代號、不同內容，保留並交窗口核對。
 add('V'+(rows.length+1),jobs[1],slot,group==='國中組'?'高中組':'國中組');
 if(b){add('V8',jobs[2],other);rows[rows.length-1][8]=''}
 rows[1][4]='未滿18歲';rows[1][5]='已取得';
 const dup=r=>{const x=[...r];x[0]='10:'+String(rows.length).padStart(2,'0');rows.push(x)};
 dup(rows[0]);dup(rows[b?1:0]);
 const bad=(id)=>['11:'+id,id,group,'同意','已滿18歲','不適用',jobs[0],slot,max,''];
 let r=bad('X1');r[3]='不同意';rows.push(r);
 r=bad('X2');r[6]='';rows.push(r);
 r=bad('X3');r[8]=max+1;if(b)r[7]='';rows.push(r);
 r=bad('X4');r[4]='未滿18歲';r[5]='未取得';rows.push(r);
 const offset=Math.floor(n/2)*2,tail=rows.splice(2);rows.push(...tail.slice(offset),...tail.slice(0,offset));
 const demand=qJobs.map(j=>(b?[4,3,2]:[3,1,3])[jobs.indexOf(j)]);
 if(n>=6)demand[qJobs.indexOf(b?jobs[0]:jobs[2])]++;
 return {rows,group,slot,max,expectRequired:!b,demand,query:n===6?jobs[1]:b?jobs[2]:jobs[0],backup:(n%3)};
}
function qReasons(r,i){const a=[];if(r[3]!=='同意'||r[4]==='未滿18歲'&&r[5]!=='已取得')a.push('未取得所需同意');if(!r[6]||!r[7]||i.expectRequired&&r[8]==='')a.push('必填缺失');if(r[8]!==''&&(!Number.isFinite(r[8])||r[8]<1||r[8]>i.max))a.push('刻度超界');return a}
const qClean=(rows,i)=>rows.filter(r=>!qReasons(r,i).length);
const qUnique=rows=>rows.filter((r,k,a)=>a.findIndex(x=>JSON.stringify(x.slice(1))===JSON.stringify(r.slice(1)))===k);
const qRows=(caption,rows)=>qTable(caption,['列號',...qHeads],rows.map((r,k)=>[k+2,...r.map(x=>x===''?'（空白）':x)]));
function qRules(i){return '<p>規格：第一志願與可到場時段必填；時段可複選。期待程度為 1～'+i.max+'，'+(i.expectRequired?'必填':'選填，空白保留')+'；熟悉度選填。招募須同意；未滿 18 歲另須已取得家長同意。</p><p>僅移除除送出時間外全部業務內容相同的列，保留原順序第一筆。同代號內容有變動先保留交窗口核對。統計單位為有效回覆筆數。</p>'}
const qField=(label,options)=>({label,options});
const qNum=label=>({label});
function qTask(i){
 const qs=[],a=[],h=[];
 const ask=(q,v,hint)=>{qs.push(q);a.push(v);h.push(hint)};
 let attachment=qRules(i)+qRows(i.round<2?'截止時原始回覆':i.round===2?'已清理、尚未去重的工作副本':'已清理並去重的有效回覆',i.rows);
 if(i.round===0){
  ask(qField('哪個處理順序能保留完整原始內容？',['停止接受回應 → 複製原始回覆到新試算表備份 → 在工作副本清理','先清理原始回覆 → 停止接受回應 → 備份剩餘列']), '停止接受回應 → 複製原始回覆到新試算表備份 → 在工作副本清理','請先保留可回查的原始內容。');
  // 同筆數但被改動的副本也必須排除；顯示完整候選內容供獨立核對。
  const copies=[i.rows.map(r=>[...r]),i.rows.map(r=>[...r]),i.rows.map(r=>[...r])];
  copies[(i.backup+1)%3][0][6]=qJobs[(qJobs.indexOf(i.rows[0][6])+1)%3];copies[(i.backup+2)%3].pop();
  attachment+='<p>收件狀態：已到截止時間，尚接受回應。三份候選副本的其他欄位均已核對一致；你要再核對總筆數、第 2 列第一志願及末列報名代號。</p>'+qTable('候選副本核對表',['副本','資料筆數','第 2 列第一志願','末列報名代號'],copies.map((rows,k)=>[['甲','乙','丙'][k],rows.length,rows[0][6],rows[rows.length-1][1]]));
  ask(qField('哪份副本完整保留截止時的原始內容？',['甲','乙','丙']),['甲','乙','丙'][i.backup],'請同時核對筆數與每列內容。');
  ask(qNum('原始回覆幾筆（不含欄名）？'),i.rows.length,'請數資料列，不含欄名。');
  ask(qNum('本組期待程度的刻度上限是多少？'),i.max,'請以本組規格核對數值上限，不能套用另一組。');
  const missing=i.rows.findIndex(r=>r[6]==='')+2,abnormal=i.rows.findIndex(r=>r[8]>i.max)+2;
  const checks=[['第 '+missing+' 列第一志願空白','必填缺失'],['第 '+abnormal+' 列期待程度數字','數值異常'],['第 2 列與第 '+(i.rows.findIndex((r,k)=>k>0&&JSON.stringify(r.slice(1))===JSON.stringify(i.rows[0].slice(1)))+2)+' 列除時間外的業務內容','完全重複'],['第 2 列熟悉度空白','可保留的選填空白']];
  checks.forEach(([label,v])=>ask(qField(label+'，應如何分類？',['必填缺失','數值異常','完全重複','可保留的選填空白']),v,'請依欄位規格及兩列實際內容判斷。'));
 }else if(i.round===1){
  ask(qField('要標記 A1:J'+(i.rows.length+1)+' 中的空白，應用哪個設定？',['格式 → 條件式格式設定；範圍 A2:J'+(i.rows.length+1),'資料 → 移除重複；只選送出時間']), '格式 → 條件式格式設定；範圍 A2:J'+(i.rows.length+1),'請選標記空白的工具，範圍須涵蓋資料列並排除欄名。');
  i.rows.forEach((r,k)=>ask(qField('第 '+(k+2)+' 列應保留或排除（先不去重）？',['保留','排除']),qReasons(r,i).length?'排除':'保留','請核對該列同意、必填與刻度；選填空白不等於排除。'));
  const k=i.rows.findIndex(r=>r[8]>i.max),reasons=qReasons(i.rows[k],i);
  // 各原因分別判斷，允許同列同時有多種問題。
  ['未取得所需同意','必填缺失','刻度超界'].forEach(reason=>ask(qField('第 '+(k+2)+' 列是否有「'+reason+'」？',['有','沒有']),reasons.includes(reason)?'有':'沒有','請逐項核對該列，不把同列問題限制為一種。'));
  ask(qNum('以上逐列處理後剩幾筆（尚未去重）？'),qClean(i.rows,i).length,'請只扣除被排除的列，每列扣一次。');
 }else if(i.round===2){
  attachment+='<p>操作範圍：A1:J'+(i.rows.length+1)+'，包含欄名。A 為送出時間，B～J 為全部業務欄位。</p>';
  ask(qField('選取完整範圍並勾選包含欄名後，去重應比對哪些欄？',['B～J 全部業務欄位，不比對 A 送出時間','只比對 B 報名代號','A～J 全部欄位']), 'B～J 全部業務欄位，不比對 A 送出時間','時間不同仍可能是同份回覆，業務欄位須全部比對。');
  i.rows.forEach((r,k)=>ask(qField('第 '+(k+2)+' 列應如何處理？',['保留','移除完全重複列']),i.rows.findIndex(x=>JSON.stringify(x.slice(1))===JSON.stringify(r.slice(1)))===k?'保留':'移除完全重複列','請與前面的全部業務內容比對，只留下每群第一筆。'));
  ask(qField('同代號但時段不同的兩列，應如何處理？',['兩列保留並交窗口核對','只留送出時間較晚的一列']), '兩列保留並交窗口核對','本組只移除業務內容完全相同的列。');
  const unique=qUnique(i.rows);
  ask(qNum('總共移除幾筆？'),i.rows.length-unique.length,'三列同內容只移除兩列。');
  ask(qNum('留下幾筆有效回覆？'),unique.length,'請用原筆數扣除移除列數。');
  ask(qNum('留下的「'+i.query+'」共幾筆（所有組別、場次）？'),unique.filter(r=>r[6]===i.query).length,'請在保留列中統計指定第一志願。');
 }else{
  const selected=i.rows.filter(r=>r[2]===i.group&&r[7].split('、').includes(i.slot)),counts=qJobs.map(job=>selected.filter(r=>r[6]===job).length),gaps=counts.map((c,k)=>Math.max(i.demand[k]-c,0)),title=i.group+'・'+i.slot+'場第一志願分布';
  attachment+='<p>你要篩選「'+i.group+'」且可到「'+i.slot+'場」（'+(i.slot==='上午'?'09:00–12:00':'13:00–17:00')+'）。雙時段列在本場只計一次；需求僅供補招參考，尚未排班。</p>'+qTable('本組需求',['職務','需求筆數'],qJobs.map((j,k)=>[j,i.demand[k]]));
  ask(qField('你要只顯示符合組別及場次的列，應用哪項功能？',['篩選器，同時設定組別與包含指定時段','移除重複，只比對組別']), '篩選器，同時設定組別與包含指定時段','請選只顯示符合條件資料的功能。');
  qJobs.forEach((j,k)=>ask(qNum(j+'：符合條件的回覆幾筆？'),counts[k],'請同時檢查組別、時段與第一志願。'));
  ask(qNum('篩選後總共幾筆？'),selected.length,'雙時段在本場只計一次。');
  ask(qNum('其中「'+i.query+'」占百分之幾？填整數'),counts[qJobs.indexOf(i.query)]/selected.length*100,'以指定職務筆數除以篩選總筆數，再乘 100。');
  qJobs.forEach((j,k)=>ask(qNum(j+'：補招缺口幾筆？'),gaps[k],'缺口為需求減回覆，若小於零則記零。'));
  ask(qField('應優先補招哪個職務（缺口最大）？',qJobs),qJobs[gaps.indexOf(Math.max(...gaps))],'請比較需求缺口，不只比較回覆多寡。');
  const good=i.backup,candidates=[0,1,2].map(k=>({name:['甲','乙','丙'][k],title:k===(good+1)%3?title.replace(i.slot,i.slot==='上午'?'下午':'上午'):title,source:k===(good+2)%3?'原始表單摘要':'本組清理去重後篩選結果',counts:k===(good+2)%3?counts.map(c=>c+1):counts}));
  attachment+=qTable('候選圓餅圖規格（依各職務筆數畫出比例）',['版本','標題','資料來源',...qJobs],candidates.map(c=>[c.name,c.title,c.source,...c.counts]));
  // 以 CSS 圓餅呈現候選數據，同時保留文字數值供閱讀。
  attachment+=candidates.map(c=>{const sum=c.counts.reduce((a,b)=>a+b),x=c.counts[0]/sum*100,y=(c.counts[0]+c.counts[1])/sum*100;return '<figure><figcaption>'+c.name+'：'+qEsc(c.title)+'（'+qEsc(c.source)+'）</figcaption><div role="img" aria-label="'+qEsc(qJobs.map((j,k)=>j+' '+c.counts[k]+' 筆').join('、'))+'" style="width:120px;height:120px;border-radius:50%;background:conic-gradient(#cc6034 0 '+x+'%,#398989 '+x+'% '+y+'%,#a98bd4 '+y+'% 100%)"></div></figure>'}).join('')+'<p>圓餅色塊依序：橘色入口引導、青色遊戲體驗、紫色舞台支援。</p>';
  ask(qField('哪張圓餅圖的來源、數值與標題都符合本組？',['甲','乙','丙']),['甲','乙','丙'][good],'逐一核對資料來源、三項筆數、組別與場次標題。');
  ask(qField('清理後應在哪裡分析有效回覆？',['使用清理後試算表的篩選及圖表工具','沿用尚未更新的原表單摘要']), '使用清理後試算表的篩選及圖表工具','試算表清理不會回寫原表單摘要。');
 }
 return {questions:qs,expected:a,hints:h,attachment};
}
const qRoundNames=['收件截止，先保住原始回覆','顏色只提醒，你決定哪些列留下','送出時間不同，也可能是同一份回覆','哪個職務缺回覆，圖表要有依據'];
const qGoals=['你要安排停止收件與備份順序，核對完整備份並辨識四種資料狀況。','你要選擇標記空白的設定，再依規格逐列決定是否留下；先不移除重複。','你要比較全部業務內容，保留每群第一筆；相似但不同的回覆要留下。','你要依指定組別及場次統計第一志願，選對圓餅圖並找出補招缺口。'];
const ROUNDS=qRoundNames.map((name,round)=>({lv:round<2?1:2,name,now:'你要把小洛收到的志工回覆整理成排班依據。',goal:qGoals[round],tip:'先核對附件規格，再逐列檢查；最後才填彙總數字。',
 steps:i=>'<ol><li>讀取委託 '+i.t+' 的規格與附件。</li><li>'+qGoals[round]+'</li><li>逐項填答，再核對彙總；答對後按「下一組」。</li></ol>',learn:'你保留原始回覆，依用途清理、去重與篩選，讓招募判斷有資料依據。',
 questionKey:i=>({rows:i.rows,max:i.max,expectRequired:i.expectRequired,group:i.group,slot:i.slot,demand:i.demand,query:i.query,backup:i.backup}),
 gen(rnd){const n=qVersion(rnd),d=qDataset(n);return {...d,t:(round+1)+'-'+(n+1),round,rows:round===2?qClean(d.rows,d):round===3?qUnique(qClean(d.rows,d)):d.rows}},
 view(i,el,api){const t=qTask(i);return qView(i,el,api,'<p>'+qGoals[round]+'</p>',t.questions,t.expected,t.attachment)},
 check(i,a){const t=qTask(i);return qCheck(a,t.expected,t.hints)}
}));
const qExpected=i=>qTask(i).expected;
// 保留 week 8、round 0～3 與 mask，相容原完成紀錄。
const APP=SHELL({week:8,termWeek:14,title:'志工回覆整理所',course:'115-g9',unit:2,rounds:ROUNDS,finale:'你已核對兩組回覆的備份、清理、去重與分析成果，可以把有依據的補招建議交給小洛。'});
</script>
