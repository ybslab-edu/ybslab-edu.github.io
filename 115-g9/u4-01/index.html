<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":10,"course":"115-g9","unit":4,"title":"馬祖斷線了","rounds":[{"name":"幫訊息找路","learn":"網際網路是「網路的網路」：很多城市、很多國家的網路用線路接在一起，一條斷了，訊息可以改走別條。線路越多條，越不容易整個斷掉。"},{"name":"斷了會影響誰","now":"颱風夜加上地震，好幾條海纜和光纖同時斷了。這一題只看「有線」的線路。","goal":"點出所有「再也連不到台北」的地方。","learn":"一個地方如果只靠一兩條線連出去，線一斷就整個失聯，就像 2023 年馬祖的兩條海纜都斷了。所以重要的地方都會準備備援：多拉幾條、換一條路線，或用微波、衛星頂著。"},{"name":"選傳輸媒介","now":"訊息不只走海纜。後援會的小澄問：「那馬祖斷線那時候，訊息是怎麼傳過來的？」","goal":"每一個情境，選最適合的傳輸媒介。","learn":"光纖用光傳訊號，量大又穩，國際網路幾乎都靠海纜；微波和衛星不用拉線，適合當備援或到不了的地方；網路線（雙絞線）用在室內短距離。"},{"name":"訊號要跑多久","goal":"估算訊號在路上「傳播」單程大約要幾毫秒（1 秒＝1000 毫秒）。這裡只算在線路和空中跑的時間，不含機器處理、排隊等待。","learn":"這只是傳播時間，真正的網路回應還要加上路由器、伺服器處理和排隊的時間，所以實際會更久。同步衛星太高，上去再下來就要將近四分之一秒，視訊會一直慢半拍；低軌衛星低很多，延遲小，但要很多顆一起繞才能一直有訊號。海纜延遲小、量又大，所以還是國際網路的主力。"}]});</script></body></html>
