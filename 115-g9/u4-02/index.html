<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":11,"course":"115-g9","unit":4,"title":"差一個字母的網站","rounds":[{"name":"把封包組回來","now":"小安傳一則訊息到馬祖給小澄。訊息被拆成好幾個封包，各走各的路，到的順序全亂了。","goal":"照封包上的編號，把訊息組回原來的樣子。","learn":"訊息會被拆成一個個「封包」，每包貼上編號、寄件和收件的 IP 位址，各自找路走。到了以後，電腦照編號組回去。這套約定就是 TCP/IP：IP 負責送到對的地址，TCP 負責編號、組回去、確認沒漏掉。"},{"name":"網址的真名","now":"六連星宣布加場！群組裡一下子貼了好多購票網址。官方購票網站是 tixstar.com.tw。","goal":"判斷每一個網址，是不是真的官方網站。","learn":"去掉 https:// 之後，第一個「/」前面那段是主機名稱，從右往左讀：tw 是台灣、com 是公司、tixstar 才是網站自己的名字。冒充的網站會多一個字母、換一個很像的字，或把官方名字放在前面當裝飾。網址列的鎖頭（HTTPS）只代表傳輸有加密，不代表對方就是官方。"},{"name":"少了哪一包","now":"小澄那邊的網路還不太穩，有一個封包在路上掉了，還有一個封包重複寄到兩次。","goal":"找出掉了的是第幾號，請對方重送。","learn":"TCP 會檢查每一個編號：掉了就請對方重送，重複的就丟掉一份。所以就算網路不穩，收到的訊息也不會少字或多字。"},{"name":"名字換門牌","now":"網址是給人看的名字；電腦真正要的是 IP 位址（門牌號碼）。瀏覽器會先去查「網路電話簿」（DNS）。","goal":"點了這個網址，瀏覽器實際會連到哪一個 IP 位址？","learn":"DNS 把好記的網域名稱換成 IP 位址，瀏覽器再照 IP 位址把封包送過去。冒充的網址就算看起來很像，查出來的 IP 是另一台電腦，你輸入的帳號密碼就送到別人手上了。"}]});</script></body></html>
