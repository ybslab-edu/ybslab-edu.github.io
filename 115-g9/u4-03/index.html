<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":12,"course":"115-g9","unit":4,"title":"Wi-Fi 死角在哪裡","rounds":[{"name":"選無線技術","now":"後援會借了社區活動中心練應援。一個下午，大家用了好幾種無線連線。","goal":"每一件事，選它用的無線技術。","learn":"無線網路用電波傳資料，差別在距離和用途：NFC 最近、碰一下就好；藍牙連身邊的裝置；Wi-Fi 涵蓋一個屋子；行動網路靠基地台，走到哪都能用。"},{"name":"收得到嗎","now":"小安拿著手機在活動中心裡走來走去，藍牙喇叭走遠就斷了。","goal":"依本題假設，不超過參考距離就收得到。這個距離收得到嗎？","learn":"電波離得越遠越弱，穿過牆也會變弱。NFC 故意設計得很短，碰一下才會動作，比較安全；藍牙省電、範圍小；Wi-Fi 範圍大一點、速度快；行動網路靠一座座基地台接力。"},{"name":"找出 Wi-Fi 死角","now":"小安用手機的訊號測量 App，在活動中心每一格（約 3 公尺）量了一次 Wi-Fi 訊號（數字是本題的模擬值）。📶 是路由器，粗線是牆。","goal":"點出所有「死角」：訊號比 -70 還弱的格子。","learn":"Wi-Fi 訊號離路由器越遠越弱，每穿過一道牆又會掉一截。測出整間的訊號，就能畫出「訊號地圖」，找出死角，再決定路由器要搬到哪裡、或多加一台。"},{"name":"路由器放哪裡","now":"死角太多了。後援會決定把路由器搬家，候選位置有 A、B、C、D 四個。","goal":"選出「能讓最多格收得到（-70 或更強）」的位置。","learn":"路由器放在中間、少隔幾道牆、放高一點，訊號才會均勻。工程師也是先模擬、比較幾個方案，再決定。真的不夠時，可以加一台延伸器或用多台組成「網狀網路」。"}]});</script></body></html>
