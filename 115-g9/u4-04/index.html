<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":13,"course":"115-g9","unit":4,"title":"短影音怎麼猜中我","rounds":[{"name":"這是哪一種服務","now":"跨年後的一個星期，小安打開手機的「螢幕使用時間」，發現自己一天用了好多網路服務。","goal":"把每一件事分到它屬於的網路服務。","learn":"網路服務大致分成通訊、社群、娛樂、消費。很多 App 其實同時做好幾種（例如社群平台也能購物），所以要看你「正在用它做什麼」。"},{"name":"猜下一支推薦","now":"小安發現：短影音一直推六連星給他。他打開了自己的觀看紀錄。","goal":"照下面的規則，猜出 App 下一支最可能推給他哪一支。","learn":"推薦系統會記下你看了什麼、看多久、滑掉什麼，替每種內容打分數，再推最可能讓你繼續看的。真實的推薦系統用的資料多得多，還會參考「跟你很像的人」看了什麼。"},{"name":"是不是物聯網","now":"小安家的掃地機器人，好像知道他們什麼時候出門。","goal":"判斷每一個東西是不是物聯網裝置。","learn":"物聯網（IoT）是把能感測或控制真實世界的裝置連上網路。智慧電表只量用電量、傳回電力公司，也算物聯網；掃地機器人還會收指令動起來。重點是「連網」：只會自動、不會連網的不算。"},{"name":"感測、連網、動作","now":"一個完整的物聯網應用，常常分成三步。","goal":"每一句話，是物聯網的哪一步？","learn":"一個完整的物聯網應用常走這三步：感測（收集資料）→ 連網（傳到雲端或手機）→ 動作（自動反應）。不是每個裝置三步都自己做，例如電表只負責感測和傳送。這些資料也會被存起來分析，所以使用物聯網裝置，也要想想它蒐集了你哪些資料。"}]});</script></body></html>
