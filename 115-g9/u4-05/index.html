<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":14,"course":"115-g9","unit":4,"title":"影片住在哪個國家","rounds":[{"name":"在手機上還是雲端","now":"小安先確認跨年影片已經完整備份到雲端相簿，才把手機裡的那一份刪掉。（有些相簿是「同步」，在手機刪了雲端也會跟著刪，一定要先搞清楚。）那影片現在在哪裡？","goal":"每一件事，主要是在你自己的手機（電腦）上做的，還是在雲端做的？","learn":"雲端運算就是「用網路租別人的電腦」：資料存在、程式跑在雲端公司的資料中心，你只要連得上網，換哪一台裝置都能用。代價是沒有網路就不能用，資料也放在別人家。"},{"name":"租哪一種雲","now":"後援會要做一個售票和報名的網站，大家提出好幾種用雲端的方法。","goal":"每一種用法，是 IaaS、PaaS 還是 SaaS？","learn":"IaaS 租的是機器（基礎設施），系統和程式自己裝；PaaS 租的是平台，只要寫自己的程式；SaaS 直接用做好的軟體，開瀏覽器就能用。越往 SaaS，自己要管的越少，能改的也越少。"},{"name":"誰管哪一層","goal":"這樣做的話，後援會自己要管哪幾層？把要自己管的都點起來。","learn":"自己架：五層全部自己管。IaaS：雲端公司管硬體，系統以上自己管。PaaS：連作業系統和執行環境都交給平台，只管程式和資料。SaaS：只剩資料要自己顧。這就是第 1 單元那張分層圖，被切給不同的人管。"},{"name":"資料中心蓋在哪","now":"雲端相簿的公司要在台灣蓋一座新的資料中心，候選地點有四個。","goal":"依照公司的條件，選出最適合的地點。","learn":"資料中心裡成千上萬台電腦日夜不停，要大量的電，也要很多電來冷卻；它要靠海纜和世界連線，也怕地震。所以選地點就像地理考題：電力、氣候、交通（網路）、地質都要一起考慮。"}]});</script></body></html>
