<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":15,"course":"115-g9","unit":4,"title":"問 AI 一個問題","rounds":[{"name":"一個問題的旅程","now":"期末考前一晚，小安半夜卡在一題數學，拿起手機問 AI。按下送出，幾秒後答案就出現了。","goal":"把這幾秒鐘裡發生的事，照順序排好。","learn":"一個問題的旅程，把整學期串起來：輸入和輸出是第 1 單元的系統平台，變成 0 和 1 是第 2 單元的數位化，封包、Wi-Fi、海纜、資料中心是第 4 單元的網路。幾秒鐘裡，三個單元全都用上了。最後別忘了：AI 算出來的數學解答也可能錯，自己再驗算一次。"},{"name":"這一步是哪一單元","now":"小安回頭看這學期的筆記：原來每一步，都是某一個單元學過的。","goal":"每一步，是哪一個單元學的？","learn":"同一件事可以從三個角度看：機器怎麼做（系統平台）、資料長什麼樣（數位化）、資料怎麼送（網路）。下學期還會加上「怎麼命令電腦」——程式設計。"},{"name":"雲端版和手機版","now":"小安的新手機說：「這個 AI 可以直接在手機上算，不用連網。」這一題比較兩種版本：雲端版（問題送到資料中心算），和本題的手機版（模型先下載好、這次完全離線）。","goal":"每一步，是兩種都有、只有雲端版才有，還是只有手機版才有？","learn":"在手機上算的 AI，省掉了整段網路旅程：比較快、沒網路也能用、資料不用離開手機；但手機的晶片和記憶體有限，模型比較小。這就是第 1 單元說的 NPU，和 AI 手機的 RAM 越來越大的原因。"},{"name":"雲端算還是手機算","now":"雲端 AI 和手機上的 AI 各有長處。本題的雲端 AI 模型很大、可以上網搜尋；本題的手機 AI 是先下載好、完全離線的小模型。","goal":"每一個情況，比較適合用哪一種？","learn":"現在的 AI 常常「分工」：簡單、急、私密的在手機上算，難的、需要大量資料的送到雲端。選哪一種，就是在網路、速度、隱私和能力之間取捨。不管哪一種，AI 的答案都可能錯，重要的事要自己再查證。"}]});</script></body></html>
