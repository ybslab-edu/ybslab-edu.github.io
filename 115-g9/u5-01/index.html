<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":16,"course":"115-g9","unit":5,"title":"倒數一百天的 AI","rounds":[{"name":"是不是 AI","now":"寒假結束，林老師宣布：九年三班要在畢業園遊會擺一個「猜拳贏 AI」攤位。小安心想：AI 到底是什麼？我身邊有哪些東西用了 AI？","goal":"判斷每一件事，是 AI 在做，還是一般的程式照固定規則做。","learn":"一般程式照人寫好的規則做事；AI（人工智慧）是讓電腦從大量資料裡「學」出規則，所以能處理沒看過的照片、聲音和句子。"},{"name":"AI 在做哪一種事","now":"小安列出生活中的 AI，發現它們做的事不太一樣。","goal":"把每一個 AI 的工作，分到辨識、預測、生成、推薦。","learn":"AI 常做的四種事：辨識（看懂、聽懂）、預測（猜未來）、生成（做出新的文字、圖片、聲音）、推薦（幫你挑）。同一個 App 可能同時用好幾種。"},{"name":"資料出了什麼問題","now":"小禾試著教 AI 認東西，結果一直出錯。AI 是從資料學的，資料有問題，AI 就學歪。","goal":"每一個失敗的例子，找出資料出了什麼問題。","learn":"AI 學得好不好，看資料：要夠多、要涵蓋各種情況、標籤要正確；沒教過的東西，AI 也只能硬猜。這就是「垃圾進、垃圾出」。"},{"name":"一個 AI 怎麼做出來","now":"園遊會的猜拳 AI 要從零開始做。小安上網查，整理出做一個 AI 的步驟，但順序亂掉了。","goal":"把做出一個 AI 的步驟排好。","learn":"做 AI 的流程：定義問題 → 收集資料 → 標註 → 訓練 → 測試 → 上線 → 回饋改進。這學期我們會一站一站走過，最後做出猜拳 AI。"}]});</script></body></html>
