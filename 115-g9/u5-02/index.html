<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":17,"course":"115-g9","unit":5,"title":"AI 說的就對嗎","rounds":[{"name":"哪裡出了問題","now":"林老師說：做攤位前，先看看別人用 AI 闖了哪些禍。","goal":"每一件事，主要是哪一種問題？","learn":"AI 從資料學，資料裡的偏見會被學進去；AI 也讓造假、侵犯隱私和著作權變得很容易。用 AI 的人要負責：不傷害別人、不冒用別人的作品。"},{"name":"可以這樣用嗎","now":"會考快到了，班上很多人開始用 AI 讀書、寫作業。","goal":"判斷每一種用法合不合適。","learn":"AI 可以當幫手，但不能代替你思考：自己的作業要自己完成，用了 AI 要說清楚，AI 給的資料要查證，也不能拿 AI 傷害別人。"},{"name":"幫 AI 查證","now":"小安請 AI 幫忙整理理化和地理的重點，AI 回答得很有自信。可是 AI 有時會一本正經地講錯（這叫「幻覺」）。","goal":"用右邊課本整理的資料卡，檢查 AI 的每一句話。","learn":"AI 是猜「最可能的下一個字」，不是查資料庫，所以會講錯，而且講得很有自信。重要的事要找可靠的來源查證；資料卡沒寫的，不代表錯，但要再查。"},{"name":"這是真的嗎","now":"群組裡傳來一支「隔壁班在園遊會攤位打架」的影片，大家都在轉。小禾說：「先別轉，查一下再說。」","goal":"每一個線索，是「值得懷疑」的線索，還是「不能證明是真的」？","learn":"AI 讓假照片、假影片看起來很逼真，「看起來很真」和「很多人轉」都不能當證據。要追出處、找原始檔、看細節、查內容憑證；不確定就先不要轉。"}]});</script></body></html>
