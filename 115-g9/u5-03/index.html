<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":18,"course":"115-g9","unit":5,"title":"寫給學弟妹的繪本","rounds":[{"name":"是不是生成式 AI","now":"林老師說：班上要做一本《國中生存指南》繪本，送給剛入學的學弟妹，文字和插圖都可以請 AI 幫忙。可是，哪些 AI 會「做出新東西」？","goal":"判斷每一件事，是不是生成式 AI 在做。","learn":"生成式 AI 會「做出新的內容」，像寫文章、畫圖、作曲、配音。它是從大量的文字、圖片裡學會「通常長什麼樣子」，再組合出新的。"},{"name":"提示詞少了什麼","now":"小禾寫了一段給 AI 的指令（提示詞），可是 AI 寫出來的總是怪怪的。","goal":"這段提示詞少了哪一個要素？","learn":"提示詞越清楚，AI 越能寫出你要的東西：說清楚任務、讀者、格式和語氣。少了一項，AI 就只好自己亂猜。"},{"name":"選出最好的提示詞","now":"繪本要分頁印出來給七年級看。小安寫了好幾個版本的提示詞，不知道該用哪一個。","goal":"哪一個提示詞，最能做出下面這個目標？","learn":"選提示詞時，把目標拆成幾個條件，一個一個對照。說得太少，AI 只能亂猜；說錯了，AI 會很認真地做錯。"},{"name":"猜下一個字","now":"小安好奇：AI 怎麼寫出一整句話？原來語言模型每次只做一件事——猜「下一個詞最可能是什麼」。","goal":"從「國中的第一天，我」開始，每一步都選機率最高的詞，接出一句話。","learn":"語言模型就是一直猜下一個詞：算出每個詞的機率，挑一個接上去，再猜下一個。實際的 AI 會加一點隨機，不一定每次都挑最高的，所以同一個問題問兩次，答案會不一樣，也可能接出錯的內容。"}]});</script></body></html>
