<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":19,"course":"115-g9","unit":5,"title":"繪本需要插圖","rounds":[{"name":"哪一句提示詞","now":"繪本需要插圖。小禾用 AI 畫了一張，可是忘了自己打了什麼提示詞。","goal":"哪一句提示詞，最可能畫出這張圖？","learn":"圖片生成 AI 會把提示詞裡的每個條件畫出來。寫提示詞就像點菜：主角、動作、地點、時間、風格，寫得越清楚，越接近你要的。"},{"name":"改一個詞","now":"小安把提示詞改了一個詞，再請 AI 畫一次。","goal":"改過的提示詞，會畫出哪一張？","learn":"提示詞改一個詞，AI 就會改畫面裡對應的部分。想微調圖，就一次只改一個條件，比較容易找到你要的版本。"},{"name":"可以放進繪本嗎","now":"繪本要印出來送給學弟妹，班上收集了很多圖。林老師提醒：不是網路上找得到的圖都能用。","goal":"判斷每一張圖可不可以放進繪本。","learn":"使用別人的作品要有授權，並照規定標示來源；知名角色有著作權，就算請 AI 畫出來也一樣不行；拍到別人要先問過。用了 AI 生成的圖，也要誠實標示。"},{"name":"排好繪本頁","now":"AI 寫好的五頁故事印出來，結果順序全亂了。","goal":"把五頁排成一個完整的故事。","learn":"AI 可以幫忙寫，但要把文字、圖片整合成一本好讀的繪本，還是要靠人來安排順序、檢查前後有沒有接得上。"}]});</script></body></html>
