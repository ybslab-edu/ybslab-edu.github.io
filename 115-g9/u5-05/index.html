<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":20,"course":"115-g9","unit":5,"title":"回收分類機","rounds":[{"name":"照著樹分類","now":"環保股長阿哲想做一台「回收分類機」放在園遊會。他先畫了一棵「決策樹」：一題一題問下去，就能分到某一類。","goal":"照著決策樹，把每一件東西分到正確的類別。","learn":"決策樹就是一連串「是或否」的問題，從上往下問，最後落到一個答案。電腦可以從很多已經分好類的例子，自己找出該問哪些問題——這就是機器學習。"},{"name":"哪一題分得最乾淨","now":"阿哲收集了一些例子，每一個都已經標好「可回收」或「不可回收」（這叫標籤）。他想找一個問題，一問就能把兩類分開。","goal":"哪一個問題，能把「可回收」和「不可回收」完全分開，一個都不錯？","learn":"監督式學習：給電腦很多「有標準答案」的例子，讓它找出最能分開答案的規則。決策樹就是一次挑一個「分得最乾淨」的問題。"},{"name":"自己蓋一棵樹","now":"阿哲又收集了一批乾淨的回收物，每一件都標好了類別。這次換你來設計決策樹。","goal":"選好兩個問題和三個答案，讓樹把下面每一個例子都分對。","learn":"機器學習的「訓練」，就是不斷調整規則，直到訓練資料都分對。電腦會自動試很多種問題組合，挑出錯最少的那棵樹；跟答案無關的特徵（像顏色），就不會被選上。"},{"name":"考考這棵樹","now":"樹做好了，阿哲拿一批「它沒看過」的東西來測試（測試資料），每一件都附上真正的分類。","goal":"照決策樹分一次，算出它的準確率（分對的數量 ÷ 全部 × 100%）。","learn":"訓練用的資料和測試用的資料要分開，才知道模型遇到新東西準不準。準確率不是 100% 很正常：像鋁箔包是紙和鋁黏在一起，這棵簡單的樹就會分錯，要再收集這類例子改進。"}]});</script></body></html>
