<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":21,"course":"115-g9","unit":5,"title":"跟誰最像","rounds":[{"name":"最近的鄰居","now":"園遊會攤位要準備飲料。小禾調查了全班：每個人喜歡的「甜度」和「冰塊量」（0～10），還有他是奶茶派還是果茶派。轉學生小晴只填了甜度和冰塊。","goal":"找出離星星（小晴）最近的那一個同學，猜小晴是哪一派。","learn":"這就是「最近鄰居」：跟你最像的人喜歡什麼，就猜你也喜歡什麼。它不用先學規則，每次都直接去找最像的例子。"},{"name":"找 3 個鄰居投票","now":"只看最近的一個人，萬一他剛好比較特別呢？小禾決定找最近的 3 個人來投票。","goal":"找出離星星最近的 3 個同學，多數是哪一派，就猜小晴是哪一派。","learn":"K 個最近鄰居（KNN）：找最像的 K 個例子投票。K 太小容易被特例影響，K 太大又會被遠方的人拉走，K 要自己試著挑。"},{"name":"畫一條線來預測","now":"攤位試營運時，小安記錄了「排隊人數」和「要等幾分鐘」。他想畫一條線，用來預測人多的時候要等多久。","goal":"先選出最貼近這些點的那條線，再用它預測：排隊人數到了題目給的數字，大約要等幾分鐘？","learn":"線性迴歸：找一條最貼近資料的直線，用它來預測沒看過的情況。電腦會算每個點離線多遠，挑「總誤差最小」的那條。"},{"name":"感知器要不要開攤","now":"園遊會當天，攤位要不要開「AI 猜拳」？小禾用一個「感知器」來決定：每個條件有一個分數（權重），加起來達到門檻就開。","goal":"算一算每一種情況的總分，判斷開還是不開。","learn":"感知器是最簡單的「神經元」：每個輸入乘上權重、加起來，超過門檻就輸出 1。AI 學習時，就是一直調整這些權重和門檻，讓答案越來越準。"}]});</script></body></html>
