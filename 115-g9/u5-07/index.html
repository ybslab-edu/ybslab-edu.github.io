<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":22,"course":"115-g9","unit":5,"title":"讓資料自己分組","rounds":[{"name":"有沒有標準答案","now":"林老師想把全班分成兩組讀書會，可是她不想自己訂標準，想讓資料自己分組。這種 AI 跟上次的回收分類機不一樣。","goal":"判斷每一件事，是監督式學習（有標準答案的例子），還是非監督式學習（沒有答案，讓 AI 自己分組）。","learn":"監督式學習要有標好答案的例子（像分類機）；非監督式學習沒有答案，讓電腦自己把相像的資料分成一群（分群），常用來發現原本沒想到的分組。"},{"name":"靠近哪一個中心","now":"K 平均分群的第一步：先隨便放兩個「中心」A 和 B，每個人加入離自己比較近的那一個中心。","goal":"每位同學每天讀書的分鐘數，離 A 近就分到 A 組，離 B 近就分到 B 組。","learn":"K 平均分群的「指派」：每一筆資料都去找最近的中心。K 是要分成幾群，這裡 K＝2。"},{"name":"把中心搬到中間","now":"K 平均分群的第二步：每一組分好之後，把中心搬到這一組的「平均」位置。","goal":"算出 A 組和 B 組新的中心（這一組所有人的平均分鐘數）。","learn":"K 平均分群會一直重複兩件事：①每個人找最近的中心，②中心搬到組員的平均位置。重複到中心不再移動，就分好了。"},{"name":"跑到不動為止","now":"林老師給了起始的兩個中心，請你一直重複「指派 → 搬中心」，直到中心不再移動。","goal":"最後兩組的中心分別是幾分鐘？","learn":"K 平均分群一定會停下來，但起點不同，結果可能不一樣；所以實際使用時，常常換幾個起點多跑幾次，挑分得最好的。"}]});</script></body></html>
