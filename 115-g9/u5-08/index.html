<script src="/assets/login.js?v=20261122shell"></script><script>YBS.mountActivity({"week":23,"course":"115-g9","unit":5,"title":"服務台放哪裡","rounds":[{"name":"去最近的服務台","now":"畢業園遊會的場地是一個 10 × 10 的方格圖，點是人潮最多的攤位。學務處先放了兩個服務台（方框 A、B），每個攤位歸最近的服務台管。","goal":"判斷每一個攤位，離 A 近還是離 B 近。","learn":"二維的 K 平均分群，「最近」用平面上的直線距離來比。跟一維一樣：每個點加入最近的中心。"},{"name":"搬到正中間","now":"分好組了。服務台要搬到自己這一組攤位的正中間，大家走過去才近。","goal":"算出 A 組的新位置：所有 A 組攤位的「橫座標平均」和「直座標平均」。","learn":"二維的中心＝橫座標的平均、直座標的平均，叫做「重心」。K 平均分群就是一直「指派、搬到重心」。"},{"name":"哪一種分得好","now":"兩位幹部各自分了組，都說自己的比較好。","goal":"哪一種分法，攤位離自己的服務台比較近（總距離比較小）？","learn":"分群好不好，可以算「每個點到自己中心的距離平方和」：越小，表示每一群越集中。K 平均分群就是在讓這個數字變小。"},{"name":"要放幾個服務台","now":"服務台放越多，大家走越近，但也越花人力。小安用電腦試了 1～6 個服務台，算出「總距離」。","goal":"用「手肘法」選出最划算的服務台數量：再多放一個，總距離也不會少很多的那個點。","learn":"K 要選多少？常用「手肘法」：畫出 K 和總距離的關係，找曲線突然變平的轉折點。再多分幾群，改善也很有限，就不划算了。"}]});</script></body></html>
