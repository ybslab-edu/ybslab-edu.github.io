<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":24,"course":"115-g9","unit":5,"title":"教 AI 認手勢","rounds":[{"name":"這批照片夠好嗎","now":"猜拳 AI 要先學會認「石頭、剪刀、布」。全班分組拍照片當訓練資料，林老師一組一組檢查。","goal":"每一組的照片，夠好嗎？如果不夠好，問題出在哪？","learn":"影像 AI 學到的，就是你給它看的照片。照片太少學不會；情況太單一，換個環境就認不出；標錯了，它就學錯。收集資料是做 AI 最花時間、也最重要的一步。"},{"name":"訓練和測試要分開","now":"模型訓練好了。小禾說：「用剛剛的照片測一次，100% 都對耶！」林老師搖搖頭。","goal":"判斷每一種做法對不對。","learn":"測試資料一定要是模型「沒看過」的，才知道它遇到新的手會不會認。也不能為了分數好看，偷偷把測試照片拿去訓練。"},{"name":"讀懂混淆矩陣","now":"用沒看過的照片測試後，電腦給了一張「混淆矩陣」：每一列是真正的手勢，每一欄是 AI 猜的手勢。","goal":"算出準確率，再找出 AI 最常把哪一種認成哪一種。","learn":"混淆矩陣不只告訴你準不準，還告訴你「錯在哪裡」：知道 AI 常把布認成剪刀，就知道該多收集哪一種照片。"},{"name":"怎麼改進","now":"園遊會前試玩，大家發現 AI 在某些情況常常認錯。","goal":"每一個問題，最該怎麼改進？","learn":"改進模型的關鍵在資料：哪裡錯就補哪種資料，標籤錯就先修正，再重新訓練、重新測試。這個「收集 → 訓練 → 測試 → 改進」的循環會一直重複。"}]});</script></body></html>
