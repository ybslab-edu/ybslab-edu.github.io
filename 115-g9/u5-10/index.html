<script src="/assets/login.js?v=20261124summary"></script><script>YBS.mountActivity({"week":25,"course":"115-g9","unit":5,"title":"猜拳贏 AI","rounds":[{"name":"誰贏了","now":"攤位的程式要先知道猜拳的規則。程式不會「懂」，每一種情況都要寫清楚。","goal":"每一種情況，是玩家贏、平手，還是電腦贏？","learn":"寫程式時，所有情況都要列出來：3 × 3＝9 種組合，每一種都要有答案。AI 只負責「看懂手勢」，判斷輸贏還是靠我們寫的規則。"},{"name":"程式的順序","now":"小安把猜拳 AI 的程式畫成流程，可是卡片被打亂了。","goal":"把程式的每一步排好順序。","learn":"一個 AI 應用，是「AI 模型」加上「一般程式」：模型負責認手勢，其他步驟（出拳、比輸贏、記分）都是照順序寫好的程式。這就是第 1 單元說的：輸入 → 處理 → 輸出。"},{"name":"有把握才算數","now":"模型每次都會給出三個手勢的「信心值」。有時候手拍糊了，它也只能猜。小禾設定：最高的信心值要到 60% 以上才算數，不然就請玩家再出一次。","goal":"每一次的判斷結果，程式該怎麼處理？","learn":"AI 的輸出常常是機率，不是絕對的答案。好的程式會設定門檻：沒把握的時候，請人再確認一次，而不是硬猜。門檻太高會一直要人重來，太低又容易認錯，要試著調整。"},{"name":"讓 AI 會贏","now":"攤位試玩時，林老師發現：人其實很難「隨機」出拳，常常有自己的習慣。小安想讓電腦從玩家剛剛的出拳學習。","goal":"照這個策略，電腦下一次該出什麼？「猜玩家下一次會出他最常出的那個，電腦就出能贏它的。」","learn":"這就是「從資料預測」：AI 記下你的習慣，猜你下一步。真正的系統會看更多規律（例如輸了以後常換什麼）。也提醒我們：你的使用紀錄，會被拿來預測你的行為。"}]});</script></body></html>
