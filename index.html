<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YBS Lab</title>
<meta name="description" content="國中資訊科技學習地圖：依課綱學習內容排列的課堂活動。">
<meta property="og:title" content="YBS Lab｜資訊科技學習地圖">
<meta property="og:description" content="依課綱學習內容排列的課堂活動，一張圖看懂國中資訊科技。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/*
  Concept: 捷運路線圖。課綱六大類＝六條路線，學習內容＝車站。
  有活動的車站是實心大站，還沒有的是一般小站；點車站在該路線下方展開站牌。
  最上方是學期進度：依今天日期捲到本週，回訪的人不用找。
*/
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6774; --rule:#D9DFE5; --faint:#E9EDF1;
  --A:#D9480F; --P:#1971C2; --S:#2B8A3E; --D:#6741D9; --T:#0B7285; --H:#C2255C;
  --why:#7A4EA8; --because:#2C67AE; --so:#BD6216;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11161B; --surface:#182028; --ink:#E8EDF2; --muted:#9AA7B4; --rule:#2B3540; --faint:#1E2730;
  --A:#FF8A4C; --P:#5AA9F0; --S:#5CC977; --D:#A08BFF; --T:#3BC0D6; --H:#F06595; --why:#C7B0F0; --because:#9CC8F2; --so:#F4B26A; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--P);outline-offset:2px;border-radius:6px}
.in{max-width:1180px;margin:0 auto;padding-inline:20px}

/* 頁首 */
.bar{background:var(--surface);border-bottom:1px solid var(--rule)}
.bar .in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.logo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;text-decoration:none}
.logo b{font-weight:900;font-size:22px;letter-spacing:.01em}
.logo b .y{color:var(--why)} .logo b .bb{color:var(--because)} .logo b .s{color:var(--so)}
.motto{font-size:17px;font-weight:700;color:color-mix(in srgb,var(--muted) 55%,transparent);display:inline-flex;gap:.35em;white-space:nowrap}
.motto .k{display:inline-block;transition:color .6s,transform .6s cubic-bezier(.2,.8,.2,1.4)}
.motto.lit .k{transform:translateY(-.05em) scale(1.25)}
.motto.lit .k.y{color:var(--why);transition-delay:.15s}
.motto.lit .k.b{color:var(--because);transition-delay:.45s}
.motto.lit .k.s{color:var(--so);transition-delay:.75s}
@media (max-width:420px){.motto{font-size:15px}}
.bar nav{display:flex;gap:20px;font-size:15px}
.bar nav a{text-decoration:none;color:var(--muted)}
.bar nav a:hover{color:var(--ink)}

/* 區塊標題 */
.head{padding-block:48px 18px}
.head h2{margin:0;font-weight:900;font-size:clamp(26px,3.6vw,34px);line-height:1.2}
.lede{margin:8px 0 0;color:var(--muted);max-width:40em}

/* 圖例 */
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--surface)}
.lg-dot.on{width:20px;height:20px;background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}

/* 地圖 */
.map{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:8px 0 0;overflow:hidden}
.map::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--contour);background-size:720px 720px;opacity:.4}
.map>*{position:relative}
.sheet{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);background:var(--faint);padding:12px 24px;font-size:13.5px;color:var(--muted)}
.sheet .legend{padding:0}
.sheet dl{margin:0;display:flex;gap:4px 20px;flex-wrap:wrap}
.sheet dt{display:inline;font-weight:700;color:var(--ink)}
.sheet dd{display:inline;margin:0 0 0 6px}
.line{--c:var(--ink);border-top:1px solid var(--faint)}
.line:first-child{border-top:0}
.row{display:grid;grid-template-columns:13em minmax(0,1fr);align-items:center;gap:8px;padding:18px 24px}
.name{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:6px solid var(--c)}
.name b{font-size:17px;line-height:1.3}
.name span{font-size:13.5px;color:var(--muted)}
.track{position:relative;display:flex}
.track::before{content:"";position:absolute;top:13px;height:6px;border-radius:3px;background:var(--c);
  left:calc(100% / (2 * var(--n)));right:calc(100% / (2 * var(--n)))}
.st{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  font:inherit;color:inherit;background:none;border:0;padding:0 4px 4px;cursor:pointer}
.dot{width:20px;height:20px;margin-top:6px;border-radius:50%;background:var(--surface);border:4px solid var(--c);transition:transform .15s}
.st.has .dot{width:32px;height:32px;margin-top:0;background:var(--c);box-shadow:inset 0 0 0 4px var(--surface);border-width:4px}
.st .txt{display:flex;flex-direction:column;align-items:inherit}
.st .lb{font-size:14px;line-height:1.35;font-weight:500}
.st .cd{font-size:12px;color:var(--muted)}
.st:not(.has) .lb{color:var(--muted);font-weight:400}
.st.has .lb{font-weight:700}
.st:hover .dot{transform:scale(1.15)}
.st[aria-expanded="true"] .dot{transform:scale(1.2)}
.st[aria-expanded="true"] .lb{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--c);text-underline-offset:4px}

/* 放射地圖 */
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{font:inherit;font-size:14.5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.radial-wrap{overflow-x:auto}
#radial{display:block;width:100%;max-width:1000px;min-width:640px;height:auto;margin:0 auto}
#radial text{font-family:var(--f)}
.ring{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 6}
.ring-lb{font-size:13px;fill:var(--muted);font-weight:700}
.ring-bg{fill:var(--surface)}
.trunk{stroke:var(--c);stroke-width:7;stroke-linecap:round}
.twig{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;opacity:.75}
.hub rect{fill:var(--c)}
.hub text{fill:var(--surface);font-size:15px;font-weight:700}
.core circle{fill:var(--ink)}
.core text{fill:var(--bg)}
.nd{cursor:pointer;outline:none}
.nd circle{fill:var(--surface);stroke:var(--c);stroke-width:3.5;transition:r .15s}
.nd .gr{fill:var(--c);font-size:13px;font-weight:900}
.nd.has circle{fill:var(--c)}
.nd.has .gr{fill:var(--surface)}
.nd .lb{fill:var(--muted);font-size:14.5px}
.nd.has .lb{fill:var(--ink);font-weight:700}
.nd .cd{fill:var(--muted);font-size:11.5px}
.nd:hover .lb,.nd:focus-visible .lb{fill:var(--ink);text-decoration:underline}
.nd:focus-visible circle,.nd[aria-pressed="true"] circle{stroke:var(--ink);stroke-width:5}
.panel.map-panel{margin:0 24px 20px}
.lg-gr{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);font-size:11px;font-weight:900;font-style:normal;color:var(--muted)}

/* 站牌（展開面板） */
.panel{margin:0 24px 20px;border:2px solid var(--c);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph h3{margin:0;font-size:20px;line-height:1.4}
.ph .code{display:inline-block;color:var(--surface);background:var(--c);border-radius:6px;padding:0 8px;font-size:14px;font-weight:700;margin-right:8px;vertical-align:2px}
.close{font:inherit;font-size:14px;background:none;border:1px solid var(--rule);color:var(--muted);border-radius:8px;padding:2px 10px;cursor:pointer}
.acts{display:flex;flex-direction:column;gap:12px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;padding-top:12px;border-top:1px solid var(--faint)}
.act h4{margin:0;font-size:19px}
.act .meta{margin:2px 0 0;color:var(--muted);font-size:14px}
.act .play{align-self:start;text-decoration:none;font-weight:700;background:var(--c);color:var(--surface);border-radius:10px;padding:8px 18px;white-space:nowrap}
.wbs{grid-column:1 / -1;margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px}
.wbs dt{font-weight:700;color:var(--muted)}
.wbs dd{margin:0}
.empty{margin:0;color:var(--muted)}

/* 手機：路線改成直的 */
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr);padding:16px 16px 8px}
  .track{flex-direction:column;padding-left:2px}
  .track::before{top:calc(100% / (2 * var(--n)));bottom:calc(100% / (2 * var(--n)));left:13px;right:auto;width:6px;height:auto}
  .st{flex-direction:row;align-items:center;text-align:left;gap:12px;padding:8px 0}
  .dot{margin-top:0;margin-left:6px;flex:none}
  .st.has .dot{margin-left:0}
  .st .txt{display:flex;flex-direction:column}
  .panel{margin:0 16px 16px}
  .act{grid-template-columns:minmax(0,1fr)}
  .act .play{justify-self:start}
}

/* 學期進度 */
.prog{padding-block:32px 8px}
.prog-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.prog h1{margin:0;font-weight:900;font-size:clamp(30px,4.4vw,42px);line-height:1.15}
.prog-top p{margin:6px 0 0;color:var(--muted)}
.terms{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.terms button{font:inherit;font-size:14.5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.terms button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.terms .jump{border-style:dashed}

.thisweek{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.thisweek:empty{display:none}
.tw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 16px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;text-decoration:none}
.tw .who{font-size:14px;opacity:.75;white-space:nowrap}
.tw strong{font-size:19px;min-width:0}
.tw .go{font-weight:700;background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 16px;font-size:15px;white-space:nowrap}
.tw.none{display:block;background:var(--surface);color:var(--muted);border:1px dashed var(--rule);font-size:15px}
.tw.none b{color:var(--ink)}
@media (max-width:560px){.tw{grid-template-columns:minmax(0,1fr) auto}.tw .who{grid-column:1 / -1}}

.sched{margin-top:16px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.sched-scroll{position:relative;overflow-x:auto;scroll-behavior:smooth;overscroll-behavior-x:contain}
.grid{display:grid;grid-template-columns:7.5em repeat(var(--w),8.6em);min-width:max-content}
.grid>*{border-right:1px solid var(--faint);border-bottom:1px solid var(--faint);min-width:0}
.gh{padding:8px 10px;font-size:13px;color:var(--muted);line-height:1.35;background:var(--surface)}
.gh b{display:block;font-size:14px;color:var(--ink)}
.gh.past b{color:var(--muted);font-weight:500}
.gh.cur{background:var(--ink);color:var(--bg)}
.gh.cur b{color:var(--bg)}
.rowname{position:sticky;left:0;z-index:2;background:var(--surface);padding:12px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;justify-content:center;box-shadow:2px 0 0 var(--faint)}
.rowname small{font-weight:400;color:var(--muted);font-size:12.5px}
.corner{position:sticky;left:0;z-index:3;background:var(--surface);padding:8px 10px;font-size:13px;color:var(--muted);box-shadow:2px 0 0 var(--faint)}
.cell{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:76px}
.cell.cur{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--faint) 60%,transparent) 6px 7px)}
.chip{display:flex;flex-direction:column;gap:1px;text-decoration:none;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:6px;padding:6px 8px;font-size:14px;line-height:1.3}
.chip b{font-weight:700}
.chip span{font-size:12px;color:var(--muted)}
.chip:hover b{text-decoration:underline}
.sched-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--muted);background:var(--faint)}
.sched-foot .keys{display:flex;gap:14px;flex-wrap:wrap}
.sched-foot i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 共用 */
section{padding-block:56px 0}
h2{margin:0 0 6px;font-size:26px;font-weight:900}
.sub{margin:0 0 20px;color:var(--muted)}


footer{margin-top:72px;border-top:1px solid var(--rule);background:var(--surface);color:var(--muted);font-size:14px}
footer .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="in">
    <a class="logo" href="./" aria-label="YBS Lab：Why, because, so."><b aria-hidden="true"><span class="y">Y</span><span class="bb">B</span><span class="s">S</span> Lab</b><span class="motto" id="motto" aria-hidden="true"><span>wh<span class="k y">Y</span></span><span><span class="k b">B</span>ecause</span><span><span class="k s">S</span>o.</span></span></a>
    <nav aria-label="主選單"><a href="#progress">學期進度</a><a href="#map-head">學習地圖</a></nav>
  </div>
</header>

<main>
  <section class="in prog" id="progress" aria-labelledby="prog-h">
    <div class="prog-top">
      <div><h1 id="prog-h">學期進度</h1><p id="prog-sub"></p></div>
      <div class="terms" id="terms" role="group" aria-label="切換學期"></div>
    </div>
    <div class="thisweek" id="thisweek"></div>
    <div class="sched">
      <div class="sched-scroll" id="sched-scroll"><div class="grid" id="grid"></div></div>
      <div class="sched-foot"><span class="keys" id="keys"></span><span>左右滑動可看整學期</span></div>
    </div>
  </section>

  <div class="in head" id="map-head">
    <div>
      <h2>學習地圖</h2>
      <p class="lede">從中心的「資訊科技」出發，分成課綱的六大類，再分出 24 項學習內容。越往外圈年級越高，節點上的字是課綱標示的學習年級。實心節點已經有課堂活動，點一下就能看內容、直接開始。</p>
    </div>
    <div class="views" role="group" aria-label="地圖顯示方式"><button type="button" data-v="radial">放射地圖</button><button type="button" data-v="lines">路線清單</button></div>
  </div>

  <div class="in" id="map">
    <div class="map" id="mapbox">
      <div id="radial-box"><div class="radial-wrap"><svg id="radial" viewBox="0 0 1100 1060" role="group" aria-label="資訊科技學習地圖"></svg></div><div class="panel map-panel" id="pn-radial" hidden></div></div>
      <div id="lines"></div>
      <div class="sheet">
        <div class="legend"><b style="color:var(--ink)">圖例</b>
          <span><i class="lg-dot on"></i>有課堂活動</span>
          <span><i class="lg-dot"></i>準備中</span>
          <span><i class="lg-gr">七</i>課綱學習年級</span>
          <span id="tally"></span>
        </div>
        <dl><div><dt>資料來源</dt><dd>十二年國教課綱科技領域（107 年 9 月），資訊科技國民中學學習內容</dd></div><div><dt>更新</dt><dd id="updated"></dd></div></dl>
      </div>
    </div>
  </div>



</main>

<footer><div class="in"><span>YBS Lab for Education</span><span>課綱條目依十二年國教科技領域課程綱要（資訊科技）</span></div></footer>

<script src="assets/curriculum.js"></script>
<script src="assets/activities.js"></script>
<script>
const $=id=>document.getElementById(id);
/* 頁首動畫：whY Because So 依序亮起 */
requestAnimationFrame(()=>setTimeout(()=>$('motto').classList.add('lit'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:300));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const courseOf=id=>COURSES.find(c=>c.id===id)||{name:id,path:'#'};
const byCode={};
ACTIVITIES.forEach(a=>a.codes.forEach(c=>(byCode[c]=byCode[c]||[]).push(a)));
const slug=code=>code.replace('資','');   // 資S-IV-2 → S-IV-2，用在網址 #S-IV-2

/* 地圖 */
const GR={7:'七',8:'八',9:'九'};
let total=0,done=0;
$('lines').innerHTML=CURRICULUM.strands.map(s=>{
  const n=s.items.length; total+=n;
  const has=s.items.filter(it=>byCode[it.code]).length; done+=has;
  const stations=s.items.map(it=>{
    const on=!!byCode[it.code];
    return '<button type="button" class="st'+(on?' has':'')+'" id="st-'+slug(it.code)+'" data-code="'+it.code+'" aria-expanded="false" aria-controls="pn-'+s.id+'">'+
      '<i class="dot" aria-hidden="true"></i><span class="txt"><span class="lb">'+esc(it.short)+'</span><span class="cd">'+esc(it.code)+(on?'，'+byCode[it.code].length+' 個活動':'')+'</span></span></button>';
  }).join('');
  return '<div class="line" style="--c:var(--'+s.id+')">'+
    '<div class="row"><div class="name"><b>'+esc(s.name)+'</b><span>'+has+' / '+n+' 站有活動</span></div>'+
    '<div class="track" style="--n:'+n+'">'+stations+'</div></div>'+
    '<div class="panel" id="pn-'+s.id+'" hidden></div></div>';
}).join('');
$('tally').textContent='目前 '+done+' / '+total+' 站有活動';

/* 放射地圖：中心 → 六大類 → 學習內容；半徑代表年級 */
(function(){
  const NS='http://www.w3.org/2000/svg', svg=$('radial');
  const CX=550, CY=530, R_CORE=66, R_HUB=140, RING={7:222,8:306,9:390};
  const strands=CURRICULUM.strands, total=strands.reduce((a,s)=>a+s.items.length,0);
  const step=360/(total+1);                       // 留一格放年級刻度
  const pt=(r,deg)=>{const t=(deg-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)]};
  const f=n=>n.toFixed(1);
  let out='';
  // 年級圈
  for(const g of [7,8,9]) out+='<circle class="ring" cx="'+CX+'" cy="'+CY+'" r="'+RING[g]+'"/>';
  // 年級刻度（在正上方的空格）
  for(const g of [7,8,9]){const [x,y]=pt(RING[g],0);out+='<rect class="ring-bg" x="'+f(x-24)+'" y="'+f(y-11)+'" width="48" height="22" rx="4"/><text class="ring-lb" x="'+f(x)+'" y="'+f(y+5)+'" text-anchor="middle">'+GR[g]+'年級</text>'}
  let slot=1, trunks='', twigs='', hubs='', nodes='';
  for(const s of strands){
    const items=[...s.items].sort((a,b)=>a.grade-b.grade||a.code.localeCompare(b.code));
    const a0=slot*step, a1=(slot+items.length)*step, mid=(a0+a1)/2-step/2;
    const c='var(--'+s.id+')';
    const [hx,hy]=pt(R_HUB,mid), [tx,ty]=pt(R_CORE,mid);
    trunks+='<line class="trunk" style="--c:'+c+'" x1="'+f(tx)+'" y1="'+f(ty)+'" x2="'+f(hx)+'" y2="'+f(hy)+'"/>';
    const w=s.tag.length*16+22;
    hubs+='<g class="hub" style="--c:'+c+'"><rect x="'+f(hx-w/2)+'" y="'+f(hy-15)+'" width="'+w+'" height="30" rx="15"/><text x="'+f(hx)+'" y="'+f(hy+5)+'" text-anchor="middle">'+esc(s.tag)+'</text><title>'+esc(s.name)+'</title></g>';
    items.forEach((it,i)=>{
      const ang=(slot+i)*step, r=RING[it.grade], [x,y]=pt(r,ang), on=!!byCode[it.code];
      const [c1x,c1y]=pt(R_HUB+50,mid), [c2x,c2y]=pt(r-70,ang);
      twigs+='<path class="twig" style="--c:'+c+'" d="M'+f(hx)+' '+f(hy)+'C'+f(c1x)+' '+f(c1y)+' '+f(c2x)+' '+f(c2y)+' '+f(x)+' '+f(y)+'"/>';
      const rad=(ang-90)*Math.PI/180, cs=Math.cos(rad), sn=Math.sin(rad), rr=on?17:14;
      let lab;
      if(Math.abs(cs)>=0.5){                                   // 左右兩側：橫寫
        const lx=x+cs*(rr+10), anchor=cs>0?'start':'end';
        lab='<text class="lb" x="'+f(lx)+'" y="'+f(y-1)+'" text-anchor="'+anchor+'">'+esc(it.short)+'</text><text class="cd" x="'+f(lx)+'" y="'+f(y+15)+'" text-anchor="'+anchor+'">'+esc(it.code)+'</text>';
      } else {                                                 // 上下兩側：直寫
        const ch=[...it.short], LH=16.5;                      // 一字一行，確保各瀏覽器一致
        const y0=sn<0? y-rr-8-(ch.length-1)*LH : y+rr+20;
        lab='<text class="lb" text-anchor="middle">'+ch.map((c,k)=>'<tspan x="'+f(x)+'" y="'+f(y0+k*LH)+'">'+esc(c)+'</tspan>').join('')+'</text>';
      }
      nodes+='<g class="nd'+(on?' has':'')+'" style="--c:'+c+'" id="nd-'+slug(it.code)+'" data-code="'+it.code+'" role="button" tabindex="0" aria-pressed="false" aria-label="'+esc(it.code+' '+it.short+'，'+GR[it.grade]+'年級'+(on?'，有 '+byCode[it.code].length+' 個活動':'，準備中'))+'">'+
        '<title>'+esc(it.code+' '+it.text+'（'+GR[it.grade]+'年級）')+'</title>'+
        '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+rr+'"/><text class="gr" x="'+f(x)+'" y="'+f(y+4.5)+'" text-anchor="middle">'+GR[it.grade]+'</text>'+lab+'</g>';
    });
    slot+=items.length;
  }
  const core='<g class="core"><circle cx="'+CX+'" cy="'+CY+'" r="'+R_CORE+'"/><text x="'+CX+'" y="'+(CY+2)+'" text-anchor="middle" font-size="21" font-weight="900">'+esc(CURRICULUM.core)+'</text><text x="'+CX+'" y="'+(CY+24)+'" text-anchor="middle" font-size="12" opacity=".75">國中</text></g>';
  svg.innerHTML=out+trunks+twigs+core+hubs+nodes;
  svg.querySelectorAll('.nd').forEach(g=>{
    g.addEventListener('click',()=>open(g.dataset.code,true));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(g.dataset.code,true)}});
  });
})();

/* 顯示方式：放射地圖／路線清單 */
let view=(()=>{try{return localStorage.getItem('ybs:view')}catch(e){return null}})()||(innerWidth>=760?'radial':'lines');
function setView(v){
  view=v; try{localStorage.setItem('ybs:view',v)}catch(e){}
  $('radial-box').hidden=v!=='radial'; $('lines').hidden=v!=='lines';
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  const cur=document.querySelector('[aria-expanded="true"],.nd[aria-pressed="true"]');
  if(cur){const c=cur.dataset.code;close();open(c,false)}
}
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function itemOf(code){for(const s of CURRICULUM.strands)for(const it of s.items)if(it.code===code)return {s,it};return null}
function close(){
  document.querySelectorAll('.st[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
  document.querySelectorAll('.nd[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
  document.querySelectorAll('.panel').forEach(p=>{p.hidden=true;p.innerHTML=''});
}
function open(code,scroll){
  const f=itemOf(code); if(!f)return;
  const radial=view==='radial';
  const btn=radial?$('nd-'+slug(code)):$('st-'+slug(code)), pn=radial?$('pn-radial'):$('pn-'+f.s.id);
  const attr=radial?'aria-pressed':'aria-expanded';
  const wasOpen=btn.getAttribute(attr)==='true';
  close(); if(wasOpen){history.replaceState(null,'',location.pathname);return}
  btn.setAttribute(attr,'true');
  pn.style.setProperty('--c','var(--'+f.s.id+')');
  const acts=byCode[code]||[];
  pn.innerHTML='<div class="ph"><h3><span class="code">'+esc(code)+'</span>'+esc(f.it.text)+'</h3><button type="button" class="close">收起</button></div>'+
    (acts.length?'<div class="acts">'+acts.map(a=>{
      const c=courseOf(a.course);
      return '<article class="act"><div><h4>'+esc(a.title)+'</h4><p class="meta">'+esc(c.name)+' 第 '+a.week+' 週｜'+esc(a.topic)+'</p></div>'+
        '<a class="play" href="'+esc(a.href)+'">開始活動</a>'+
        '<dl class="wbs"><dt>Why</dt><dd>'+esc(a.why)+'</dd><dt>Because</dt><dd>'+esc(a.because)+'</dd><dt>So</dt><dd>'+esc(a.so)+'</dd></dl></article>';
    }).join('')+'</div>':'<p class="empty">這一站的課堂活動還在準備中。</p>');
  pn.hidden=false;
  pn.querySelector('.close').onclick=()=>{close();history.replaceState(null,'',location.pathname);btn.focus()};
  history.replaceState(null,'','#'+slug(code));
  if(scroll)pn.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
document.querySelectorAll('.st').forEach(b=>b.onclick=()=>open(b.dataset.code,true));
setView(view);
const h=decodeURIComponent(location.hash.slice(1));
if(/^[APSDTH]-IV-\d$/.test(h))open('資'+h,true);

/* 等高線底圖：用固定亂數畫幾組不規則同心線，跟深淺色主題都搭 */
(function(){
  try{
    const N=720,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
    let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
    const col=getComputedStyle(document.documentElement).getPropertyValue('--rule').trim()||'#D9DFE5';
    g.strokeStyle=col;g.lineWidth=1.2;
    for(const [cx,cy,rings] of [[150,170,7],[560,520,9],[600,90,5]]){
      const amp=[...Array(6)].map(()=>rnd()*0.35), ph=[...Array(6)].map(()=>rnd()*6.28);
      for(let r=1;r<=rings;r++){
        g.beginPath();
        for(let t=0;t<=6.30;t+=0.05){
          let k=1;for(let h=0;h<3;h++)k+=amp[h]*Math.sin((h+2)*t+ph[h])*0.5;
          const R=r*22*k, x=cx+R*Math.cos(t), y=cy+R*0.8*Math.sin(t);
          t?g.lineTo(x,y):g.moveTo(x,y);
        }
        g.closePath();g.stroke();
      }
    }
    $('mapbox').style.setProperty('--contour','url('+c.toDataURL()+')');
  }catch(e){}
})();

/* 更新日期＝最新活動日期 */
(function(){
  const d=ACTIVITIES.map(a=>a.date).sort().pop();
  if(d){const [y,m,dd]=d.split('-');$('updated').textContent=y+' 年 '+(+m)+' 月 '+(+dd)+' 日'}
})();

/* 學期進度：課程一列、每週一欄，開頁就捲到本週 */
(function(){
  const DAY=864e5;
  const ymd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const md=d=>(d.getMonth()+1)+'/'+d.getDate();
  const strandOf=code=>{for(const s of CURRICULUM.strands)for(const it of s.items)if(it.code===code)return s.id;return 'P'};
  const today=new Date();today.setHours(0,0,0,0);
  const weekOf=(t,d)=>Math.floor((d-ymd(t.start))/DAY/7);           // 0 起算
  const termEnd=t=>new Date(ymd(t.start).getTime()+t.weeks*7*DAY);
  const curTerm=TERMS.find(t=>today>=ymd(t.start)&&today<termEnd(t))||TERMS.find(t=>today<ymd(t.start))||TERMS[TERMS.length-1];
  let term=curTerm;

  // 圖例：只列出有用到的路線
  const used=[...new Set(ACTIVITIES.map(a=>strandOf(a.codes[0])))];
  $('keys').innerHTML=used.map(id=>{const s=CURRICULUM.strands.find(x=>x.id===id);return '<span><i style="background:var(--'+id+')"></i>'+esc(s.name)+'</span>'}).join('');

  function render(scroll){
    $('terms').innerHTML=TERMS.map(t=>'<button type="button" data-t="'+t.id+'" aria-pressed="'+(t===term)+'">'+esc(t.name)+'</button>').join('')+
      (term!==curTerm||scroll===false?'<button type="button" class="jump" id="jump">回到本週</button>':'');
    $('terms').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{term=TERMS.find(t=>t.id===b.dataset.t);render(true)});
    if($('jump'))$('jump').onclick=()=>{term=curTerm;render(true)};

    const inTerm=today>=ymd(term.start)&&today<termEnd(term);
    const cw=inTerm?weekOf(term,today):(today<ymd(term.start)?-1:term.weeks);
    const courses=COURSES.filter(c=>c.year===term.year);
    const acts=ACTIVITIES.filter(a=>courses.some(c=>c.id===a.course)).map(a=>({...a,w:weekOf(term,ymd(a.date))})).filter(a=>a.w>=0&&a.w<term.weeks);

    // 副標與本週
    const ws=new Date(ymd(term.start).getTime()+Math.max(0,cw)*7*DAY), we=new Date(ws.getTime()+4*DAY);
    $('prog-sub').textContent=inTerm?'今天是 '+term.name+'第 '+(cw+1)+' 週（'+md(ws)+'–'+md(we)+'）':(cw<0?term.name+'還沒開始，'+md(ymd(term.start))+' 開學':term.name+'已結束');
    if(term===curTerm&&inTerm){
      const now=acts.filter(a=>a.w===cw);
      const nowHtml=courses.map(c=>{
        const list=now.filter(a=>a.course===c.id);
        if(!list.length){
          const last=acts.filter(a=>a.course===c.id&&a.w<cw).sort((a,b)=>b.date.localeCompare(a.date))[0];
          return '<div class="tw none"><b>'+esc(c.short)+'</b>本週沒有新活動'+(last?'，上次是第 '+(last.w+1)+' 週的<a href="'+esc(last.href)+'">'+esc(last.title)+'</a>':'')+'。</div>';
        }
        return list.map(a=>'<a class="tw" href="'+esc(a.href)+'"><span class="who">'+esc(c.short)+'｜本週</span><strong>'+esc(a.title)+'</strong><span class="go">開始</span></a>').join('');
      }).join('');
      $('thisweek').innerHTML=nowHtml;
    } else $('thisweek').innerHTML='';

    // 表格
    let h='<div class="corner">週次</div>';
    for(let i=0;i<term.weeks;i++){
      const d=new Date(ymd(term.start).getTime()+i*7*DAY), e=new Date(d.getTime()+4*DAY);
      h+='<div class="gh'+(i===cw?' cur':i<cw?' past':'')+'" id="wk-'+i+'"'+(i===cw?' aria-current="date"':'')+'><b>'+(i===cw?'本週・':'')+'第 '+(i+1)+' 週</b>'+md(d)+'–'+md(e)+'</div>';
    }
    for(const c of courses){
      h+='<div class="rowname">'+esc(c.short)+'<small>'+esc(c.name)+'</small></div>';
      for(let i=0;i<term.weeks;i++){
        const list=acts.filter(a=>a.course===c.id&&a.w===i);
        h+='<div class="cell'+(i===cw?' cur':i<cw&&!list.length?' past':'')+'">'+list.map(a=>
          '<a class="chip" style="--c:var(--'+strandOf(a.codes[0])+')" href="'+esc(a.href)+'"><b>'+esc(a.title)+'</b><span>'+esc(a.codes.join('、'))+'</span></a>').join('')+'</div>';
      }
    }
    if(!courses.length)h+='<div class="rowname">—</div><div class="cell" style="grid-column:span '+term.weeks+'">這學期還沒有開設課程。</div>';
    $('grid').style.setProperty('--w',term.weeks);
    $('grid').innerHTML=h;

    // 捲到本週（本週放在第二欄的位置，前一週還看得到）
    if(scroll!==false){
      const box=$('sched-scroll'), target=$('wk-'+Math.max(0,Math.min(term.weeks-1,cw-1)));
      const first=box.querySelector('.corner').offsetWidth;
      box.style.scrollBehavior='auto';
      box.scrollLeft=cw<0?0:Math.max(0,target.offsetLeft-first);
      box.style.scrollBehavior='';
    }
  }
  render(true);
})();

</script>
