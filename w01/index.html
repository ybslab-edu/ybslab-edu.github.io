<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>深夜手搖店 CPU｜第 1 週</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 上方客人點單 → 中間「單子盒」點卡片放進「順序格」 → 下方店長／搖飲師／出餐口即時演出；單元顏色與簡報一致 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#211B17; --muted:#5D6670; --line:#D3D9E0;
  --mem:#2C67AE; --mem-soft:#E2ECF8;
  --cu:#7A4EA8; --cu-soft:#EFE6F8;
  --alu:#BD6216; --alu-soft:#FBEAD9;
  --out:#2B7A4C; --out-soft:#DFF1E6;
  --warn:#B3261E; --warn-soft:#FBE4E2;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171B; --surface:#1D2127; --ink:#ECEFF2; --muted:#9AA3AD; --line:#323942;
  --mem:#82B2EC; --mem-soft:#1C2A3A; --cu:#BC9DE3; --cu-soft:#2A2236;
  --alu:#F0A45E; --alu-soft:#3A2A1B; --out:#6FC995; --out-soft:#1A3325;
  --warn:#F2897F; --warn-soft:#3A1F1D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14171B; --surface:#1D2127; --ink:#ECEFF2; --muted:#9AA3AD; --line:#323942;
  --mem:#82B2EC; --mem-soft:#1C2A3A; --cu:#BC9DE3; --cu-soft:#2A2236;
  --alu:#F0A45E; --alu-soft:#3A2A1B; --out:#6FC995; --out-soft:#1A3325;
  --warn:#F2897F; --warn-soft:#3A1F1D; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);margin:0;line-height:1.1}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:8px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--mem);outline-offset:2px}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.rounds button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.rounds button .done{color:var(--out);font-weight:700}

.order{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.order .who{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap}
.order .says{font-size:19px;flex:1;min-width:0}
.order .tip{width:100%;color:var(--muted);font-size:14.5px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ptitle h2{margin:0;font-family:var(--f-display);font-size:19px}
.tag{font-size:12px;letter-spacing:.05em;font-weight:700;padding:2px 8px;border-radius:999px}
.t-mem{color:var(--mem);background:var(--mem-soft)} .t-cu{color:var(--cu);background:var(--cu-soft)}
.t-alu{color:var(--alu);background:var(--alu-soft)} .t-out{color:var(--out);background:var(--out-soft)}

.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;transition:border-color .2s,background .2s}
.cell .addr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell .lab{font-size:14px;color:var(--muted)}
.cell .val{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--mem);min-height:1.3em}
.cell.hit{border-color:var(--mem);background:var(--mem-soft)}
.power{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13.5px;color:var(--muted);margin:0}

.pool,.slots{display:flex;flex-direction:column;gap:8px}
.pool{flex-direction:row;flex-wrap:wrap}
.card{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.35}
.card:hover{border-color:var(--ink)}
.card.used{visibility:hidden}
.slot{display:flex;align-items:center;gap:10px;min-height:48px}
.slot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.slot .card{flex:1}
.slot .empty{flex:1;border:2px dashed var(--line);border-radius:10px;min-height:44px;display:flex;align-items:center;padding-inline:12px;color:var(--muted);font-size:14px}
.slot.now .card{border-color:var(--cu);background:var(--cu-soft)}
.slot.bad .card{border-color:var(--warn)}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:17px;padding:10px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stage{grid-template-columns:minmax(0,1fr)}}
.unit{border-left:6px solid var(--line);min-height:120px}
.unit.cu{border-left-color:var(--cu)} .unit.alu{border-left-color:var(--alu)} .unit.outp{border-left-color:var(--out)}
.unit.on.cu{background:var(--cu-soft)} .unit.on.alu{background:var(--alu-soft)} .unit.on.outp{background:var(--out-soft)}
.unit .say{font-size:16px;min-height:3em}
.hand{font-family:var(--f-mono);font-size:30px;font-weight:700;color:var(--alu);line-height:1}
.outv{font-size:24px;font-weight:700;color:var(--out)}
.outv.no{color:var(--warn)}

.verdict{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--out-soft)} .verdict.no{background:var(--warn-soft)}
.verdict h3{margin:0;font-family:var(--f-display);font-size:22px}
.verdict p{margin:0}
.gate{max-width:440px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.gate h1{text-align:center}
.gate p{margin:0;color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700}
.field input{font-family:var(--f-mono);font-size:26px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:none;border-color:var(--mem)}
.field .hint{font-size:13.5px;color:var(--muted)}
.gerr{color:var(--warn);font-size:14.5px;min-height:1.4em;text-align:center}
.who-bar{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.who-bar b{font-family:var(--f-mono);color:var(--ink);font-size:17px}
.linkbtn{font:inherit;font-size:14px;border:0;background:none;color:var(--mem);cursor:pointer;text-decoration:underline;padding:0}
.report{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.report h2{margin:0;font-family:var(--f-display);font-size:19px;width:100%}
.code{font-family:var(--f-mono);font-size:clamp(20px,4.5vw,28px);font-weight:700;letter-spacing:.06em;user-select:all;overflow-wrap:anywhere}
.prog{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.prog span{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.prog span.ok{background:var(--out-soft);border-color:var(--out);color:var(--ink);font-weight:700}
.copied{font-size:14px;color:var(--out)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<section class="gate" id="gate">
  <h1>深夜手搖店 CPU</h1>
  <p>開始前先填班級和座號，只能填數字。</p>
  <div class="field"><label for="in-cls">班級</label><input id="in-cls" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="例如 901"><span class="hint">三位數字，例如 901</span></div>
  <div class="field"><label for="in-seat">座號</label><input id="in-seat" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="例如 12"><span class="hint">1～60</span></div>
  <div class="gerr" id="gerr" role="alert"></div>
  <div class="btns" id="g-step1"><button class="btn primary" id="g-next" style="width:100%">下一步</button></div>
  <div id="g-step2" hidden style="display:flex;flex-direction:column;gap:10px">
    <p style="color:var(--ink);font-size:20px" id="g-confirm"></p>
    <div class="btns" style="justify-content:center"><button class="btn" id="g-back">我填錯了</button><button class="btn primary" id="g-go">對，開始</button></div>
  </div>
</section>

<div class="wrap" id="main" hidden>
  <header>
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1>深夜手搖店 CPU</h1>
      <div class="who-bar"><a href="../" class="linkbtn">← 課程首頁</a><span><b id="who"></b></span><button class="linkbtn" id="b-swap" type="button">不是我？換人</button></div>
    </div>
    <div class="tabs" role="tablist" aria-label="等級">
      <button id="tab-1" role="tab" aria-selected="true">基礎關</button>
      <button id="tab-2" role="tab" aria-selected="false">進階關</button>
    </div>
  </header>
  <div class="rounds" id="rounds"></div>

  <section class="order" aria-live="polite">
    <span class="who">客人：</span><span class="says" id="says"></span>
    <span class="tip">點下面的卡片，依序放進「店長的順序」，排好按「開始做」。點順序格裡的卡片可以拿回來。</span>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="ptitle"><h2>點單牆</h2><span class="tag t-mem">主記憶體</span></div>
      <div class="wall" id="wall"></div>
      <div class="power">
        <button class="btn" id="b-off">拉電閘（斷電）</button>
        <button class="btn" id="b-on" hidden>開店（照招牌掛回去）</button>
      </div>
      <p class="small" id="powernote">每一格都有號碼（位址），店長靠號碼找資料。</p>
    </section>

    <section class="panel">
      <div class="ptitle"><h2>單子盒</h2><span class="small">點一張放進下面</span></div>
      <div class="pool" id="pool"></div>
      <div class="ptitle"><h2>店長的順序</h2></div>
      <div class="slots" id="slots"></div>
      <div class="btns">
        <button class="btn primary" id="b-run">開始做</button>
        <button class="btn" id="b-clear">全部拿回來</button>
      </div>
    </section>
  </div>

  <div class="stage">
    <section class="panel unit cu" id="u-cu">
      <div class="ptitle"><h2>店長</h2><span class="tag t-cu">控制單元</span></div>
      <div class="say" id="cu-say">等你排好單子。</div>
    </section>
    <section class="panel unit alu" id="u-alu">
      <div class="ptitle"><h2>搖飲師</h2><span class="tag t-alu">算術邏輯單元</span></div>
      <div class="hand" id="hand">空手</div>
      <div class="say" id="alu-say"></div>
    </section>
    <section class="panel unit outp" id="u-out">
      <div class="ptitle"><h2>出餐口</h2><span class="tag t-out">輸出</span></div>
      <div class="outv" id="outv">—</div>
    </section>
  </div>

  <section class="verdict" id="verdict" hidden></section>

  <section class="report" aria-live="polite">
    <h2>我的成績碼</h2>
    <div class="prog" id="prog"></div>
    <span class="code" id="code"></span>
    <button class="btn" id="b-copy" type="button">複製成績碼</button>
    <span class="copied" id="copied"></span>
    <p class="small" style="width:100%">每過一關成績碼都會更新。做完後把<strong>最新的</strong>成績碼交給老師。</p>
  </section>
</div>

<script src="../assets/codec.js"></script>
<script>
const WEEK=1;

const ROUNDS=[
 {lv:1,name:'第 1 單',says:'我要 1 杯紅茶（25 元），加珍珠（10 元）。',
  wall:{11:'單價',12:'加料'},tests:[{11:25,12:10},{11:40,12:15}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'加上「加料」',op:'add',c:12},{t:'送到出餐口',op:'out'}],sol:[0,1,2]},
 {lv:1,name:'第 2 單',says:'2 杯珍奶（每杯 60 元），再加一份布丁（10 元）。',tip:'先乘還是先加，算出來一樣嗎？',
  wall:{11:'單價',12:'杯數',13:'加料'},tests:[{11:60,12:2,13:10},{11:50,12:3,13:5}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'乘上「杯數」',op:'mul',c:12},{t:'加上「加料」',op:'add',c:13},{t:'送到出餐口',op:'out'}],sol:[0,1,2,3]},
 {lv:2,name:'錢夠不夠？',says:'3 杯珍奶（每杯 60 元）加布丁（10 元）。我只有 150 元，夠嗎？',tip:'盒子裡有一張用不到的卡。',
  wall:{11:'單價',12:'杯數',13:'加料',14:'預算'},tests:[{11:60,12:3,13:10,14:150},{11:60,12:2,13:10,14:150}],
  cards:[{t:'拿「單價」',op:'load',c:11},{t:'乘上「杯數」',op:'mul',c:12},{t:'加上「加料」',op:'add',c:13},{t:'和「預算」比大小',op:'cmp',c:14},{t:'店長決定：比預算大就說「錢不夠」，不然就出餐',op:'judge'},{t:'減掉「預算」',op:'sub',c:14}],sol:[0,1,2,3,4]},
 {lv:2,name:'班級團購',says:'全班要紅茶 3 杯（每杯 25 元）和綠茶 2 杯（每杯 30 元），一共多少？',tip:'搖飲師手上只拿得動一個數字，算好的先寫回牆上的空格。',
  wall:{10:'暫存（空格）',11:'紅茶單價',12:'紅茶杯數',13:'綠茶單價',14:'綠茶杯數'},tests:[{10:null,11:25,12:3,13:30,14:2},{10:null,11:20,12:4,13:35,14:1}],
  cards:[{t:'拿「紅茶單價」',op:'load',c:11},{t:'乘上「紅茶杯數」',op:'mul',c:12},{t:'寫回牆上「暫存」格',op:'store',c:10},{t:'拿「綠茶單價」',op:'load',c:13},{t:'乘上「綠茶杯數」',op:'mul',c:14},{t:'加上「暫存」',op:'add',c:10},{t:'送到出餐口',op:'out'}],sol:[0,1,2,3,4,5,6]}
];

let level=1, ri=0, slots=[], order=[], wall={}, powerOff=false, running=false;
const done=new Set();
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

function shuffle(n){
  const a=[...Array(n).keys()];
  do{for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(n>1&&a.every((v,i)=>v===i));
  return a;
}

// 執行一串卡片：回傳每一步的說明和出餐結果
function run(seq,data){
  const R=ROUNDS[ri], mem={...data}; let acc=null, flag=null; const steps=[], outs=[];
  const name=c=>R.wall[c].replace(/（.*）/,'');
  for(const k of seq){
    const cd=R.cards[k]; const s={k,cell:cd.c??null};
    const v=cd.c!=null?mem[cd.c]:null;
    s.cu='看懂這張：「'+cd.t+'」';
    if(['load','add','mul','sub','cmp'].includes(cd.op)&&(v==null)){
      s.alu='第 '+pad(cd.c)+' 號格是空的，拿不到數字！';s.bad=true;steps.push(s);break;
    }
    if(['add','mul','sub','cmp','store'].includes(cd.op)&&acc==null){
      s.alu='手上還沒有數字，沒辦法做這件事！';s.bad=true;steps.push(s);break;
    }
    switch(cd.op){
      case 'load':acc=v;s.cu+='，叫搖飲師去拿 '+pad(cd.c)+' 號格。';s.alu='拿到 '+v;s.who='alu';break;
      case 'add':s.alu=acc+' + '+v+' = '+(acc+v);acc+=v;s.cu+='，叫搖飲師加。';s.who='alu';break;
      case 'mul':s.alu=acc+' × '+v+' = '+(acc*v);acc*=v;s.cu+='，叫搖飲師乘。';s.who='alu';break;
      case 'sub':s.alu=acc+' − '+v+' = '+(acc-v);acc-=v;s.cu+='，叫搖飲師減。';s.who='alu';break;
      case 'cmp':flag=acc>v?'比較大':acc===v?'一樣':'比較小';s.alu=acc+' 和 '+v+' 比：'+flag;s.cu+='，叫搖飲師比大小。';s.who='alu';break;
      case 'store':mem[cd.c]=acc;s.cu+='，把 '+acc+' 寫到 '+pad(cd.c)+' 號格。';s.alu='放下 '+acc+'，手空了';s.write=acc;s.who='cu';acc=null;break;
      case 'judge':
        if(flag==null){s.cu='想決定，但還沒比過大小，不知道怎麼辦！';s.bad=true;steps.push(s);return {steps,outs,mem};}
        if(flag==='比較大'){s.cu='剛剛比的結果是「比較大」，決定說：錢不夠！';outs.push('錢不夠');s.out='錢不夠！'}
        else{s.cu='剛剛比的結果是「'+flag+'」，決定出餐。';outs.push(acc);s.out=acc+' 元'}
        s.who='cu';break;
      case 'out':
        if(acc==null){s.cu+='，可是搖飲師手上沒東西。';s.bad=true;steps.push(s);return {steps,outs,mem}}
        s.cu+='，送去出餐口。';outs.push(acc);s.out=acc+' 元';s.who='out';break;
    }
    s.hand=acc;steps.push(s);
  }
  return {steps,outs,mem};
}

function renderRounds(){
  $('rounds').innerHTML=ROUNDS.map((r,i)=>r.lv!==level?'':'<button type="button" data-i="'+i+'" aria-pressed="'+(i===ri)+'">'+r.name+(done.has(i)?' <span class="done">✓</span>':'')+'</button>').join('');
  $('rounds').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!running)load(+b.dataset.i)});
}

function renderWall(hit){
  const R=ROUNDS[ri];
  $('wall').innerHTML=Object.keys(R.wall).map(c=>{
    const v=powerOff?null:wall[c];
    return '<div class="cell'+(+c===hit?' hit':'')+'"><span class="addr">#'+pad(c)+'</span><span class="lab">'+R.wall[c]+'</span><span class="val">'+(v==null?'':v)+'</span></div>';
  }).join('');
}

function renderCards(now,bad){
  const R=ROUNDS[ri];
  $('pool').innerHTML=order.map(k=>'<button type="button" class="card'+(slots.includes(k)?' used':'')+'" data-k="'+k+'"'+(slots.includes(k)?' tabindex="-1" aria-hidden="true"':'')+'>'+R.cards[k].t+'</button>').join('');
  $('pool').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(running)return;const k=+b.dataset.k;if(!slots.includes(k)){slots.push(k);resetStage();renderCards()}});
  const n=R.sol.length;
  let h='';
  for(let i=0;i<n;i++){
    const k=slots[i];
    h+='<div class="slot'+(i===now?(bad?' now bad':' now'):'')+'"><span class="n">'+(i+1)+'</span>'+(k==null?'<span class="empty">放第 '+(i+1)+' 張</span>':'<button type="button" class="card" data-s="'+i+'">'+R.cards[k].t+'</button>')+'</div>';
  }
  $('slots').innerHTML=h;
  $('slots').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(running)return;slots.splice(+b.dataset.s,1);resetStage();renderCards()});
  $('b-run').disabled=running||slots.length<n;
  $('b-clear').disabled=running||!slots.length;
}

function resetStage(){
  ['u-cu','u-alu','u-out'].forEach(id=>$(id).classList.remove('on'));
  $('cu-say').textContent='等你排好單子。';$('alu-say').textContent='';$('hand').textContent='空手';
  $('outv').textContent='—';$('outv').classList.remove('no');$('verdict').hidden=true;
}

function load(i){
  ri=i;const R=ROUNDS[i];
  wall={...R.tests[0]};powerOff=false;$('b-on').hidden=true;$('b-off').hidden=false;
  $('powernote').textContent='每一格都有號碼（位址），店長靠號碼找資料。';
  slots=[];order=shuffle(R.cards.length);
  $('says').textContent=R.says+(R.tip?'　（提示：'+R.tip+'）':'');
  renderRounds();renderWall();resetStage();renderCards();
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){
  if(running)return; running=true; resetStage(); renderCards();
  const R=ROUNDS[ri];
  if(!powerOff&&!done.has(ri)){prog.tries[ri]=Math.min(15,prog.tries[ri]+1);saveProg()}
  const data=powerOff?Object.fromEntries(Object.keys(R.wall).map(c=>[c,null])):R.tests[0];
  const res=run(slots,data);
  const T=matchMedia('(prefers-reduced-motion: reduce)').matches?450:1100;
  let shown={...data};
  for(let i=0;i<res.steps.length;i++){
    const s=res.steps[i];
    renderCards(i,s.bad);
    ['u-cu','u-alu','u-out'].forEach(id=>$(id).classList.remove('on'));
    $('u-cu').classList.add('on'); $('cu-say').textContent=s.cu; $('alu-say').textContent='';
    if(s.cell!=null) {wall=shown;renderWall(s.cell)}
    await wait(T*0.55);
    if(s.alu){$('u-alu').classList.add('on');$('alu-say').textContent=s.alu}
    if(s.write!=null){shown={...shown,[s.cell]:s.write};wall=shown;renderWall(s.cell)}
    $('hand').textContent=s.hand==null?'空手':s.hand;
    if(s.out){$('u-out').classList.add('on');$('outv').textContent=s.out;$('outv').classList.toggle('no',s.out==='錢不夠！')}
    await wait(T);
  }
  renderWall();
  verdict(res);
  running=false; renderCards();
}

function verdict(res){
  const R=ROUNDS[ri], v=$('verdict');
  const expect=t=>run(R.sol,t).outs;
  const fmt=o=>o.length?o.map(x=>x==='錢不夠'?'錢不夠！':x+' 元').join('、'):'沒有出餐';
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  let ok, h='';
  if(powerOff){
    ok=false;
    h='<h3>店裡停電了</h3><p>點單牆斷電後全部清空，店長和搖飲師什麼都拿不到。這就是主記憶體（RAM）的特性：沒電就忘光。按「開店」把招牌上的內容掛回去再試一次。</p>';
  } else {
    const e1=expect(R.tests[0]), ok1=same(res.outs,e1);
    const t2=R.tests[1], e2=expect(t2), ok2=same(run(slots,t2).outs,e2);
    ok=ok1&&ok2;
    if(ok){
      done.add(ri); prog.mask|=1<<ri; prog.time=Date.now(); saveProg();
      const cu=res.steps.length, alu=res.steps.filter(s=>s.alu&&!s.bad&&R.cards[s.k].op!=='store').length;
      h='<h3>過關！</h3><p>出餐：'+fmt(res.outs)+'。換另一位客人（'+Object.entries(t2).filter(([c])=>c!=='10').map(([c,x])=>R.wall[c]+' '+x).join('、')+'）也對：'+fmt(e2)+'。</p>'+
        '<p>店長看了 '+cu+' 張單、搖飲師動手 '+alu+' 次。你的手機處理器一秒能做這種事大約 30 億次。</p>';
      const next=ROUNDS.findIndex((r,i)=>i>ri&&r.lv===level);
      h+='<div class="btns">'+(next>=0?'<button class="btn primary" id="b-next">下一單</button>':(level===1?'<button class="btn primary" id="b-lv2">挑戰進階關</button>':'<p><strong>全部完成，你已經是合格的店長了。</strong></p>'))+'</div>';
      renderRounds();
      v.className='verdict ok';v.innerHTML=h;v.hidden=false;
      if($('b-next'))$('b-next').onclick=()=>load(next);
      if($('b-lv2'))$('b-lv2').onclick=()=>$('tab-2').click();
      return;
    }
    if(!ok1) h='<h3>客人說：「不對吧？」</h3><p>應該出餐 '+fmt(e1)+'，你的順序做出來是 '+fmt(res.outs)+'。看看是哪一步開始不對，調整順序再試一次。</p>';
    else h='<h3>差一點！</h3><p>這位客人剛好對了，但換一位客人就錯：應該 '+fmt(e2)+'，你的順序做出 '+fmt(run(slots,t2).outs)+'。想想順序或是哪張卡不該用。</p>';
  }
  v.className='verdict no';v.innerHTML=h;v.hidden=false;
}

$('b-run').onclick=play;
$('b-clear').onclick=()=>{slots=[];resetStage();renderCards()};
$('b-off').onclick=()=>{if(running)return;powerOff=true;$('b-off').hidden=true;$('b-on').hidden=false;$('powernote').textContent='停電了！牆上的東西全都不見。';resetStage();renderWall()};
$('b-on').onclick=()=>{if(running)return;powerOff=false;wall={...ROUNDS[ri].tests[0]};$('b-on').hidden=true;$('b-off').hidden=false;$('powernote').textContent='開店：照門口招牌（ROM）把內容掛回牆上。招牌斷電也不會消失。';resetStage();renderWall()};
function setLevel(l){level=l;$('tab-1').setAttribute('aria-selected',l===1);$('tab-2').setAttribute('aria-selected',l===2);load(ROUNDS.findIndex(r=>r.lv===l))}
$('tab-1').onclick=()=>{if(!running)setLevel(1)};
$('tab-2').onclick=()=>{if(!running)setLevel(2)};

// ===== 班級座號與進度 =====
let ident=null, prog={mask:0,tries:[0,0,0,0],time:Date.now()};
const KEY=()=>'it9:w'+WEEK+':'+ident.cls+'-'+ident.seat;
function saveProg(){try{localStorage.setItem(KEY(),JSON.stringify(prog));localStorage.setItem('it9:last',JSON.stringify(ident))}catch(e){}renderReport()}
function renderReport(){
  if(!ident)return;
  $('prog').innerHTML=ROUNDS.map((r,i)=>'<span class="'+(prog.mask&(1<<i)?'ok':'')+'">'+(r.lv===1?'基礎':'進階')+'・'+r.name+(prog.mask&(1<<i)?' ✓':'')+'</span>').join('');
  $('code').textContent=CODEC.encode({week:WEEK,cls:ident.cls,seat:ident.seat,mask:prog.mask,tries:prog.tries,time:prog.time});
  $('copied').textContent='';
}
$('b-copy').onclick=()=>{
  const t=$('code').textContent;
  const sel=()=>{const r=document.createRange();r.selectNodeContents($('code'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copied').textContent='已選取，按 Ctrl+C 複製'};
  try{navigator.clipboard.writeText(t).then(()=>{$('copied').textContent='已複製'},sel)}catch(e){sel()}
};
const digits=el=>{const f=()=>{const v=el.value.replace(/\D/g,'');if(v!==el.value)el.value=v};el.addEventListener('input',f);el.addEventListener('compositionend',f);el.addEventListener('blur',f)};
digits($('in-cls'));digits($('in-seat'));
function check(){
  const c=$('in-cls').value, s=$('in-seat').value;
  if(!/^[1-9]\d{2}$/.test(c)) return '班級要填三位數字，例如 901。';
  if(!/^\d{1,2}$/.test(s)||+s<1||+s>60) return '座號要填 1～60 的數字。';
  return null;
}
$('g-next').onclick=()=>{
  const e=check();$('gerr').textContent=e||'';if(e)return;
  $('g-confirm').textContent='你是 '+$('in-cls').value+' 班 '+(+$('in-seat').value)+' 號，對嗎？';
  $('g-step1').hidden=true;$('g-step2').hidden=false;$('in-cls').disabled=true;$('in-seat').disabled=true;$('g-go').focus();
};
['in-cls','in-seat'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('g-next').click()}));
$('g-back').onclick=()=>{$('g-step1').hidden=false;$('g-step2').hidden=true;$('in-cls').disabled=false;$('in-seat').disabled=false;$('in-cls').focus()};
$('g-go').onclick=()=>start({cls:+$('in-cls').value,seat:+$('in-seat').value});
function start(id){
  ident=id; prog={mask:0,tries:[0,0,0,0],time:Date.now()};
  try{const p=JSON.parse(localStorage.getItem(KEY())||'null');if(p&&Array.isArray(p.tries))prog=p}catch(e){}
  done.clear();for(let i=0;i<4;i++)if(prog.mask&(1<<i))done.add(i);
  $('who').textContent=id.cls+' 班 '+id.seat+' 號';
  $('gate').hidden=true;$('main').hidden=false;
  setLevel(1);renderReport();
}
$('b-swap').onclick=()=>{if(running)return;ident=null;$('main').hidden=true;$('gate').hidden=false;$('g-back').click();$('in-cls').value='';$('in-seat').value='';$('gerr').textContent=''};
$('in-cls').focus();
</script>
